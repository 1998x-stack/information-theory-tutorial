<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rw19-title rw19-desc" viewBox="0 0 920 400"><title id="rw19-title">反向注水：水位 θ 决定每个分量保留多少</title><desc id="rw19-desc">四个高斯分量的方差不同。低于水位 θ=1.5 的分量被保留，失真等于 θ；高于 θ 的分量完全不传，失真等于自身方差。柱高表示方差，填充高度表示被保留的部分。</desc><rect x="1" y="1" width="918" height="398" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="34" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750" text-anchor="start">反向注水：失真预算 D 的分配</text><path d="M120 90V330H820" stroke="#9fb4b0" stroke-width="1.6" fill="none"/><rect x="160" y="295" width="90" height="35" rx="6" fill="#eef4f7" stroke="#53676d" stroke-width="1.4"/><rect x="160" y="295" width="90" height="35" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.4"/><text x="205" y="352" font-family="ui-monospace,monospace" font-size="13" fill="#53676d" text-anchor="middle">分量1</text><text x="205" y="368" font-family="ui-monospace,monospace" font-size="12" fill="#147f80" text-anchor="middle">σ²=0.5</text><rect x="330" y="260" width="90" height="70" rx="6" fill="#eef4f7" stroke="#53676d" stroke-width="1.4"/><rect x="330" y="260" width="90" height="70" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.4"/><text x="375" y="352" font-family="ui-monospace,monospace" font-size="13" fill="#53676d" text-anchor="middle">分量2</text><text x="375" y="368" font-family="ui-monospace,monospace" font-size="12" fill="#147f80" text-anchor="middle">σ²=1</text><rect x="500" y="169" width="90" height="161" rx="6" fill="#eef4f7" stroke="#53676d" stroke-width="1.4"/><rect x="500" y="225" width="90" height="105" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.4"/><text x="545" y="352" font-family="ui-monospace,monospace" font-size="13" fill="#53676d" text-anchor="middle">分量3</text><text x="545" y="368" font-family="ui-monospace,monospace" font-size="12" fill="#147f80" text-anchor="middle">σ²=2.3</text><rect x="670" y="232" width="90" height="98" rx="6" fill="#eef4f7" stroke="#53676d" stroke-width="1.4"/><rect x="670" y="232" width="90" height="98" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.4"/><text x="715" y="352" font-family="ui-monospace,monospace" font-size="13" fill="#53676d" text-anchor="middle">分量4</text><text x="715" y="368" font-family="ui-monospace,monospace" font-size="12" fill="#147f80" text-anchor="middle">σ²=1.4</text><path d="M120 225H820" stroke="#d06d4d" stroke-width="2" fill="none" stroke-dasharray="7 5"/><text x="828" y="230" font-family="ui-monospace,monospace" font-size="13" fill="#c15a3c" text-anchor="start">θ=1.5</text><text x="30" y="388" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="start">绿色=保留（失真=θ），仅柱顶灰色部分被丢弃（失真=σ²）。方差越大越值得花比特。</text></svg>