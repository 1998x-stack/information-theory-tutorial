<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crcs16-title crcs16-desc" viewBox="0 0 920 320"><title id="crcs16-title">系统 CRC：左移取余再拼接，接收端重算余数</title><desc id="crcs16-desc">数据 1101 左移三位得到 1101000，对生成多项式 1011 取余得 001，拼成码字 1101001；接收端对整帧重算余数，为零则接受。</desc><rect x="1" y="1" width="918" height="318" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="40" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="21" font-weight="750" text-anchor="start">系统 CRC：发送端（上）与接收端（下）</text><path d="M28 55H892" stroke="#dce8e4" stroke-width="1" fill="none"/><g font-family="system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><rect x="40" y="86" width="150" height="56" rx="9" fill="#eef4f7" stroke="#53676d" stroke-width="1.5"/><text x="115" y="112" fill="#53676d" font-size="13">数据 d</text><text x="115" y="132" fill="#203035" font-size="18">1101</text><rect x="250" y="86" width="170" height="56" rx="9" fill="#eef4f7" stroke="#53676d" stroke-width="1.5"/><text x="335" y="112" fill="#53676d" font-size="13">左移 r=3 位</text><text x="335" y="132" fill="#203035" font-size="18">1101000</text><rect x="480" y="86" width="180" height="56" rx="9" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="570" y="112" fill="#147f80" font-size="13">mod g=1011</text><text x="570" y="132" fill="#147f80" font-size="18">余数 001</text><rect x="720" y="86" width="160" height="56" rx="9" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.8"/><text x="800" y="112" fill="#d06d4d" font-size="13">拼接发出</text><text x="800" y="132" fill="#d06d4d" font-size="18">1101 001</text></g><path d="M190 114H244" stroke="#7461ba" stroke-width="2.5" fill="none"/><path d="M238 108l10 6-10 6z" fill="#7461ba"/><path d="M420 114H474" stroke="#7461ba" stroke-width="2.5" fill="none"/><path d="M468 108l10 6-10 6z" fill="#7461ba"/><path d="M660 114H714" stroke="#7461ba" stroke-width="2.5" fill="none"/><path d="M708 108l10 6-10 6z" fill="#7461ba"/><path d="M800 150V196" stroke="#7461ba" stroke-width="2.5" fill="none"/><path d="M794 190l6 10 6-10z" fill="#7461ba"/><g font-family="system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><rect x="40" y="204" width="200" height="56" rx="9" fill="#eef4f7" stroke="#53676d" stroke-width="1.5"/><text x="140" y="230" fill="#53676d" font-size="13">收到帧 r = 1101001</text><text x="140" y="250" fill="#203035" font-size="17">mod g=1011</text><rect x="300" y="204" width="230" height="56" rx="9" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="415" y="230" fill="#147f80" font-size="13">余数 = 000</text><text x="415" y="250" fill="#147f80" font-size="18">接受该帧</text><rect x="590" y="204" width="290" height="56" rx="9" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.8"/><text x="735" y="230" fill="#d06d4d" font-size="13">余数 ≠ 0</text><text x="735" y="250" fill="#d06d4d" font-size="17">拒绝并请求重传</text></g><path d="M240 232H294" stroke="#7461ba" stroke-width="2.5" fill="none"/><path d="M288 226l10 6-10 6z" fill="#7461ba"/><path d="M530 232H584" stroke="#7461ba" stroke-width="2.5" fill="none"/><path d="M578 226l10 6-10 6z" fill="#7461ba"/><text x="30" y="296" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14" font-weight="500" text-anchor="start">本例 g(x)=x³+x+1，初始寄存器为 0 且无末尾异或；真实标准另有初值与末尾异或参数。</text></svg>
