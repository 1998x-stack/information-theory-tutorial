<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ham15c-title ham15c-desc" viewBox="0 0 920 380"><title id="ham15c-title">完美单错码：16个半径1的汉明球恰好覆盖128个7位字</title><desc id="ham15c-desc">七位空间有128个二进制向量；每条码字的汉明半径1球包含1条零错词和7条单错词，共8条；Hamming(7,4)有16个码字，16×8=128且球互不重叠。</desc><rect x="1" y="1" width="918" height="378" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="21" font-weight="750" text-anchor="start">完美单错码：16个半径1的汉明球恰好覆盖128个7位字</text><path d="M28 53H892" stroke="#dce8e4" stroke-width="1" fill="none"/><rect x="26" y="98" width="870" height="210" rx="10" stroke="#dce8e4" stroke-width="1.5" fill="white"/><rect x="43" y="118" width="93" height="80" rx="8" stroke="#147f80" stroke-width="1.5" fill="#e7f5f2"/><text x="89" y="145" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="13" font-weight="750" text-anchor="middle">码字 1</text><text x="89" y="177" font-family="system-ui,'PingFang SC',sans-serif" fill="#147f80" font-size="12" font-weight="750" text-anchor="middle">8 个接收词</text><rect x="149" y="118" width="93" height="80" rx="8" stroke="#7461ba" stroke-width="1.5" fill="#eeeaff"/><text x="195" y="145" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="13" font-weight="750" text-anchor="middle">码字 2</text><text x="195" y="177" font-family="system-ui,'PingFang SC',sans-serif" fill="#7461ba" font-size="12" font-weight="750" text-anchor="middle">8 个接收词</text><rect x="255" y="118" width="93" height="80" rx="8" stroke="#147f80" stroke-width="1.5" fill="#e7f5f2"/><text x="301" y="145" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="13" font-weight="750" text-anchor="middle">码字 3</text><text x="301" y="177" font-family="system-ui,'PingFang SC',sans-serif" fill="#147f80" font-size="12" font-weight="750" text-anchor="middle">8 个接收词</text><rect x="361" y="118" width="93" height="80" rx="8