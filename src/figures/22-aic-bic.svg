<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ab22-title ab22-desc" viewBox="0 0 920 350"><title id="ab22-title">AIC 与 BIC 随多项式阶数变化，最小值位置不同</title><desc id="ab22-desc">横轴为多项式阶数，纵轴为准则值（归一化）。AIC 与 BIC 都在低阶附近最小，但 BIC 的惩罚更重，最小值出现在更低阶。</desc><rect x="1" y="1" width="918" height="348" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="36" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750" text-anchor="start">AIC vs BIC：惩罚项不同，最小值不同</text><path d="M160 70V300H830" stroke="#9fb4b0" stroke-width="1.5"/><polyline points="160.0,90.1 284.0,300.0 408.0,286.0 532.0,272.2 656.0,273.0 780.0,273.1" fill="none" stroke="#147f80" stroke-width="2.6"/><polyline points="160.0,70.0 284.0,269.9 408.0,245.8 532.0,222.0 656.0,212.7 780.0,202.7" fill="none" stroke="#d06d4d" stroke-width="2.6"/><circle cx="160.0" cy="90.1" r="4" fill="#147f80"/><circle cx="160.0" cy="70.0" r="4" fill="#d06d4d"/><text x="160.0" y="322" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">1</text><circle cx="284.0" cy="300.0" r="4" fill="#147f80"/><circle cx="284.0" cy="269.9" r="4" fill="#d06d4d"/><text x="284.0" y="322" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">2</text><circle cx="408.0" cy="286.0" r="4" fill="#147f80"/><circle cx="408.0" cy="245.8" r="4" fill="#d06d4d"/><text x="408.0" y="322" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">3</text><circle cx="532.0" cy="272.2" r="4" fill="#147f80"/><circle cx="532.0" cy="222.0" r="4" fill="#d06d4d"/><text x="532.0" y="322" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">4</text><circle cx="656.0" cy="273.0" r="4" fill="#147f80"/><circle cx="656.0" cy="212.7" r="4" fill="#d06d4d"/><text x="656.0" y="322" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">5</text><circle cx="780.0" cy="273.1" r="4" fill="#147f80"/><circle cx="780.0" cy="202.7" r="4" fill="#d06d4d"/><text x="780.0" y="322" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">6</text><text x="620" y="110" font-family="system-ui,sans-serif" fill="#147f80" font-size="15" font-weight="700" text-anchor="start">AIC</text><text x="700" y="110" font-family="system-ui,sans-serif" fill="#c15a3c" font-size="15" font-weight="700" text-anchor="start">BIC</text><text x="160" y="340" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="start">真实模型为二次；固定数据集（n=30，seed=42）。纵轴为相对值，只为比较形状。</text></svg>