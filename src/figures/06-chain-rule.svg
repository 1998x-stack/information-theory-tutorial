<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c06c-title c06c-desc" viewBox="0 0 920 380"><title id="c06c-title">三个比特不等于三比特新信息</title><desc id="c06c-desc">X1为公平比特，X2复制X1，X3是独立公平比特。三个变量各自熵为1bit，但联合熵为2bits。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.4"/><text x="26" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#203035" text-anchor="start">三个比特不等于三比特新信息</text><path d="M26 54H894" stroke="#dce8e4"/><rect x="36" y="105" width="248" height="151" rx="12" fill="#e7f5f2" stroke="#147f80" stroke-width="1.4"/><text x="160" y="145" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#203035" text-anchor="middle">X₁</text><text x="160" y="184" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#147f80" text-anchor="middle">新信息 1 bit</text><text x="160" y="219" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" fill="#53676d" text-anchor="middle">输入：公平比特</text><path d="M289 181 L322 181 m-10 -6 l10 6 -10 6" stroke="#147f80" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="333" y="105" width="248" height="151" rx="12" fill="#eeeaff" stroke="#7461ba" stroke-width="1.4"/><text x="457" y="145" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#203035" text-anchor="middle">X₂ = X₁</text><text x="457" y="184" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#7461ba" text-anchor="middle">新增 0 bit</text><text x="457" y="219" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" fill="#53676d" text-anchor="middle">第二位只是复制</text><path d="M586 181 L619 181 m-10 -6 l10 6 -10 6" stroke="#7461ba" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="630" y="105" width="248" height="151" rx="12" fill="#fff1eb" stroke="#d06d4d" stroke-width="1.4"/><text x="754" y="145" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#203035" text-anchor="middle">X₃</text><text x="754" y="184" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#d06d4d" text-anchor="middle">新增 1 bit</text><text x="754" y="219" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" fill="#53676d" text-anchor="middle">新的独立抛硬币</text><text x="35" y="317" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" font-weight="700" fill="#147f80" text-anchor="start">H(X₁,X₂,X₃) = 1 + 0 + 1 = 2 bits</text><text x="35" y="350" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" fill="#53676d" text-anchor="start">计算的是新增条件信息，不是把三个边缘熵直接相加。</text></svg>
