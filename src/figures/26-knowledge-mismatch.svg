<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f26c-title f26c-desc" viewBox="0 0 960 400"><title id="f26c-title">知识版本不一致：零比特错误也可能误解</title><desc id="f26c-desc">同一个消息 token C1，在发送者和接收者使用不同版本的映射表 K 时触发不同任务行为。</desc><rect x="1.5" y="1.5" width="957" height="397" rx="20" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="30" y="44" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" font-weight="750" fill="#203035">知识版本不一致：零比特错误也可能误解</text><path d="M30 59H930" stroke="#dce8e4" stroke-width="1.4"/><rect x="46" y="109" width="286" height="209" rx="11" fill="#eeebfa" stroke="#7461ba" stroke-width="2"/><rect x="627" y="109" width="286" height="209" rx="11" fill="#ffede5" stroke="#d06d4d" stroke-width="2"/><text x="189" y="147" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" fill="#7461ba">发送端 Kᵥ₁</text><text x="769" y="147" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" fill="#d06d4d">接收端 Kᵥ₂</text><text x="189" y="200" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" fill="#203035">C1 → ALERT</text><text x="769" y="200" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" fill="#203035">C1 → NORMAL</text><text x="189" y="266" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#53676d">发送物理 token：C1</text><text x="769" y="266" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#d06d4d">解读动作错误</text><path d="M332 220H627" fill="none" stroke="#147f80" stroke-linecap="round" stroke-width="4" /><rect x="408" y="176" width="145" height="54" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="2"/><text x="480" y="208" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="750" fill="#147f80">100% 正确收包</text><text x="479" y="365" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" fill="#203035">通信可靠性 ≠ 语义协议一致性</text></svg>