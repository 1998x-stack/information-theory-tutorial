<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f27c-title f27c-desc" viewBox="0 0 960 400"><title id="f27c-title">传递熵：从 X 过去到 Y 未来</title><desc id="f27c-desc">单步模型 Y_{t+1}=X_t XOR E_t；在已知 Y_t 的条件下，X_t 额外贡献 1−h₂(q) bit。</desc><rect x="1.5" y="1.5" width="957" height="397" rx="20" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="30" y="44" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" font-weight="750" fill="#203035">传递熵：从 X 过去到 Y 未来</text><path d="M30 59H930" stroke="#dce8e4" stroke-width="1.4"/><rect x="44" y="115" width="225" height="64" rx="11" fill="#eeebfa" stroke="#7461ba" stroke-width="2"/><rect x="44" y="258" width="225" height="64" rx="11" fill="#ffede5" stroke="#d06d4d" stroke-width="2"/><rect x="715" y="115" width="208" height="64" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="2"/><text x="156" y="156" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" fill="#7461ba">Xₜ：独立源</text><text x="156" y="299" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" fill="#d06d4d">Yₜ：目标过去</text><text x="818" y="156" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" fill="#147f80">Yₜ₊₁：目标未来</text><rect x="392" y="116" width="175" height="64" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="2"/><text x="479" y="156" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" fill="#147f80">⊕ Eₜ</text><path d="M269 147H384M567 147H707" fill="none" stroke="#7461ba" stroke-linecap="round" stroke-width="3" /><path d="M269 290H633V180H707" fill="none" stroke="#d06d4d" stroke-linecap="round" stroke-width="2.8" stroke-dasharray="6 5"/><text x="485" y="232" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" fill="#203035">T(X→Y)=I(Yₜ₊₁;Xₜ|Yₜ)</text><text x="480" y="357" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#53676d">红色虚线代表条件化的 Y 历史，不是第二条因果路径</text></svg>