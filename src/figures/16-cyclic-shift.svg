<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cs16-title cs16-desc" viewBox="0 0 920 330"><title id="cs16-title">循环移位等价于乘以 x 后模 xⁿ−1</title><desc id="cs16-desc">七位码字 c0 到 c6 排成一行，右移一位后 c6 回卷到首位，其余依次右移；多项式视角是乘 x 并令 x 的七次方等于 1 后卷绕。</desc><rect x="1" y="1" width="918" height="328" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="40" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="21" font-weight="750" text-anchor="start">循环移位：把码字卷成一个环</text><path d="M28 55H892" stroke="#dce8e4" stroke-width="1" fill="none"/><text x="60" y="96" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="16" font-weight="600" text-anchor="start">码字 c(x) = c₀ + c₁x + … + c₆x⁶</text><g font-family="system-ui,sans-serif" font-size="18" font-weight="700" text-anchor="middle"><rect x="60" y="112" width="52" height="52" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="86" y="146" fill="#147f80">c₀</text><rect x="124" y="112" width="52" height="52" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="150" y="146" fill="#147f80">c₁</text><rect x="188" y="112" width="52" height="52" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="214" y="146" fill="#147f80">c₂</text><rect x="252" y="112" width="52" height="52" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="278" y="146" fill="#147f80">c₃</text><rect x="316" y="112" width="52" height="52" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="342" y="146" fill="#147f80">c₄</text><rect x="380" y="112" width="52" height="52" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="406" y="146" fill="#147f80">c₅</text><rect x="444" y="112" width="52" height="52" rx="8" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.8"/><text x="470" y="146" fill="#d06d4d">c₆</text></g><path d="M512 138H596" stroke="#7461ba" stroke-width="3" fill="none"/><path d="M588 131l12 7-12 7z" fill="#7461ba"/><text x="554" y="126" font-family="system-ui,'PingFang SC',sans-serif" fill="#7461ba" font-size="16" font-weight="700" text-anchor="middle">×x mod (x⁷−1)</text><g font-family="system-ui,sans-serif" font-size="18" font-weight="700" text-anchor="middle"><rect x="620" y="112" width="52" height="52" rx="8" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.8"/><text x="646" y="146" fill="#d06d4d">c₆</text><rect x="684" y="112" width="52" height="52" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="710" y="146" fill="#147f80">c₀</text><rect x="748" y="112" width="52" height="52" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="774" y="146" fill="#147f80">c₁</text><rect x="812" y="112" width="52" height="52" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="838" y="146" fill="#147f80">c₂</text></g><path d="M470 172 C470 232 646 232 646 168" stroke="#d06d4d" stroke-width="1.8" fill="none" stroke-dasharray="5 4"/><text x="558" y="238" font-family="system-ui,'PingFang SC',sans-serif" fill="#c15a3c" font-size="15" font-weight="600" text-anchor="middle">末位 c₆ 回卷到首位（因为 x⁷ ≡ 1）</text><text x="30" y="300" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14" font-weight="500" text-anchor="start">前提：该码字属于某个循环码；一般比特串移位后不保证仍是码字。</text></svg>
