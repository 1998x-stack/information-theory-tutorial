<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s08b-title s08b-desc" viewBox="0 0 920 380"><title id="s08b-title">Kraft 不等式就是二进制码字占用的树空间</title><desc id="s08b-desc">二进制前缀码 0、10、110、111 对应单位区间的连续不重叠二进制子区间，宽度依次为1/2、1/4、1/8、1/8，恰好填满。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.4"/><text x="26" y="39" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" fill="#203035" font-weight="750" text-anchor="start">Kraft 不等式就是二进制码字占用的树空间</text><path d="M26 55H894" fill="none" stroke="#dce8e4" stroke-width="1" stroke-linecap="round"/><text x="64" y="93" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#53676d" font-weight="500" text-anchor="start">根区间 [0,1)</text><rect x="62" y="137" width="398" height="90" rx="2" fill="#147f80" stroke="white" stroke-width="1.4"/><text x="261" y="174" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="white" font-weight="750" text-anchor="middle">0</text><text x="261" y="207" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="white" font-weight="750" text-anchor="middle">A</text><text x="261" y="266" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" fill="#147f80" font-weight="750" text-anchor="middle">2^(-1)</text><rect x="460" y="137" width="199" height="90" rx="2" fill="#7461ba" stroke="white" stroke-width="1.4"/><text x="559.5" y="174" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" fill="white" font-weight="750" text-anchor="middle">10</text><text x="559.5" y="207" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="white" font-weight="750" text-anchor="middle">B</text><text x="559.5" y="266" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" fill="#7461ba" font-weight="750" text-anchor="middle">2^(-2)</text><rect x="659" y="137" width="99.5" height="90" rx="2" fill="#d06d4d" stroke="white" stroke-width="1.4"/><text x="708.75" y="174" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="white" font-weight="750" text-anchor="middle">110</text><text x="708.75" y="207" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="white" font-weight="750" text-anchor="middle">C</text><text x="708.75" y="266" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" fill="#d06d4d" font-weight="750" text-anchor="middle">2^(-3)</text><rect x="758.5" y="137" width="99.5" height="90" rx="2" fill="#b8892c" stroke="white" stroke-width="1.4"/><text x="808.25" y="174" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="white" font-weight="750" text-anchor="middle">111</text><text x="808.25" y="207" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="white" font-weight="750" text-anchor="middle">D</text><text x="808.25" y="266" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" fill="#b8892c" font-weight="750" text-anchor="middle">2^(-3)</text><text x="62" y="308" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" fill="#203035" font-weight="750" text-anchor="start">K = 1/2 + 1/4 + 1/8 + 1/8 = 1</text><text x="62" y="346" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#53676d" font-weight="500" text-anchor="start">如果占用总量大于 1，任何前缀码都放不下这组码长。</text></svg>
