<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="de20-title de20-desc" viewBox="0 0 920 340"><title id="de20-title">微分熵以单位区间均匀分布为参考，窄分布可为负</title><desc id="de20-desc">左图 U(0,1) 密度高度1，微分熵0比特；右图 U(0,0.25) 密度高度4，微分熵为负2比特。分布更窄但密度更高。</desc><rect x="1" y="1" width="918" height="338" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750" text-anchor="start">密度高度决定 h 的正负</text><path d="M28 54H892" stroke="#dce8e4" stroke-width="1" fill="none"/><rect x="120" y="120" width="280" height="120" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><text x="260" y="112" font-family="ui-monospace,monospace" font-size="14" fill="#147f80" text-anchor="middle">U(0,1)：f=1，h=0 bit</text><path d="M120 240H400" stroke="#9fb4b0" stroke-width="1.4"/><text x="120" y="258" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">0</text><text x="400" y="258" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">1</text><rect x="560" y="60" width="70" height="180" rx="6" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.6"/><text x="600" y="52" font-family="ui-monospace,monospace" font-size="14" fill="#c15a3c" text-anchor="middle">f=4</text><text x="700" y="120" font-family="system-ui,sans-serif" fill="#c15a3c" font-size="15" font-weight="700" text-anchor="start">U(0,0.25)</text><text x="700" y="146" font-family="system-ui,sans-serif" fill="#c15a3c" font-size="15" font-weight="700" text-anchor="start">h=−2 bit</text><path d="M560 240H840" stroke="#9fb4b0" stroke-width="1.4"/><text x="560" y="258" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">0</text><text x="630" y="258" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">0.25</text><text x="30" y="320" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="start">h 不是码长：它可正可负，且随坐标单位平移；只有差值（容量、率失真）才与单位无关。</text></svg>