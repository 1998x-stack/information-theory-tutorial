<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch12b-title ch12b-desc" viewBox="0 0 920 380"><title id="ch12b-title">BEC(ε=0.25)：擦除不是错误翻转，而是显式标记“未知”</title><desc id="ch12b-desc">输入0以概率0.75正确输出0、0.25输出擦除；输入1以概率0.75输出1、0.25输出擦除，绝不把0误读为1。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.4"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">BEC(ε=0.25)：擦除不是错误翻转，而是显式标记“未知”</text><path d="M28 54H891" stroke="#dce8e4"/><rect x="26" y="113" width="189" height="67" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.4"/><text x="119" y="154" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="middle" fill="#147f80">X=0</text><rect x="26" y="241" width="189" height="67" rx="11" fill="#eeeaff" stroke="#7461ba" stroke-width="1.4"/><text x="119" y="282" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="middle" fill="#7461ba">X=1</text><rect x="614" y="89" width="244" height="61" rx="11" fill="white" stroke="#147f80" stroke-width="1.4"/><text x="736" y="128" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#147f80">Y=0</text><rect x="614" y="172" width="244" height="61" rx="11" fill="white" stroke="#d06d4d" stroke-width="1.4"/><text x="736" y="211" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#d06d4d">Y=擦除</text><rect x="614" y="255" width="244" height="61" rx="11" fill="white" stroke="#7461ba" stroke-width="1.4"/><text x="736" y="294" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#7461ba">Y=1</text><path d="M216 144L611 118" stroke="#147f80" stroke-width="5"/><path d="M216 144L611 201" stroke="#d06d4d" stroke-width="2.3" stroke-dasharray="7 7"/><path d="M216 274L611 285" stroke="#7461ba" stroke-width="5"/><path d="M216 274L611 206" stroke="#d06d4d" stroke-width="2.3" stroke-dasharray="7 7"/><text x="366" y="105" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#147f80">0.75</text><text x="353" y="186" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#d06d4d">0.25</text><text x="353" y="289" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#7461ba">0.75</text><text x="360" y="246" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#d06d4d">0.25</text></svg>