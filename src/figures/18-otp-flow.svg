<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sec18a-title sec18a-desc" viewBox="0 0 920 380"><title id="sec18a-title">一次一密：均匀独立密钥使每条密文对明文一视同仁</title><desc id="sec18a-desc">明文M与独立均匀随机密钥K逐位异或得到密文C；接收端使用相同密钥再次异或恢复M。密钥必须等长、只用一次并安全共享。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">一次一密：均匀独立密钥使每条密文对明文一视同仁</text><path d="M28 53H892" fill="none" stroke="#dce8e4" stroke-width="1" /><rect x="32" y="119" width="157" height="85" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="110" y="151" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="middle" fill="#147f80">明文 M</text><text x="110" y="181" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#53676d">例如 1011</text><rect x="32" y="236" width="157" height="85" rx="11" fill="#eeeaff" stroke="#7461ba" stroke-width="1.5"/><text x="110" y="269" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="middle" fill="#7461ba">密钥 K</text><text x="110" y="298" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#53676d">例如 0110</text><path d="M190 161L286 202m-8 -6l8 6 -8 6" fill="none" stroke="#147f80" stroke-width="2.4" stroke-linecap="round"/><path d="M190 278L286 237m-8 -6l8 6 -8 6" fill="none" stroke="#7461ba" stroke-width="2.4" stroke-linecap="round"/><rect x="295" y="155" width="155" height="130" rx="11" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="372" y="198" font-family="system-ui,'PingFang SC',sans-serif" font-size="24" font-weight="750" text-anchor="middle" fill="#d06d4d">XOR</text><text x="372" y="235" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#203035">C = M ⊕ K</text><path d="M451 220L545 220m-8 -6l8 6 -8 6" fill="none" stroke="#d06d4d" stroke-width="2.4" stroke-linecap="round"/><rect x="555" y="155" width="156" height="130" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="633" y="198" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="middle" fill="#147f80">密文 C</text><text x="633" y="235" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#203035">1101</text><path d="M713 220L788 220m-8 -6l8 6 -8 6" fill="none" stroke="#147f80" stroke-width="2.4" stroke-linecap="round"/><rect x="798" y="155" width="90" height="130" rx="11" fill="#eeeaff" stroke="#7461ba" stroke-width="1.5"/><text x="843" y="199" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#7461ba">解密</text><text x="843" y="235" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="#203035">⊕ K</text></svg>