<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-labelledby="h09a-title h09a-desc"><title id="h09a-title">三次合并：每次挑出最小的两个权重</title><desc id="h09a-desc">对概率A0.4、B0.3、C0.2、D0.1，首先合并D+C为0.3，再合并B与CD为0.6，最后合并A与BCD为1.0。</desc><rect x="1" y="1" width="918" height="378" rx="17" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.4"/><text x="25" y="39" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">三次合并：每次挑出最小的两个权重</text><path d="M25 53H895" fill="none" stroke="#dce8e4" stroke-width="1" stroke-linecap="round"/><rect x="26" y="100" width="266" height="214" rx="10" fill="white" stroke="#dce8e4" stroke-width="1.4"/><text x="41" y="130" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="750" text-anchor="start" fill="#147f80">STEP 01</text><rect x="43" y="160" width="232" height="56" rx="10" fill="#e7f6f2" stroke="#147f80" stroke-width="1.4"/><text x="159" y="194" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#147f80">D .10 + C .20</text><path d="M158 223V248" fill="none" stroke="#147f80" stroke-width="2.5" stroke-linecap="round"/><rect x="43" y="254" width="232" height="42" rx="10" fill="white" stroke="#147f80" stroke-width="1.4"/><text x="159" y="282" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#203035">CD = .30</text><rect x="328" y="100" width="266" height="214" rx="10" fill="white" stroke="#dce8e4" stroke-width="1.4"/><text x="343" y="130" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="750" text-anchor="start" fill="#7461ba">STEP 02</text><rect x="345" y="160" width="232" height="56" rx="10" fill="#f1edfa" stroke="#7461ba" stroke-width="1.4"/><text x="461" y="194" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#7461ba">B .30 + CD .30</text><path d="M460 223V248" fill="none" stroke="#7461ba" stroke-width="2.5" stroke-linecap="round"/><rect x="345" y="254" width="232" height="42" rx="10" fill="white" stroke="#7461ba" stroke-width="1.4"/><text x="461" y="282" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#203035">BCD = .60</text><rect x="630" y="100" width="266" height="214" rx="10" fill="white" stroke="#dce8e4" stroke-width="1.4"/><text x="645" y="130" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="750" text-anchor="start" fill="#d06d4d">STEP 03</text><rect x="647" y="160" width="232" height="56" rx="10" fill="#fff1e9" stroke="#d06d4d" stroke-width="1.4"/><text x="763" y="194" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#d06d4d">A .40 + BCD .60</text><path d="M762 223V248" fill="none" stroke="#d06d4d" stroke-width="2.5" stroke-linecap="round"/><rect x="647" y="254" width="232" height="42" rx="10" fill="white" stroke="#d06d4d" stroke-width="1.4"/><text x="763" y="282" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#203035">根节点 = 1.00</text><text x="25" y="354" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">两项权重相等时可选择不同次序，最优平均码长不受该图中同权选边影响。</text></svg>
