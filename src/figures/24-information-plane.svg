<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ip24t ip24d" viewBox="0 0 920 380"><title id="ip24t">信息平面上的两阶段轨迹</title><desc id="ip24d">横轴 I(X;T)，纵轴 I(T;Y)。拟合阶段轨迹向右上快速移动，两层都上升；压缩阶段轨迹向左移动，I(X;T) 下降而 I(T;Y) 保持或略升。浅层压缩少，深层压缩多。</desc><rect x="1" y="1" width="918" height="378" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750">信息平面：拟合阶段与压缩阶段</text><path d="M150 70V320H840" stroke="#9fb4b0" stroke-width="1.5"/><path d="M180 300C300 250 420 170 620 120" fill="none" stroke="#147f80" stroke-width="3" stroke-dasharray="7 5"/><path d="M620 120C520 110 400 130 300 165" fill="none" stroke="#d06d4d" stroke-width="3"/><circle cx="180" cy="300" r="6" fill="#147f80"/><text x="190" y="322" font-family="system-ui,'PingFang SC',sans-serif" fill="#147f80" font-size="14">起点</text><circle cx="620" cy="120" r="6" fill="#147f80"/><text x="560" y="108" font-family="system-ui,'PingFang SC',sans-serif" fill="#147f80" font-size="14">拟合结束</text><circle cx="300" cy="165" r="6" fill="#d06d4d"/><text x="250" y="190" font-family="system-ui,'PingFang SC',sans-serif" fill="#d06d4d" font-size="14">压缩后</text><text x="360" y="150" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13">拟合：两者同增</text><text x="330" y="250" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13">压缩：I(X;T) 降</text><text x="840" y="352" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14" text-anchor="middle">I(X;T)</text><text x="120" y="200" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14" transform="rotate(-90 120 200)" text-anchor="middle">I(T;Y)</text></svg>
