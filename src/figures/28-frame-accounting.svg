<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f28c-title f28c-desc" viewBox="0 0 960 400"><title id="f28c-title">同一个消息在各阶段占用的比特不同</title><desc id="f28c-desc">四字符字母表固定两位编码八个符号需要16比特，Huffman 正文14比特，补齐16比特，经过 Hamming 7/4 需要28个物理位；不包含元数据。</desc><rect x="1.5" y="1.5" width="957" height="397" rx="20" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="30" y="44" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" font-weight="750" fill="#203035">同一个消息在各阶段占用的比特不同</text><path d="M30 59H930" stroke="#dce8e4" stroke-width="1.4"/><rect x="34" y="137" width="190" height="106" rx="11" fill="#eeebfa" stroke="#7461ba" stroke-width="2"/><text x="129" y="179" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" fill="#7461ba">源符号固定编码</text><text x="129" y="217" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" font-weight="750" fill="#7461ba">16 bit</text><rect x="268" y="137" width="190" height="106" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="2"/><text x="363" y="179" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" fill="#147f80">Huffman 正文</text><text x="363" y="217" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" font-weight="750" fill="#147f80">14 bit</text><rect x="502" y="137" width="190" height="106" rx="11" fill="#eeebfa" stroke="#7461ba" stroke-width="2"/><text x="597" y="179" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" fill="#7461ba">补齐四位边界</text><text x="597" y="217" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" font-weight="750" fill="#7461ba">16 bit</text><rect x="736" y="137" width="190" height="106" rx="11" fill="#ffede5" stroke="#d06d4d" stroke-width="2"/><text x="831" y="179" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" fill="#d06d4d">Hamming 物理位</text><text x="831" y="217" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" font-weight="750" fill="#d06d4d">28 bit</text><path d="M224 189H259M458 189H493M692 189H727" fill="none" stroke="#53676d" stroke-linecap="round" stroke-width="2.4" /><text x="480" y="300" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" fill="#d06d4d">码本、长度、帧头、重传、同步：此处均未计入</text><text x="480" y="351" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" fill="#203035">仅比较端到端同一边界的数据量才有意义</text></svg>