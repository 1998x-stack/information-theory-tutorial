<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c06a-title c06a-desc" viewBox="0 0 920 380"><title id="c06a-title">熵的凹性：混合分布会增加不确定性</title><desc id="c06a-desc">两个确定分布p=(1,0)和q=(0,1)熵均为零；各占一半的混合分布熵为1比特。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.4"/><text x="26" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#203035" text-anchor="start">熵的凹性：混合分布会增加不确定性</text><path d="M26 54H894" stroke="#dce8e4"/><rect x="35" y="88" width="265" height="236" rx="12" fill="white" stroke="#dce8e4" stroke-width="1.4"/><text x="50" y="120" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#203035" text-anchor="start">p = (1,0)</text><rect x="72" y="141" width="58" height="117" rx="5" fill="#147f80" stroke="none" stroke-width="1.4"/><text x="101" y="278" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" fill="#203035" text-anchor="middle">A</text><rect x="171" y="258" width="58" height="0" rx="5" fill="#7461ba" stroke="none" stroke-width="1.4"/><text x="200" y="278" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" fill="#203035" text-anchor="middle">B</text><text x="50" y="306" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#147f80" text-anchor="start">H = 0</text><rect x="338" y="88" width="265" height="236" rx="12" fill="white" stroke="#dce8e4" stroke-width="1.4"/><text x="353" y="120" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#203035" text-anchor="start">q = (0,1)</text><rect x="375" y="258" width="58" height="0" rx="5" fill="#147f80" stroke="none" stroke-width="1.4"/><text x="404" y="278" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" fill="#203035" text-anchor="middle">A</text><rect x="474" y="141" width="58" height="117" rx="5" fill="#7461ba" stroke="none" stroke-width="1.4"/><text x="503" y="278" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" fill="#203035" text-anchor="middle">B</text><text x="353" y="306" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#7461ba" text-anchor="start">H = 0</text><rect x="641" y="88" width="265" height="236" rx="12" fill="white" stroke="#dce8e4" stroke-width="1.4"/><text x="656" y="120" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#203035" text-anchor="start">r = ½p + ½q</text><rect x="678" y="199.5" width="58" height="58.5" rx="5" fill="#147f80" stroke="none" stroke-width="1.4"/><text x="707" y="278" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" fill="#203035" text-anchor="middle">A</text><rect x="777" y="199.5" width="58" height="58.5" rx="5" fill="#7461ba" stroke="none" stroke-width="1.4"/><text x="806" y="278" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" fill="#203035" text-anchor="middle">B</text><text x="656" y="306" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#d06d4d" text-anchor="start">H = 1 bit</text><text x="293" y="183" font-family="system-ui,'PingFang SC',sans-serif" font-size="30" font-weight="500" fill="#53676d" text-anchor="start">+</text><text x="596" y="183" font-family="system-ui,'PingFang SC',sans-serif" font-size="27" font-weight="500" fill="#d06d4d" text-anchor="start">→</text></svg>
