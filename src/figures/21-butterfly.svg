<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bf21-title bf21-desc" viewBox="0 0 920 360"><title id="bf21-title">蝴蝶网络：共享边传 a 与 b 的异或</title><desc id="bf21-desc">源S发送a和b。两条边分别把a和b送到左节点和右节点，中间共享边只传a异或b。两个端节点各自用另一条已收到的包解出缺失的包。</desc><rect x="1" y="1" width="918" height="358" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="34" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750" text-anchor="start">蝴蝶网络：瓶颈边上送 a⊕b</text><rect x="106" y="46" width="68" height="48" rx="9" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><text x="140" y="76" font-family="ui-monospace,monospace" font-size="16" font-weight="700" fill="#147f80" text-anchor="middle">S</text><rect x="106" y="246" width="68" height="48" rx="9" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><text x="140" y="276" font-family="ui-monospace,monospace" font-size="16" font-weight="700" fill="#147f80" text-anchor="middle">t1</text><rect x="466" y="46" width="68" height="48" rx="9" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><text x="500" y="76" font-family="ui-monospace,monospace" font-size="16" font-weight="700" fill="#147f80" text-anchor="middle">A</text><rect x="466" y="246" width="68" height="48" rx="9" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><text x="500" y="276" font-family="ui-monospace,monospace" font-size="16" font-weight="700" fill="#147f80" text-anchor="middle">B</text><rect x="686" y="146" width="68" height="48" rx="9" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.6"/><text x="720" y="176" font-family="ui-monospace,monospace" font-size="16" font-weight="700" fill="#d06d4d" text-anchor="middle">C</text><path d="M174 70H466" stroke="#147f80" stroke-width="2.2" fill="none"/><text x="320" y="60" font-family="ui-monospace,monospace" font-size="14" fill="#147f80" text-anchor="middle">a</text><path d="M174 270H466" stroke="#147f80" stroke-width="2.2" fill="none"/><text x="320" y="292" font-family="ui-monospace,monospace" font-size="14" fill="#147f80" text-anchor="middle">b</text><path d="M534 70C630 70 660 120 700 150" stroke="#d06d4d" stroke-width="2.2" fill="none"/><path d="M534 270C630 270 660 220 700 190" stroke="#d06d4d" stroke-width="2.2" fill="none"/><path d="M720 194V246" stroke="#d06d4d" stroke-width="2.2" fill="none"/><path d="M714 240l6 12 6-12z" fill="#d06d4d"/><text x="770" y="224" font-family="ui-monospace,monospace" font-size="14" fill="#c15a3c" text-anchor="start">a⊕b</text><path d="M686 170C600 200 560 240 174 270" stroke="#7461ba" stroke-width="2.2" fill="none"/><path d="M180 264l-12 6 12 6z" fill="#7461ba"/><text x="430" y="250" font-family="ui-monospace,monospace" font-size="13" fill="#7461ba" text-anchor="middle">t1: b=a⊕(a⊕b)</text><text x="430" y="150" font-family="ui-monospace,monospace" font-size="13" fill="#7461ba" text-anchor="middle">t2: a=b⊕(a⊕b)</text><text x="30" y="338" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="start">共享边只传一次就同时服务两个接收端；纯路由做不到这种多播容量。</text></svg>