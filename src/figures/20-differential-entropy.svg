<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diff20a-title diff20a-desc" viewBox="0 0 920 380"><title id="diff20a-title">微分熵的三个例子：密度和坐标尺度共同决定数值</title><desc id="diff20a-desc">U(0,1)微分熵为0，U(0,0.25)为-2，高斯N(0,1)约2.047 bit。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">微分熵的三个例子：密度和坐标尺度共同决定数值</text><path d="M28 53H892" fill="none" stroke="#dce8e4" stroke-width="1" /><rect x="37" y="94" width="250" height="228" rx="11" fill="white" stroke="#147f80" stroke-width="1.5"/><rect x="333" y="94" width="250" height="228" rx="11" fill="white" stroke="#d06d4d" stroke-width="1.5"/><rect x="629" y="94" width="250" height="228" rx="11" fill="white" stroke="#7461ba" stroke-width="1.5"/><path d="M75 267V158H249V267" fill="none" stroke="#147f80" stroke-width="3" /><path d="M371 267V119H545V267" fill="none" stroke="#d06d4d" stroke-width="3" /><path d="M667 267C694 267 701 133 754 133C807 133 814 267 841 267" fill="none" stroke="#7461ba" stroke-width="3" /><path d="M58 267H265M354 267H561M650 267H857" fill="none" stroke="#53676d" stroke-width="1.2" /><text x="162" y="127" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#147f80">U(0,1)</text><text x="458" y="127" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#d06d4d">U(0,0.25)</text><text x="754" y="127" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#7461ba">N(0,1)</text><text x="162" y="303" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#203035">h = 0 bit</text><text x="458" y="303" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#203035">h = −2 bit</text><text x="754" y="303" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#203035">h ≈ 2.047 bit</text><text x="31" y="356" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">矩形高度代表密度；高密度并不意味着微分熵更大。</text></svg>