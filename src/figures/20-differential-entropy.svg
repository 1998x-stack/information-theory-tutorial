<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diff20a-title diff20a-desc" viewBox="0 0 920 380"><title id="diff20a-title">连续变量缩放会改变微分熵：密度的单位不能忽略</title><desc id="diff20a-desc">U(0,1)的微分熵为0 bit；U(0,0.25)为-2 bit；高斯N(0,1)约2.047 bit。微分熵随单位尺度变化，不能脱离坐标单位理解为绝对编码长度。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">连续变量缩放会改变微分熵：密度的单位不能忽略</text><path d="M28 53H892" fill="none" stroke="#dce8e4" stroke-width="1" /><rect x="38" y="110" width="255" height="194" rx="11" fill="white" stroke="#147f80" stroke-width="1.5"/><text x="165" y="147" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#147f80">U(0,1)</text><path d="M75 251V222H256" fill="none" stroke="#147f80" stroke-width="2.8" /><text x="165" y="281" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#203035">h=0 bit</text><rect x="330" y="110" width="255" height="194" rx="11" fill="white" stroke="#d06d4d" stroke-width="1.5"/><text x="457" y="147" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#d06d4d">U(0,0.25)</text><path d="M367 251V187H548" fill="none" stroke="#d06d4d" stroke-width="2.8" /><text x="457" y="281" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#203035">h=−2 bit</text><rect x="622" y="110" width="255" height="194" rx="11" fill="white" stroke="#7461ba" stroke-width="1.5"/><text x="749" y="147" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#7461ba">N(0,1)</text><path d="M659 251V222H840" fill="none" stroke="#7461ba" stroke-width="2.8" /><text x="749" y="281" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#203035">h≈2.047 bit</text><text x="32" y="351" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">h(aX)=h(X)+log₂|a|，单位变化会带来可计算的熵偏移。</text></svg>