<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diff20c-title diff20c-desc" viewBox="0 0 920 380"><title id="diff20c-title">并联高斯信道注水：功率只分配给水位以下的噪声底</title><desc id="diff20c-desc">三个独立实子信道噪声方差分别为1、2、4，总功率6。最优水位mu=13/3，功率分配为10/3、7/3、1/3，总容量约1.6732 bit/组三次实信道使用。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">并联高斯信道注水：功率只分配给水位以下的噪声底</text><path d="M28 53H892" fill="none" stroke="#dce8e4" stroke-width="1" /><rect x="45" y="116" width="245" height="191" rx="11" fill="#f4f7f5" stroke="#53676d" stroke-width="1.5"/><rect x="337" y="116" width="245" height="191" rx="11" fill="#f4f7f5" stroke="#53676d" stroke-width="1.5"/><rect x="629" y="116" width="245" height="191" rx="11" fill="#f4f7f5" stroke="#53676d" stroke-width="1.5"/><rect x="73" y="285" width="189" height="22" rx="5" fill="#eeeaff" stroke="#7461ba" stroke-width="1.5"/><rect x="73" y="211.67399999999998" width="189" height="73.32600000000002" rx="2" fill="#dce8e4" stroke="#dce8e4" stroke-width="1.5"/><text x="167" y="340" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#203035">N1=1</text><text x="167" y="202.67399999999998" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="750" text-anchor="middle" fill="#147f80">P1=3.33</text><rect x="365" y="263" width="189" height="44" rx="5" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><rect x="365" y="211.67399999999998" width="189" height="51.32600000000002" rx="2" fill="#dce8e4" stroke="#dce8e4" stroke-width="1.5"/><text x="459" y="340" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#203035">N2=2</text><text x="459" y="202.67399999999998" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="750" text-anchor="middle" fill="#147f80">P2=2.33</text><rect x="657" y="219" width="189" height="88" rx="5" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><rect x="657" y="211.67399999999998" width="189" height="7.326000000000022" rx="2" fill="#dce8e4" stroke="#dce8e4" stroke-width="1.5"/><text x="751" y="340" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#203035">N3=4</text><text x="751" y="202.67399999999998" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="750" text-anchor="middle" fill="#147f80">P3=0.33</text><path d="M58 211H860" fill="none" stroke="#d06d4d" stroke-width="2" stroke-dasharray='8 5'/><text x="458" y="89" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#d06d4d">水位 μ = 4.333</text><text x="35" y="366" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">Pᵢ = max(μ − Nᵢ, 0)；总功率约束 ΣPᵢ=6。</text></svg>