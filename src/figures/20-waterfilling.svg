<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wf20-title wf20-desc" viewBox="0 0 920 400"><title id="wf20-title">注水法：水位以上的信道按方差分配功率</title><desc id="wf20-desc">五条并行信道噪声方差递增。水位 mu 约1.47时，前三条分到功率，最后一条方差过高不分配功率。柱高为方差，填充为分配的功率。</desc><rect x="1" y="1" width="918" height="398" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="34" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750" text-anchor="start">注水法分配功率（总功率 P=2.5）</text><path d="M130 80V330H830" stroke="#9fb4b0" stroke-width="1.5"/><rect x="160" y="319" width="84" height="11" rx="6" fill="#eef4f7" stroke="#53676d" stroke-width="1.3"/><rect x="160" y="260" width="84" height="70" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.3"/><text x="202" y="350" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">σ²=0.2</text><text x="202" y="366" font-family="ui-monospace,monospace" font-size="12" fill="#147f80" text-anchor="middle">P=1.27</text><rect x="290" y="297" width="84" height="33" rx="6" fill="#eef4f7" stroke="#53676d" stroke-width="1.3"/><rect x="290" y="282" width="84" height="48" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.3"/><text x="332" y="350" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">σ²=0.6</text><text x="332" y="366" font-family="ui-monospace,monospace" font-size="12" fill="#147f80" text-anchor="middle">P=0.87</text><rect x="420" y="270" width="84" height="61" rx="6" fill="#eef4f7" stroke="#53676d" stroke-width="1.3"/><rect x="420" y="310" width="84" height="20" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.3"/><text x="462" y="350" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">σ²=1.1</text><text x="462" y="366" font-family="ui-monospace,monospace" font-size="12" fill="#147f80" text-anchor="middle">P=0.37</text><rect x="550" y="231" width="84" height="99" rx="6" fill="#eef4f7" stroke="#53676d" stroke-width="1.3"/><rect x="550" y="330" width="84" height="0" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.3"/><text x="592" y="350" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">σ²=1.8</text><text x="592" y="366" font-family="ui-monospace,monospace" font-size="12" fill="#147f80" text-anchor="middle">P=0.00</text><rect x="680" y="165" width="84" height="165" rx="6" fill="#eef4f7" stroke="#53676d" stroke-width="1.3"/><rect x="680" y="330" width="84" height="0" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.3"/><text x="722" y="350" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">σ²=3</text><text x="722" y="366" font-family="ui-monospace,monospace" font-size="12" fill="#147f80" text-anchor="middle">P=0.00</text><path d="M130 249H830" stroke="#d06d4d" stroke-width="2" stroke-dasharray="7 5"/><text x="836" y="253" font-family="ui-monospace,monospace" font-size="12" fill="#c15a3c" text-anchor="start">μ≈1.47</text><text x="30" y="390" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="start">噪声方差越低的信道分到越多功率；σ²&gt;μ 的子载波完全不传。与反向注水形状对偶。</text></svg>