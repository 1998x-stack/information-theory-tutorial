<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="bayes-title bayes-desc"><title id="bayes-title">筛查案例中的真阳性与假阳性</title><desc id="bayes-desc">10000名受检者：患病100人中90人阳性；未患病9900人中495人阳性。阳性后验90除以585。</desc><rect x="1" y="1" width="898" height="348" rx="17" fill="#fbfdfb" stroke="#e1e9e7" stroke-width="1.5"/><text x="28" y="37" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#203035" text-anchor="start">筛查案例中的真阳性与假阳性</text><path d="M28 52 H872" fill="none" stroke="#dbe7e3" stroke-width="1" stroke-linecap="round" /><rect x="22" y="126" width="148" height="80" rx="12" fill="#e7f6f1" stroke="#147f80" stroke-width="1.5"/><text x="96" y="158" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="middle">10,000 人</text><text x="96" y="185" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="450" fill="#53676d" text-anchor="middle">受检群体</text><rect x="280" y="85" width="185" height="77" rx="12" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="372" y="116" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="middle">患病 100</text><text x="372" y="142" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="450" fill="#53676d" text-anchor="middle">先验 1%</text><rect x="280" y="223" width="185" height="77" rx="12" fill="#e7f6f1" stroke="#147f80" stroke-width="1.5"/><text x="372" y="253" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="middle">未患病 9,900</text><text x="372" y="277" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="450" fill="#53676d" text-anchor="middle">先验 99%</text><rect x="616" y="74" width="246" height="70" rx="12" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="739" y="115" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="middle">真阳性 90</text><rect x="616" y="151" width="246" height="65" rx="12" fill="white" stroke="#d06d4d" stroke-width="1.5"/><text x="739" y="191" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="middle">假阴性 10</text><rect x="616" y="228" width="246" height="70" rx="12" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="739" y="269" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="middle">假阳性 495</text><path d="M171 154 L277 122 M268 116 L277 122 L268 128" fill="none" stroke="#147f80" stroke-width="2.5" stroke-linecap="round" /><path d="M171 176 L277 258 M268 252 L277 258 L268 264" fill="none" stroke="#147f80" stroke-width="2.5" stroke-linecap="round" /><path d="M468 120 L611 109 M602 103 L611 109 L602 115" fill="none" stroke="#d06d4d" stroke-width="2.5" stroke-linecap="round" /><path d="M468 141 L611 184 M602 178 L611 184 L602 190" fill="none" stroke="#d06d4d" stroke-width="2.5" stroke-linecap="round" /><path d="M468 259 L611 264 M602 258 L611 264 L602 270" fill="none" stroke="#147f80" stroke-width="2.5" stroke-linecap="round" /><text x="24" y="328" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="450" fill="#53676d" text-anchor="start">阳性共 90 + 495 = 585 人，其中真正患病的比例为 15.38%。</text></svg>
