<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f28f-title f28f-desc" viewBox="0 0 960 400"><title id="f28f-title">单错码的七位块错误率随 BSC 概率增长</title><desc id="f28f-desc">Hamming(7,4) 在独立 BSC 中正确恢复一块的条件是七个传输位中错误个数为零或一；块错误率为 1-(1-p)^7-7p(1-p)^6。</desc><rect x="1.5" y="1.5" width="957" height="397" rx="20" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="30" y="44" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" font-weight="750" fill="#203035">单错码的七位块错误率随 BSC 概率增长</text><path d="M30 59H930" stroke="#dce8e4" stroke-width="1.4"/><path d="M130 88V306H843" fill="none" stroke="#53676d" stroke-linecap="round" stroke-width="1.6" /><path d="M130.0 305.0 L144.0 304.8 L158.0 304.0 L172.0 302.9 L186.0 301.3 L200.0 299.4 L214.0 297.1 L228.0 294.4 L242.0 291.5 L256.0 288.2 L270.0 284.7 L284.0 280.9 L298.0 276.9 L312.0 272.7 L326.0 268.3 L340.0 263.8 L354.0 259.0 L368.0 254.2 L382.0 249.2 L396.0 244.1 L410.0 238.9 L424.0 233.6 L438.0 228.2 L452.0 222.8 L466.0 217.4 L480.0 211.9 L494.0 206.4 L508.0 200.8 L522.0 195.3 L536.0 189.7 L550.0 184.2 L564.0 178.7 L578.0 173.2 L592.0 167.7 L606.0 162.3 L620.0 156.9 L634.0 151.6 L648.0 146.3 L662.0 141.1 L676.0 136.0 L690.0 130.9 L704.0 125.9 L718.0 121.0 L732.0 116.1 L746.0 111.4 L760.0 106.7 L774.0 102.1 L788.0 97.6 L802.0 93.2 L816.0 88.9 L830.0 84.7" fill="none" stroke="#147f80" stroke-width="4"/><text x="128" y="340" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#53676d">0</text><text x="843" y="340" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#53676d">0.3</text><text x="487" y="366" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#53676d">每个信道比特独立翻转概率 p →</text><text x="84" y="103" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="750" fill="#147f80">Pblock</text><text x="600" y="131" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" fill="#147f80">Pblock=1−(1−p)⁷−7p(1−p)⁶</text><text x="360" y="275" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="750" fill="#d06d4d">仅表示每个 (7,4) 码字的译码块错误率</text></svg>