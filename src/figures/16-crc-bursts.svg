<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crc16c-title crc16c-desc" viewBox="0 0 920 380"><title id="crc16c-title">度数 r=3、常数项为 1 的生成多项式可检出所有长度不超过 3 的突发错误</title><desc id="crc16c-desc">错误模式E(x)未被检出的充要条件是G(x)整除E(x)。长度不超过r的非零突发错误多项式次数小于r，不可能被次数r的G整除。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">度数 r=3、常数项为 1 的生成多项式可检出所有长度不超过 3 的突发错误</text><path d="M28 53H892" fill="none" stroke="#dce8e4" stroke-width="1" /><rect x="36" y="96" width="380" height="47" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="55" y="126" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="start" fill="#203035">长度 1</text><text x="206" y="126" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#147f80">1</text><text x="447" y="126" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="start" fill="#147f80">必定检出</text><rect x="36" y="158" width="380" height="47" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="55" y="188" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="start" fill="#203035">长度 2</text><text x="206" y="188" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#147f80">11</text><text x="447" y="188" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="start" fill="#147f80">必定检出</text><rect x="36" y="220" width="380" height="47" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="55" y="250" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="start" fill="#203035">长度 3</text><text x=