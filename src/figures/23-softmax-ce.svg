<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sc23-title sc23-desc" viewBox="0 0 920 260"><title id="sc23-title">softmax 加交叉熵：反向梯度为 p 减 y</title><desc id="sc23-desc">前向：logits 经 softmax 得到概率 p，与标签 y 算交叉熵；反向：把 p 减 y 直接作为对 logits 的梯度。</desc><rect x="1" y="1" width="918" height="258" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="36" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750" text-anchor="start">softmax + 交叉熵：优雅的梯度</text><g font-family="ui-monospace,monospace" font-size="15" font-weight="700" text-anchor="middle"><rect x="60" y="110" width="120" height="56" rx="9" fill="#eef4f7" stroke="#53676d" stroke-width="1.5"/><text x="120" y="144" fill="#53676d">logits z</text><rect x="270" y="110" width="150" height="56" rx="9" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="345" y="144" fill="#147f80">softmax</text><rect x="500" y="110" width="120" height="56" rx="9" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="560" y="144" fill="#147f80">p</text><rect x="700" y="110" width="150" height="56" rx="9" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="775" y="144" fill="#c15a3c">CE loss</text></g><path d="M180 138H264" stroke="#7461ba" stroke-width="2.4" fill="none"/><path d="M258 132l10 6-10 6z" fill="#7461ba"/><path d="M420 138H494" stroke="#7461ba" stroke-width="2.4" fill="none"/><path d="M488 132l10 6-10 6z" fill="#7461ba"/><path d="M620 138H694" stroke="#7461ba" stroke-width="2.4" fill="none"/><path d="M688 132l10 6-10 6z" fill="#7461ba"/><text x="345" y="205" font-family="ui-monospace,monospace" font-size="14" fill="#53676d" text-anchor="middle">y（one-hot 标签）</text><path d="M770 166C770 220 300 230 120 166" stroke="#d06d4d" stroke-width="2.2" fill="none" stroke-dasharray="6 4"/><path d="M120 166l-4-12 12 0z" fill="#d06d4d"/><text x="470" y="240" font-family="ui-monospace,monospace" font-size="14" fill="#c15a3c" text-anchor="middle">反向：∂L/∂z = p − y</text></svg>