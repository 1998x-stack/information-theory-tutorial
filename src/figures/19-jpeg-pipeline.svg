<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rd19c-title rd19c-desc" viewBox="0 0 920 380"><title id="rd19c-title">JPEG：变换提供可组织的系数，量化才是主要有损步骤</title><desc id="rd19c-desc">经典基线JPEG对8×8样本块进行DCT、按量化表取整、扫描系数并做熵编码。DCT本身可逆（忽略数值精度）；量化引入不可逆失真。具体标准还有颜色变换、采样与熵编码细节。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">JPEG：变换提供可组织的系数，量化才是主要有损步骤</text><path d="M28 53H892" fill="none" stroke="#dce8e4" stroke-width="1" /><rect x="26" y="125" width="199" height="119" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="125" y="166" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#147f80">像素块</text><text x="125" y="205" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#53676d">8×8 样本</text><path d="M225 184L248 184m-8 -6l8 6 -8 6" fill="none" stroke="#147f80" stroke-width="2.4" stroke-linecap="round"/><rect x="252" y="125" width="199" height="119" rx="11" fill="#e7f5f2" stroke="#7461ba" stroke-width="1.5"/><text x="351" y="166" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#7461ba">DCT</text><text x="351" y="205" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#53676d">频率系数</text><path d="M451 184L474 184m-8 -6l8 6 -8 6" fill="none" stroke="#7461ba" stroke-width="2.4" stroke-linecap="round"/><rect x="478" y="125" width="199" height="119" rx="11" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="577" y="166" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#d06d4d">量化</text><text x="577" y="205" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#53676d">取整 / 丢精度</text><path d="M677 184L700 184m-8 -6l8 6 -8 6" fill="none" stroke="#d06d4d" stroke-width="2.4" stroke-linecap="round"/><rect x="704" y="125" width="199" height="119" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="803" y="166" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#147f80">熵编码</text><text x="803" y="205" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#53676d">游程 + Huffman</text><text x="28" y="311" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">码率与失真由量化步长、量化表、图像内容和熵编码共同决定。</text></svg>