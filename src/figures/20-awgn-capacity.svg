<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aw20-title aw20-desc" viewBox="0 0 920 380"><title id="aw20-title">AWGN 每符号容量随信噪比以对数增长</title><desc id="aw20-desc">横轴为信噪比 dB，纵轴为每符号容量。容量为0.5log2(1+SNR)。从0到40 dB容量约从0.5升到3.3比特，增长越来越慢。</desc><rect x="1" y="1" width="918" height="378" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="34" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750" text-anchor="start">香农公式：C=½log₂(1+SNR)</text><path d="M130 60V300H830" stroke="#9fb4b0" stroke-width="1.5"/><path d="M130.0 60V300" stroke="#eef2f1"/><text x="130.0" y="318" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">-10</text><path d="M270.0 60V300" stroke="#eef2f1"/><text x="270.0" y="318" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">0</text><path d="M410.0 60V300" stroke="#eef2f1"/><text x="410.0" y="318" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">10</text><path d="M550.0 60V300" stroke="#eef2f1"/><text x="550.0" y="318" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">20</text><path d="M690.0 60V300" stroke="#eef2f1"/><text x="690.0" y="318" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">30</text><path d="M830.0 60V300" stroke="#eef2f1"/><text x="830.0" y="318" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">40</text><path d="M130 240.0H830" stroke="#eef2f1"/><text x="120" y="244.0" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="end">1</text><path d="M130 180.0H830" stroke="#eef2f1"/><text x="120" y="184.0" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="end">2</text><path d="M130 120.0H830" stroke="#eef2f1"/><text x="120" y="124.0" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="end">3</text><path d="M130 60.0H830" stroke="#eef2f1"/><text x="120" y="64.0" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="end">4</text><polyline points="130.0,295.9 144.0,294.9 158.0,293.6 172.0,292.1 186.0,290.3 200.0,288.1 214.0,285.5 228.0,282.4 242.0,278.8 256.0,274.7 270.0,270.0 284.0,264.7 298.0,258.9 312.0,252.5 326.0,245.6 340.0,238.3 354.0,230.5 368.0,222.4 382.0,213.9 396.0,205.2 410.0,196.2 424.0,187.1 438.0,177.8 452.0,168.3 466.0,158.8 480.0,149.2 494.0,139.5 508.0,129.7 522.0,119.9 536.0,110.1 550.0,100.3 564.0,90.4 578.0,80.5 592.0,70.6 606.0,60.6 620.0,50.7 634.0,40.8 648.0,30.8 662.0,20.9 676.0,10.9 690.0,1.0 704.0,-9.0 718.0,-18.9 732.0,-28.9 746.0,-38.9 760.0,-48.8 774.0,-58.8 788.0,-68.7 802.0,-78.7 816.0,-88.7 830.0,-98.6" fill="none" stroke="#147f80" stroke-width="2.6"/><text x="620" y="120" font-family="ui-monospace,monospace" font-size="13" fill="#53676d" text-anchor="start">横轴 SNR(dB)  纵轴 bit/symbol</text><text x="30" y="362" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="start">线性信噪比每翻倍，容量只加 ½ bit；要再加 1 bit 需要把信噪比再乘 4。</text></svg>