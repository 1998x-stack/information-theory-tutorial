<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aw20-title aw20-desc" viewBox="0 0 920 380"><title id="aw20-title">AWGN 每符号容量随信噪比以对数增长</title><desc id="aw20-desc">横轴为信噪比 dB，纵轴为每符号容量。容量为0.5log2(1+SNR)。从0到40 dB容量约从0.5升到6.6比特（40 dB时≈6.64 bit），增长越来越慢。</desc><rect x="1" y="1" width="918" height="378" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="34" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750" text-anchor="start">香农公式：C=½log₂(1+SNR)</text><path d="M130 60V300H830" stroke="#9fb4b0" stroke-width="1.5"/><path d="M130.0 60V300" stroke="#eef2f1"/><text x="130.0" y="318" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">-10</text><path d="M270.0 60V300" stroke="#eef2f1"/><text x="270.0" y="318" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">0</text><path d="M410.0 60V300" stroke="#eef2f1"/><text x="410.0" y="318" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">10</text><path d="M550.0 60V300" stroke="#eef2f1"/><text x="550.0" y="318" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">20</text><path d="M690.0 60V300" stroke="#eef2f1"/><text x="690.0" y="318" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">30</text><path d="M830.0 60V300" stroke="#eef2f1"/><text x="830.0" y="318" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">40</text><path d="M130 300.0H830" stroke="#eef2f1"/><text x="120" y="304.0" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="end">0</text><path d="M130 265.7H830" stroke="#eef2f1"/><text x="120" y="269.7" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="end">1</text><path d="M130 231.4H830" stroke="#eef2f1"/><text x="120" y="235.4" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="end">2</text><path d="M130 197.1H830" stroke="#eef2f1"/><text x="120" y="201.1" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="end">3</text><path d="M130 162.9H830" stroke="#eef2f1"/><text x="120" y="166.9" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="end">4</text><path d="M130 128.6H830" stroke="#eef2f1"/><text x="120" y="132.6" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="end">5</text><path d="M130 94.3H830" stroke="#eef2f1"/><text x="120" y="98.3" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="end">6</text><path d="M130 60.0H830" stroke="#eef2f1"/><text x="120" y="64.0" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="end">7</text><polyline points="130.0,297.6 144.0,297.1 158.0,296.4 172.0,295.5 186.0,294.5 200.0,293.2 214.0,291.7 228.0,290.0 242.0,287.9 256.0,285.5 270.0,282.9 284.0,279.8 298.0,276.5 312.0,272.9 326.0,268.9 340.0,264.7 354.0,260.3 368.0,255.6 382.0,250.8 396.0,245.8 410.0,240.7 424.0,235.5 438.0,230.1 452.0,224.8 466.0,219.3 480.0,213.8 494.0,208.3 508.0,202.7 522.0,197.1 536.0,191.5 550.0,185.9 564.0,180.2 578.0,174.6 592.0,168.9 606.0,163.2 620.0,157.6 634.0,151.9 648.0,146.2 662.0,140.5 676.0,134.8 690.0,129.1 704.0,123.4 718.0,117.8 732.0,112.1 746.0,106.4 760.0,100.7 774.0,95.0 788.0,89.3 802.0,83.6 816.0,77.9 830.0,72.2" fill="none" stroke="#147f80" stroke-width="2.6"/><text x="150" y="95" font-family="ui-monospace,monospace" font-size="13" fill="#53676d" text-anchor="start">横轴 SNR(dB)  纵轴 bit/symbol</text><text x="30" y="362" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="start">线性信噪比每翻倍，容量只加 ½ bit；要再加 1 bit 需要把信噪比再乘 4。</text></svg>