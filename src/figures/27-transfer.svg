<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="te27t te27d" viewBox="0 0 920 300"><title id="te27t">传递熵度量有向预测信息流</title><desc id="te27d">左侧为 X 与 Y 两条时间序列，Y 的过去指向 X 的未来（红色实线），X 的过去指向 Y 的未来（青色虚线）。传递熵 T(Y→X) 度量在已知 X 自身历史的条件下，Y 的过去对 X 未来的额外预测能力；它不等于因果，只表示有向预测信息流。</desc><rect x="1" y="1" width="918" height="298" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="36" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750">传递熵：有向的预测信息流</text><g font-family="system-ui,'PingFang SC',sans-serif" font-size="14"><rect x="120" y="90" width="120" height="44" rx="10" fill="#eef7f4" stroke="#147f80"/><text x="180" y="117" text-anchor="middle">X 的过去 Xₜ</text><rect x="620" y="90" width="120" height="44" rx="10" fill="#eef7f4" stroke="#147f80"/><text x="680" y="117" text-anchor="middle">X 的未来 Xₜ₊₁</text><rect x="120" y="200" width="120" height="44" rx="10" fill="#fff6ef" stroke="#d06d4d"/><text x="180" y="227" text-anchor="middle">Y 的过去 Yₜ</text><rect x="620" y="200" width="120" height="44" rx="10" fill="#fff6ef" stroke="#d06d4d"/><text x="680" y="227" text-anchor="middle">Y 的未来 Yₜ₊₁</text></g><path d="M240 240C400 240 430 112 618 112" fill="none" stroke="#d06d4d" stroke-width="2.5" marker-end="url(#a27b)"/><text x="430" y="150" font-family="system-ui,'PingFang SC',sans-serif" fill="#d06d4d" font-size="13">T(Y→X)：额外预测力</text><path d="M240 100C400 100 430 218 618 218" fill="none" stroke="#147f80" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a27b)"/><text x="430" y="255" font-family="system-ui,'PingFang SC',sans-serif" fill="#147f80" font-size="13">T(X→Y)</text><defs><marker id="a27b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#9fb4b0"/></marker></defs></svg>
