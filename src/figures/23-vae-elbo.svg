<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vae23-title vae23-desc" viewBox="0 0 920 380"><title id="vae23-title">VAE：随机编码、重构似然与 KL 先验约束</title><desc id="vae23-desc">编码器 qφ(z|x) 输出均值和方差，重参数化采样 z，解码器给出 pθ(x|z)，KL 正则将近似后验拉向先验 p(z)。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" fill="#203035">VAE：随机编码、重构似然与 KL 先验约束</text><path d="M28 53H892" stroke="#dce8e4"/><rect x="30" y="132" width="145" height="78" rx="12" fill="#eeeaff" stroke="#7461ba" stroke-width="1.6"/><rect x="245" y="132" width="160" height="78" rx="12" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><rect x="475" y="132" width="130" height="78" rx="12" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.6"/><rect x="690" y="132" width="185" height="78" rx="12" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><text x="102" y="165" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#7461ba">输入 x</text><text x="325" y="163" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#147f80">qφ(z|x)</text><text x="540" y="163" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#d06d4d">z = μ+σε</text><text x="782" y="163" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#147f80">pθ(x|z)</text><path d="M175 170H237M405 170H467M605 170H682" fill="none" stroke="#53676d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><rect x="235" y="250" width="180" height="52" rx="12" fill="#eeeaff" stroke="#7461ba" stroke-width="1.6"/><text x="325" y="282" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#7461ba">KL(qφ(z|x) ‖ p(z))</text><path d="M325 210V242" fill="none" stroke="#7461ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="782" y="248" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#147f80">重构 log pθ(x|z)</text><text x="480" y="344" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#203035">ELBO = 重构期望 − KL</text></svg>