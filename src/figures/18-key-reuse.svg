<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sec18c-title sec18c-desc" viewBox="0 0 920 380"><title id="sec18c-title">重复使用一次一密的密钥会泄露两个明文的异或</title><desc id="sec18c-desc">若两条消息使用相同密钥K，则C1=M1 XOR K，C2=M2 XOR K，因此C1 XOR C2=M1 XOR M2。密钥抵消后，明文之间的关系暴露。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">重复使用一次一密的密钥会泄露两个明文的异或</text><path d="M28 53H892" fill="none" stroke="#dce8e4" stroke-width="1" /><rect x="32" y="111" width="191" height="75" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="127" y="142" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#147f80">C₁ = M₁ ⊕ K</text><rect x="32" y="217" width="191" height="75" rx="11" fill="#eeeaff" stroke="#7461ba" stroke-width="1.5"/><text x="127" y="248" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#7461ba">C₂ = M₂ ⊕ K</text><path d="M224 150L337 190m-8 -6l8 6 -8 6" fill="none" stroke="#147f80" stroke-width="2.4" stroke-linecap="round"/><path d="M224 255L337 216m-8 -6l8 6 -8 6" fill="none" stroke="#7461ba" stroke-width="2.4" stroke-linecap="round"/><rect x="347" y="147" width="226" height="100" rx="11" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="460" y="184" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="middle" fill="#d06d4d">C₁ ⊕ C₂</text><text x="460" y="219" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#53676d">K ⊕ K = 0</text><path d="M575 197L673 197m-8 -6l8 6 -8 6" fill="none" stroke="#d06d4d" stroke-width="2.4" stroke-linecap="round"/><rect x="682" y="147" width="207" height="100" rx="11" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="785" y="184" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="middle" fill="#d06d4d">M₁ ⊕ M₂</text><text x="785" y="219" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#53676d">关系直接泄露</text><text x="32" y="338" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">一次一密中的“One-Time”是安全条件，不是可选的工程建议。</text></svg>