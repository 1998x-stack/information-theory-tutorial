<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="dpi-title dpi-desc"><title id="dpi-title">信息处理不等式：X → Y → Z</title><desc id="dpi-desc">当Z在给定Y时与X条件独立，处理后的Z关于X的信息不超过原观测Y。</desc><rect x="1" y="1" width="898" height="348" rx="17" fill="#fbfdfb" stroke="#e1e9e7" stroke-width="1.5"/><text x="28" y="37" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#203035" text-anchor="start">信息处理不等式：X → Y → Z</text><path d="M28 52 H872" fill="none" stroke="#dbe7e3" stroke-width="1" stroke-linecap="round" /><rect x="52" y="110" width="219" height="113" rx="12" fill="#e7f6f1" stroke="#147f80" stroke-width="1.5"/><text x="161" y="154" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#203035" text-anchor="middle">原始信号 X</text><text x="161" y="187" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="450" fill="#53676d" text-anchor="middle">需要推断的量</text><path d="M274 166 L335 166 M326 160 L335 166 L326 172" fill="none" stroke="#7461ba" stroke-width="2.5" stroke-linecap="round" /><rect x="342" y="110" width="219" height="113" rx="12" fill="#efeaff" stroke="#7461ba" stroke-width="1.5"/><text x="451" y="154" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#203035" text-anchor="middle">带噪观测 Y</text><text x="451" y="187" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="450" fill="#53676d" text-anchor="middle">测量得到的信息</text><path d="M564 166 L625 166 M616 160 L625 166 L616 172" fill="none" stroke="#d06d4d" stroke-width="2.5" stroke-linecap="round" /><rect x="632" y="110" width="219" height="113" rx="12" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="741" y="154" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#203035" text-anchor="middle">处理结果 Z</text><text x="741" y="187" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="450" fill="#53676d" text-anchor="middle">进一步压缩或分类</text><text x="451" y="282" font-family="system-ui,'PingFang SC',sans-serif" font-size="26" font-weight="700" fill="#147f80" text-anchor="middle">I(X;Z) ≤ I(X;Y)</text><text x="451" y="318" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="450" fill="#53676d" text-anchor="middle">前提：X → Y → Z 构成马尔可夫链</text></svg>
