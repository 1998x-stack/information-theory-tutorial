<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ksg25-title ksg25-desc" viewBox="0 0 920 380"><title id="ksg25-title">KSG 在联合空间定半径，再数两个边缘邻居</title><desc id="ksg25-desc">联合空间中第 k 个近邻决定最大范数半径 ε；在 X 与 Y 投影中分别统计严格位于该半径内的点数。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" fill="#203035">KSG 在联合空间定半径，再数两个边缘邻居</text><path d="M28 53H892" stroke="#dce8e4"/><path d="80 315H435M80 315V85M515 315H870M515 315V85" fill="none" stroke="#53676d" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="245" cy="210" r="90" fill="#e7f5f2" fill-opacity=".6" stroke="#147f80" stroke-width="2" stroke-dasharray="5 4"/><circle cx="245" cy="210" r="6" fill="#d06d4d"/><circle cx="180" cy="170" r="5" fill="#147f80"/><circle cx="290" cy="160" r="5" fill="#147f80"/><circle cx="315" cy="240" r="5" fill="#147f80"/><circle cx="195" cy="275" r="5" fill="#147f80"/><circle cx="355" cy="200" r="5" fill="#7461ba"/><circle cx="150" cy="240" r="5" fill="#7461ba"/><circle cx="260" cy="105" r="5" fill="#7461ba"/><circle cx="390" cy="270" r="5" fill="#7461ba"/><circle cx="120" cy="120" r="5" fill="#7461ba"/><circle cx="320" cy="300" r="5" fill="#7461ba"/><circle cx="210" cy="125" r="5" fill="#7461ba"/><circle cx="370" cy="140" r="5" fill="#7461ba"/><text x="245" y="95" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#147f80">联合空间 (X,Y)</text><text x="245" y="335" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#53676d">ε：第 k 个联合近邻半径</text><path d="M515 205H850" fill="none" stroke="#7461ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="680" y="105" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#7461ba">边缘投影计数</text><rect x="570" y="135" width="245" height="50" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><text x="692" y="166" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#147f80">nₓ(i) = X 邻居数</text><rect x="570" y="215" width="245" height="50" rx="8" fill="#eeeaff" stroke="#7461ba" stroke-width="1.6"/><text x="692" y="246" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#7461ba">nᵧ(i) = Y 邻居数</text><text x="690" y="290" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#203035">ψ(k)+ψ(N)−平均 ψ 计数</text></svg>