<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lz11b-title lz11b-desc" viewBox="0 0 920 380"><title id="lz11b-title">LZ78：ABABABA 被切为 A | B | AB | ABA</title><desc id="lz11b-desc">LZ78初始字典只有编号0的空词。按最长已知词加下一个字符建立新词，输出(0,A)、(0,B)、(1,B)、(3,A)；每个词典编号与新增字符还原相同短语。</desc><rect x="1" y="1" width="918" height="378" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="38" text-anchor="start" fill="#203035" font-size="21" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">LZ78：ABABABA 被切为 A | B | AB | ABA</text><path d="M28 53H892" stroke="#dce8e4"/><rect x="27" y="102" width="207" height="220" rx="10" stroke="#147f80" stroke-width="1.5" fill="white"/><text x="129" y="141" text-anchor="middle" fill="#147f80" font-size="16" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">STEP 1</text><text x="129" y="185" text-anchor="middle" fill="#203035" font-size="28" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">A</text><text x="129" y="230" text-anchor="middle" fill="#d06d4d" font-size="18" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">(0, A)</text><text x="129" y="285" text-anchor="middle" fill="#53676d" font-size="16" font-weight="500" font-family="system-ui,'PingFang SC',sans-serif">1 : A</text><rect x="253" y="102" width="207" height="220" rx="10" stroke="#7461ba" stroke-width="1.5" fill="white"/><text x="355" y="141" text-anchor="middle" fill="#7461ba" font-size="16" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">STEP 2</text><text x="355" y="185" text-anchor="middle" fill="#203035" font-size="28" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">B</text><text x="355" y="230" text-anchor="middle" fill="#d06d4d" font-size="18" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">(0, B)</text><text x="355" y="285" text-anchor="middle" fill="#53676d" font-size="16" font-weight="500" font-family="system-ui,'PingFang SC',sans-serif">2 : B</text><rect x="479" y="102" width="207" height="220" rx="10" stroke="#147f80" stroke-width="1.5" fill="white"/><text x="581" y="141" text-anchor="middle" fill="#147f80" font-size="16" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">STEP 3</text><text x="581" y="185" text-anchor="middle" fill="#203035" font-size="28" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">AB</text><text x="581" y="230" text-anchor="middle" fill="#d06d4d" font-size="18" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">(1, B)</text><text x="581" y="285" text-anchor="middle" fill="#53676d" font-size="16" font-weight="500" font-family="system-ui,'PingFang SC',sans-serif">3 : AB</text><rect x="705" y="102" width="207" height="220" rx="10" stroke="#7461ba" stroke-width="1.5" fill="white"/><text x="807" y="141" text-anchor="middle" fill="#7461ba" font-size="16" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">STEP 4</text><text x="807" y="185" text-anchor="middle" fill="#203035" font-size="28" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">ABA</text><text x="807" y="230" text-anchor="middle" fill="#d06d4d" font-size="18" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">(3, A)</text><text x="807" y="285" text-anchor="middle" fill="#53676d" font-size="16" font-weight="500" font-family="system-ui,'PingFang SC',sans-serif">4 : ABA</text><text x="28" y="351" text-anchor="start" fill="#53676d" font-size="14" font-weight="500" font-family="system-ui,'PingFang SC',sans-serif">区别：LZ77 回指窗口位置，LZ78 回指不断扩展的词典编号。</text></svg>