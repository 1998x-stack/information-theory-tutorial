<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="conv17a-title conv17a-desc" viewBox="0 0 920 380"><title id="conv17a-title">K=3、码率 1/2 的卷积编码器：两个记忆位与两个模 2 输出</title><desc id="conv17a-desc">状态寄存器保存u(t-1)与u(t-2)。输出v0=u(t) XOR u(t-1) XOR u(t-2)，v1=u(t) XOR u(t-2)，对应生成多项式(7,5)八进制。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">K=3、码率 1/2 的卷积编码器：两个记忆位与两个模 2 输出</text><path d="M28 53H892" fill="none" stroke="#dce8e4" stroke-width="1" /><rect x="32" y="122" width="126" height="78" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="95" y="169" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#147f80">输入 uₜ</text><path d="M160 161L235 161m-8 -6l8 6 -8 6" fill="none" stroke="#147f80" stroke-width="2.4" stroke-linecap="round"/><rect x="244" y="116" width="152" height="89" rx="11" fill="#eeeaff" stroke="#7461ba" stroke-width="1.5"/><text x="320" y="149" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#7461ba">延迟 D</text><text x="320" y="179" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#53676d">uₜ₋₁</text><path d="M396 161L462 161m-8 -6l8 6 -8 6" fill="none" stroke="#7461ba" stroke-width="2.4" stroke-linecap="round"/><rect x="470" y="116" width="152" height="89" rx="11" fill="#eeeaff" stroke="#7461ba" stroke-width="1.5"/><text x="546" y="149" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#7461ba">延迟 D</text><text x="546" y="179" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#53676d">uₜ₋₂</text><path d="M320 205V249H650V160" fill="none" stroke="#7461ba" stroke-width="2" /><path d="M546 205V272H700V161" fill="none" stroke="#7461ba" stroke-width="2" /><path d="M95 200V298H735V161" fill="none" stroke="#147f80" stroke-width="2" /><rect x="738" y="119" width="153" height="86" rx="11" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="814" y="151" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#d06d4d">XOR 抽头</text><text x="814" y="181" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#53676d">输出 v₀, v₁</text><text x="32" y="338" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="start" fill="#203035">v₀ = uₜ ⊕ uₜ₋₁ ⊕ uₜ₋₂      v₁ = uₜ ⊕ uₜ₋₂</text></svg>