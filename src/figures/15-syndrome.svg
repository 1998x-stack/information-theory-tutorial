<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ham15b-title ham15b-desc" viewBox="0 0 920 380"><title id="ham15b-title">翻转第5位后，校验失败的位置模式指向5</title><desc id="ham15b-desc">正确码字0110011被第5位翻转为0110111。校验s1使用奇数位置1,3,5,7得到1；s2使用2,3,6,7得到0；s4使用4,5,6,7得到1；二进制s4s2s1=101对应位置5。</desc><rect x="1" y="1" width="918" height="378" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="21" font-weight="750" text-anchor="start">翻转第5位后，校验失败的位置模式指向5</text><path d="M28 53H892" stroke="#dce8e4" stroke-width="1" fill="none"/><rect x="36" y="104" width="410" height="188" rx="10" stroke="#147f80" stroke-width="1.5" fill="#e7f5f2"/><text x="55" y="138" font-family="system-ui,'PingFang SC',sans-serif" fill="#147f80" font-size="23" font-weight="750" text-anchor="start">收到：0 1 1 0 1 1 1</text><text x="55" y="183" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="17" font-weight="500" text-anchor="start">s₁ = c₁ ⊕ c₃ ⊕ c₅ ⊕ c₇ = 1</text><text x="55" y="218" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="17" font-weight="500" text-anchor="start">s₂ = c₂ ⊕ c₃ ⊕ c₆ ⊕ c₇ = 0</text><text x="55" y="254" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="17" font-weight="500" text-anchor="start">s₄ = c₄ ⊕ c₅ ⊕ c₆ ⊕ c₇ = 1</text><path d="M461 193H527" stroke="#7461ba" stroke-width="3" fill="none"/><rect x="545" y="104" width="340" height="188" rx="10" stroke="#d06d4d" stroke-width="1.5" fill="#fff0e8"/><text x="716" y="148" font-family="system-ui,'PingFang SC',sans-serif" fill="#d06d4d" font-size="22" font-weight="750" text-anchor="middle">s₄ s₂ s₁ = 101₂</text><text x="716" y="198" font-family="system-ui,'PingFang SC',sans-serif" fill="#d06d4d" font-size="29" font-weight="750" text-anchor="middle">位置 = 5</text><text x="716" y="241" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="18" font-weight="500" text-anchor="middle">把收到的第5位翻回</text><text x="30" y="353" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14" font-weight="500" text-anchor="start">前提：至多一位翻转；双错可能给出误导性非零 syndrome，不能保证纠正。</text></svg>