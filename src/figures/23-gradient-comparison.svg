<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="grad23-title grad23-desc" viewBox="0 0 920 380"><title id="grad23-title">正类 logit 很负时，CE 与 Brier 的梯度不同</title><desc id="grad23-desc">二元正类标签 y=1，q=sigmoid(z)。交叉熵梯度 q−1；Brier 梯度 2(q−1)q(1−q)，后者在 sigmoid 饱和区会被导数缩小。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" fill="#203035">正类 logit 很负时，CE 与 Brier 的梯度不同</text><path d="M28 53H892" stroke="#dce8e4"/><path d="90 285H850M90 285V78" fill="none" stroke="#53676d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M100 100L840 275" fill="none" stroke="#147f80" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M100 100C240 100 285 110 370 160S650 250 840 280" fill="none" stroke="#d06d4d" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" /><text x="470" y="83" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#53676d">logit z →</text><text x="690" y="125" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="750" text-anchor="middle" fill="#147f80">CE：q−1</text><text x="700" y="240" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="750" text-anchor="middle" fill="#d06d4d">Brier：2(q−1)q(1−q)</text><text x="105" y="315" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#53676d">严重错误：z≪0</text><text x="840" y="315" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="end" fill="#53676d">高置信正确：z≫0</text><text x="28" y="98" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#53676d">梯度</text></svg>