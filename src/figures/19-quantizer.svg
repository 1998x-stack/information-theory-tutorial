<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="q19-title q19-desc" viewBox="0 0 920 360"><title id="q19-title">量化步长越大，重构点越少，码率越低但失真越大</title><desc id="q19-desc">一条连续信号曲线叠加粗量化（三个重构电平）与细量化（四个重构电平）的参考线，量化步长越大，重构误差越大。</desc><rect x="1" y="1" width="918" height="358" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="34" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750" text-anchor="start">量化：步长与失真的权衡</text><path d="M130 80V310H820" stroke="#9fb4b0" stroke-width="1.6" fill="none"/><path d="M130 272H820" stroke="#147f80" stroke-width="1" stroke-dasharray="2 5"/><path d="M130 218H820" stroke="#147f80" stroke-width="1" stroke-dasharray="2 5"/><path d="M130 162H820" stroke="#147f80" stroke-width="1" stroke-dasharray="2 5"/><path d="M130 108H820" stroke="#147f80" stroke-width="1" stroke-dasharray="2 5"/><path d="M130 245H820" stroke="#d06d4d" stroke-width="1.5" stroke-dasharray="6 4"/><text x="836" y="249" font-family="ui-monospace,monospace" font-size="12" fill="#c15a3c" text-anchor="start">1</text><path d="M130 162H820" stroke="#d06d4d" stroke-width="1.5" stroke-dasharray="6 4"/><text x="836" y="166" font-family="ui-monospace,monospace" font-size="12" fill="#c15a3c" text-anchor="start">2.5</text><path d="M130 80H820" stroke="#d06d4d" stroke-width="1.5" stroke-dasharray="6 4"/><text x="836" y="84" font-family="ui-monospace,monospace" font-size="12" fill="#c15a3c" text-anchor="start">4</text><polyline points="150,190 202,143 254,107 306,91 358,100 410,131 462,176 514,225 566,265 618,287 670,285 722,260 774,218" fill="none" stroke="#7461ba" stroke-width="2.4"/><text x="150" y="76" font-family="system-ui,sans-serif" fill="#7461ba" font-size="14" font-weight="700" text-anchor="start">原始信号</text><text x="600" y="76" font-family="system-ui,sans-serif" fill="#c15a3c" font-size="14" font-weight="700" text-anchor="start">粗量化电平</text><text x="30" y="348" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="start">电平数越少，编码系数所需比特越少，但量化误差越大——这正是 R(D) 上的一个工作点。</text></svg>