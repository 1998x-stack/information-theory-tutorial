<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c06b-title c06b-desc" viewBox="0 0 920 380"><title id="c06b-title">观察信号后剩下多少不确定性？</title><desc id="c06b-desc">X为均匀比特，Y以0.2概率翻转。观察Y为0或1时，X的后验分布分别为(0.8,0.2)或(0.2,0.8)；平均条件熵为0.7219比特。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.4"/><text x="26" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="700" fill="#203035" text-anchor="start">观察信号后剩下多少不确定性？</text><path d="M26 54H894" stroke="#dce8e4"/><rect x="29" y="86" width="260" height="220" rx="12" fill="#e7f5f2" stroke="#147f80" stroke-width="1.4"/><text x="159" y="120" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#203035" text-anchor="middle">观测之前</text><text x="159" y="153" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="500" fill="#203035" text-anchor="middle">P(X=0)=0.5</text><rect x="64" y="178" width="190" height="37" rx="4" fill="#147f80" stroke="none" stroke-width="1.4"/><rect x="159" y="178" width="95" height="37" rx="0" fill="#7461ba" stroke="none" stroke-width="1.4"/><text x="159" y="261" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#147f80" text-anchor="middle">H(X) = 1 bit</text><rect x="361" y="86" width="530" height="220" rx="12" fill="white" stroke="#dce8e4" stroke-width="1.4"/><text x="625" y="120" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#203035" text-anchor="middle">已观察到 Y=0</text><text x="625" y="151" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="500" fill="#203035" text-anchor="middle">P(X=0|Y=0)=0.8</text><rect x="420" y="179" width="405" height="37" rx="4" fill="#147f80" stroke="none" stroke-width="1.4"/><rect x="744" y="179" width="81" height="37" rx="0" fill="#7461ba" stroke="none" stroke-width="1.4"/><text x="625" y="260" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#147f80" text-anchor="middle">H(X|Y) = h₂(0.2) ≈ 0.7219 bit</text><path d="M294 196 L354 196 m-10 -6 l10 6 -10 6" stroke="#147f80" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="29" y="349" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" fill="#53676d" text-anchor="start">两个观测结果对称，均匀先验下条件熵是对两种观测后验的平均。</text></svg>
