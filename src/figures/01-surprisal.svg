<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="surp-title surp-desc"><title id="surp-title">概率减半，自信息增加 1 bit</title><desc id="surp-desc">概率分别为一半、四分之一和八分之一的事件，对应1、2和3比特自信息。</desc><rect x="1" y="1" width="898" height="348" rx="17" fill="#fbfdfb" stroke="#e1e9e7" stroke-width="1.5"/><text x="28" y="37" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#203035" text-anchor="start">概率减半，自信息增加 1 bit</text><path d="M28 52 H872" fill="none" stroke="#dbe7e3" stroke-width="1" stroke-linecap="round" /><rect x="66" y="86" width="238" height="194" rx="12" fill="white" stroke="#dce8e4" stroke-width="1.5"/><text x="86" y="122" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">p = 1/2</text><rect x="86" y="145" width="197" height="28" rx="5" fill="#ebf0ef" stroke="none" stroke-width="1.5"/><rect x="86" y="145" width="197" height="28" rx="5" fill="#147f80" stroke="none" stroke-width="1.5"/><text x="86" y="223" font-family="system-ui,'PingFang SC',sans-serif" font-size="28" font-weight="700" fill="#147f80" text-anchor="start">1 bit</text><text x="86" y="255" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="450" fill="#53676d" text-anchor="start">I(x) = -log₂ p(x)</text><rect x="347" y="86" width="238" height="194" rx="12" fill="white" stroke="#dce8e4" stroke-width="1.5"/><text x="367" y="122" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">p = 1/4</text><rect x="367" y="145" width="197" height="28" rx="5" fill="#ebf0ef" stroke="none" stroke-width="1.5"/><rect x="367" y="145" width="98.5" height="28" rx="5" fill="#7461ba" stroke="none" stroke-width="1.5"/><text x="367" y="223" font-family="system-ui,'PingFang SC',sans-serif" font-size="28" font-weight="700" fill="#7461ba" text-anchor="start">2 bits</text><text x="367" y="255" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="450" fill="#53676d" text-anchor="start">I(x) = -log₂ p(x)</text><rect x="628" y="86" width="238" height="194" rx="12" fill="white" stroke="#dce8e4" stroke-width="1.5"/><text x="648" y="122" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="700" fill="#203035" text-anchor="start">p = 1/8</text><rect x="648" y="145" width="197" height="28" rx="5" fill="#ebf0ef" stroke="none" stroke-width="1.5"/><rect x="648" y="145" width="49.25" height="28" rx="5" fill="#d06d4d" stroke="none" stroke-width="1.5"/><text x="648" y="223" font-family="system-ui,'PingFang SC',sans-serif" font-size="28" font-weight="700" fill="#d06d4d" text-anchor="start">3 bits</text><text x="648" y="255" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="450" fill="#53676d" text-anchor="start">I(x) = -log₂ p(x)</text></svg>
