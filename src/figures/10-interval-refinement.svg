<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arith10a-title arith10a-desc" viewBox="0 0 920 380"><title id="arith10a-title">消息 ABA：每输入一个符号，候选区间继续缩小</title><desc id="arith10a-desc">初始[0,1)，A映射到[0,0.6)，B映射到[0.36,0.6)，最后A得到[0.36,0.504)，总宽度0.144。</desc><rect x="1" y="1" width="918" height="378" rx="17" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.4"/><text x="28" y="39" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" fill="#203035" font-weight="750" text-anchor="start">消息 ABA：每输入一个符号，候选区间继续缩小</text><path d="M28 54H893" fill="none" stroke="#dce8e4" stroke-width="1"/><text x="28" y="122" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#203035" font-weight="750" text-anchor="start">开始</text><rect x="150" y="101" width="684" height="33" rx="4" fill="#eff3f2" stroke="none" stroke-width="1.4"/><rect x="150" y="101" width="684" height="33" rx="3" fill="#53676d" stroke="none" stroke-width="1.4"/><text x="672" y="124" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" fill="#53676d" font-weight="750" text-anchor="start">[0, 1)</text><text x="28" y="189" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#203035" font-weight="750" text-anchor="start">读入 A</text><rect x="150" y="168" width="684" height="33" rx="4" fill="#eff3f2" stroke="none" stroke-width="1.4"/><rect x="150" y="168" width="410.4" height="33" rx="3" fill="#147f80" stroke="none" stroke-width="1.4"/><text x="570.4" y="191" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" fill="#147f80" font-weight="750" text-anchor="start">[0, 0.6)</text><text x="28" y="256" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#203035" font-weight="750" text-anchor="start">接着 B</text><rect x="150" y="235" width="684" height="33" rx="4" fill="#eff3f2" stroke="none" stroke-width="1.4"/><rect x="396.24" y="235" width="164.16" height="33" rx="3" fill="#7461ba" stroke="none" stroke-width="1.4"/><text x="570.4" y