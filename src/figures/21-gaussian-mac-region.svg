<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mac21-title mac21-desc" viewBox="0 0 920 380"><title id="mac21-title">两用户高斯 MAC 的容量域</title><desc id="mac21-desc">速率对必须满足两个单用户上限和一个总和速率上限。阴影区域内可达，边界角点对应两种 SIC 解码顺序。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" fill="#203035">两用户高斯 MAC 的容量域</text><path d="M28 53H892" stroke="#dce8e4"/><path d="M110 310H835M110 310V78" fill="none" stroke="#53676d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 310L110 310L110 310" fill="none" stroke="#53676d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 310L110 310" fill="none" stroke="#53676d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><polygon points="110,310 110,130 445,130 665,235 835,235 835,310" fill="#e7f5f2" stroke="#147f80" stroke-width="2.5"/><path d="M445 130L665 235" fill="none" stroke="#d06d4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="110" y="337" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#53676d">0</text><text x="835" y="337" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="end" fill="#53676d">R₁ →</text><text x="76" y="86" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">R₂</text><text x="265" y="116" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#147f80">R₁ ≤ C₁</text><text x="735" y="216" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#147f80">R₂ ≤ C₂</text><text x="540" y="177" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="750" text-anchor="middle" fill="#d06d4d">R₁+R₂ ≤ CΣ</text><text x="445" y="112" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="650" text-anchor="middle" fill="#7461ba">SIC：先解用户 1</text><text x="665" y="260" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="650" text-anchor="middle" fill="#7461ba">SIC：先解用户 2</text><text x="480" y="294" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#147f80">可达速率区域</text></svg>