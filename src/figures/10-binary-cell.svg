<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arith10b-title arith10b-desc" viewBox="0 0 920 380"><title id="arith10b-title">固定长度二进制前缀必须对应完全包含在最终区间内的二进制格</title><desc id="arith10b-desc">最终算术区间是[0.36,0.504)，二进制前缀011对应所有以011开头的数，即[0.375,0.5)，整体被包含。</desc><rect x="1" y="1" width="918" height="378" rx="17" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.4"/><text x="28" y="39" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" fill="#203035" font-weight="750" text-anchor="start">固定长度二进制前缀必须对应完全包含在最终区间内的二进制格</text><path d="M28 54H893" fill="none" stroke="#dce8e4" stroke-width="1"/><rect x="75" y="122" width="771" height="59" rx="5" fill="#e7f5f2" stroke="#147f80" stroke-width="1.4"/><rect x="75" y="210" width="771" height="59" rx="5" fill="#edf0f2" stroke="none" stroke-width="1.4"/><rect x="352.56" y="210" width="111.02400000000002" height="59" rx="4" fill="#d9bcb0" stroke="#d06d4d" stroke-width="1.4"/><rect x="364.125" y="122" width="96.375" height="59" rx="4" fill="#147f80" stroke="none" stroke-width="1.4"/><text x="74" y="103" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" fill="#147f80" font-weight="750" text-anchor="start">3 位前缀 011 → [0.375, 0.500)</text><text x="74" y="198" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" fill="#d06d4d" font-weight="750" text-anchor="start">消息 ABA → [0.360, 0.504)</text><path d="M352.56 273V288" fill="none" stroke="#d06d4d" stroke-width="1.7"/><text x="339.56" y="310" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#d06d4d" font-weight="750" text-anchor="end">0.360</text><path d="M364.125 273V288" fill="none" stroke="#147f80" stroke-width="1.7"/><text x="364.125" y="310" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#147f80" font-weight="750" text-anchor="middle">0.375</text><path d="M460.5 273V288" fill="none" stroke="#d06d4d" stroke-width="1.7"/><text x="460.5" y="310" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#d06d4d" font-weight="750" text-anchor="middle">0.500</text><path d="M463.584 273V288" fill="none" stroke="#147f80" stroke-width="1.7"/><text x="477.584" y="310" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#147f80" font-weight="750" text-anchor="start">0.504</text><text x="75" y="350" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" fill="#53676d" font-weight="500" text-anchor="start">整个 dyadic 格必须在最终区间内；只选一个区间内的浮点数还不是完整位流。</text></svg>
