<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aep07b-title aep07b-desc" viewBox="0 0 920 380"><title id="aep07b-title">长度 n=8 的典型集仍可能只占少数概率</title><desc id="aep07b-desc">P(1)=0.25，容差epsilon=0.15。只有包含恰好2个1的序列满足弱典型性，总概率约0.31146。</desc><rect x="1" y="1" width="918" height="378" rx="10" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.4"/><text x="28" y="40" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" fill="#203035" font-weight="750" text-anchor="start">长度 n=8 的典型集仍可能只占少数概率</text><path d="M28 53 H892" fill="none" stroke="#dce8e4" stroke-width="1"/><path d="M76 297H850" fill="none" stroke="#53676d" stroke-width="1.5"/><rect x="107" y="244.88239422966453" width="58" height="52.11760577033547" rx="10" fill="#eef0f2" stroke="#c0cbd1" stroke-width="1.4"/><text x="136" y="321" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#203035" font-weight="700" text-anchor="middle">0</text><rect x="189" y="158.01971794577207" width="58" height="138.98028205422793" rx="10" fill="#eef0f2" stroke="#c0cbd1" stroke-width="1.4"/><text x="218" y="321" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#203035" font-weight="700" text-anchor="middle">1</text><rect x="271" y="134.85633760340073" width="58" height="162.14366239659927" rx="10" fill="#d0f0e7" stroke="#147f80" stroke-width="1.4"/><text x="300" y="321" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#203035" font-weight="700" text-anchor="middle">2</text><text x="300" y="109" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#147f80" font-weight="700" text-anchor="middle">典型</text><rect x="353" y="188.90422506893384" width="58" height="108.09577493106617" rx="10" fill="#eef0f2" stroke="#c0cbd1" stroke-width="1.4"/><text x="382" y="321" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#203035" font-weight="700" text-anchor="middle">3</text><rect x="435" y="251.96009377872244" width="58" height="45.03990622127757" rx="10" fill="#eef0f2" stroke="#c0cbd1" stroke-width="1.4"/><text x="464" y="321" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#203035" font-weight="700" text-anchor="middle">4</text><rect x="517" y="284.9893583409926" width="58" height="12.010641659007353" rx="10" fill="#eef0f2" stroke="#c0cbd1" stroke-width="1.4"/><text x="546" y="321" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#203035" font-weight="700" text-anchor="middle">5</text><rect x="599" y="294.9982263901654" width="58" height="2.001773609834559" rx="10" fill="#eef0f2" stroke="#c0cbd1" stroke-width="1.4"/><text x="628" y="321" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#203035" font-weight="700" text-anchor="middle">6</text><rect x="681" y="296.80935489430146" width="58" height="0.19064510569852938" rx="10" fill="#eef0f2" stroke="#c0cbd1" stroke-width="1.4"/><text x="710" y="321" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#203035" font-weight="700" text-anchor="middle">7</text><rect x="763" y="296.99205645392925" width="58" height="0.007943546070772058" rx="10" fill="#eef0f2" stroke="#c0cbd1" stroke-width="1.4"/><text x="792" y="321" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#203035" font-weight="700" text-anchor="middle">8</text><text x="30" y="90" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#53676d" font-weight="500" text-anchor="start">k = 序列中 1 的个数；柱高 = P(K=k)</text><text x="30" y="354" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" fill="#d06d4d" font-weight="700" text-anchor="start">ε=0.15：仅 k=2，P(K=2)=0.31146，有限 n 不必接近 1。</text></svg>
