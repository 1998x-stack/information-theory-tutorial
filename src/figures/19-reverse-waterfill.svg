<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rd19b-title rd19b-desc" viewBox="0 0 920 380"><title id="rd19b-title">高斯向量源的反向注水：低方差分量可以完全不编码</title><desc id="rd19b-desc">独立高斯分量方差为1、4、9，总失真预算D=4时反向水位theta=1.5。分配失真min(theta,variance)，因此低方差分量方差1全部放弃，其他分量各分配1.5。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">高斯向量源的反向注水：低方差分量可以完全不编码</text><path d="M28 53H892" fill="none" stroke="#dce8e4" stroke-width="1" /><rect x="50" y="122" width="245" height="131" rx="11" fill="#f1f3f2" stroke="#53676d" stroke-width="1.5"/><text x="172" y="158" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#203035">σ₁²=1</text><text x="172" y="195" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#53676d">D₁=1</text><text x="172" y="229" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#53676d">不编码</text><rect x="335" y="122" width="245" height="131" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="457" y="158" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#203035">σ₂²=4</text><text x="457" y="195" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#147f80">D₂=1.5</text><text x="457" y="229" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#53676d">保留信息</text><rect x="620" y="122" width="245" height="131" rx="11" fill="#e7f5f2" stroke="#7461ba" stroke-width="1.5"/><text x="742" y="158" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#203035">σ₃²=9</text><text x="742" y="195" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#7461ba">D₃=1.5</text><text x="742" y="229" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#53676d">保留信息</text><path d="M42 282H878" fill="none" stroke="#d06d4d" stroke-width="2" stroke-dasharray='7 5'/><text x="460" y="321" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#d06d4d">θ = 1.5；总失真 1 + 1.5 + 1.5 = 4</text><text x="35" y="356" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">R = ½[log₂(4/1.5) + log₂(9/1.5)] = 2 bits/vector</text></svg>