<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="enc17-title enc17-desc" viewBox="0 0 920 330"><title id="enc17-title">码率 1/2、K=3 卷积编码器的抽头结构</title><desc id="enc17-desc">当前比特 u 与两位历史 u1、u2 分别送入两个异或门：上方输出取三者之和 g0=111，下方输出取 u 与 u2 之和 g1=101；每来一位新输入，历史依次右移。</desc><rect x="1" y="1" width="918" height="328" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="40" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="21" font-weight="750" text-anchor="start">卷积编码器：当前比特 + 两位历史 = 两个输出</text><path d="M28 55H892" stroke="#dce8e4" stroke-width="1" fill="none"/><g font-family="system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><rect x="60" y="150" width="120" height="52" rx="9" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><text x="120" y="183" fill="#147f80">uₜ (当前)</text><rect x="212" y="150" width="120" height="52" rx="9" fill="#eef4f7" stroke="#53676d" stroke-width="1.6"/><text x="272" y="183" fill="#53676d">uₜ₋₁</text><rect x="364" y="150" width="120" height="52" rx="9" fill="#eef4f7" stroke="#53676d" stroke-width="1.6"/><text x="424" y="183" fill="#53676d">uₜ₋₂</text></g><path d="M180 176H206" stroke="#7461ba" stroke-width="2.2" fill="none"/><path d="M200 170l10 6-10 6z" fill="#7461ba"/><path d="M332 176H358" stroke="#7461ba" stroke-width="2.2" fill="none"/><path d="M352 170l10 6-10 6z" fill="#7461ba"/><text x="272" y="132" font-family="system-ui,sans-serif" fill="#53676d" font-size="13" text-anchor="middle">移位 →</text><g font-family="system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="middle"><rect x="640" y="70" width="150" height="76" rx="10" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.6"/><text x="715" y="102" fill="#c15a3c">异或 ⊕</text><text x="715" y="126" fill="#c15a3c" font-size="14">g₀ = 111</text><rect x="640" y="196" width="150" height="76" rx="10" fill="#eef4f7" stroke="#53676d" stroke-width="1.6"/><text x="715" y="228" fill="#53676d">异或 ⊕</text><text x="715" y="252" fill="#53676d" font-size="14">g₁ = 101</text></g><path d="M120 150V92H634" stroke="#d06d4d" stroke-width="1.8" fill="none"/><path d="M628 86l10 6-10 6z" fill="#d06d4d"/><path d="M272 150V108H634" stroke="#d06d4d" stroke-width="1.8" fill="none"/><path d="M628 102l10 6-10 6z" fill="#d06d4d"/><path d="M424 150V124H634" stroke="#d06d4d" stroke-width="1.8" fill="none"/><path d="M628 118l10 6-10 6z" fill="#d06d4d"/><path d="M120 202V236H634" stroke="#53676d" stroke-width="1.8" fill="none"/><path d="M628 230l10 6-10 6z" fill="#53676d"/><path d="M424 202V220H634" stroke="#53676d" stroke-width="1.8" fill="none"/><path d="M628 214l10 6-10 6z" fill="#53676d"/><text x="830" y="114" font-family="system-ui,sans-serif" fill="#c15a3c" font-size="17" font-weight="700" text-anchor="start">y⁽¹⁾</text><text x="830" y="240" font-family="system-ui,sans-serif" fill="#53676d" font-size="17" font-weight="700" text-anchor="start">y⁽²⁾</text><text x="30" y="312" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14" font-weight="500" text-anchor="start">两个输出共同构成 1/2 码率：每输入 1 比特输出 2 比特。异或只对 GF(2) 有意义，不是普通加法。</text></svg>
