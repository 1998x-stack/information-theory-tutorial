<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-labelledby="a10d-title a10d-desc"><title id="a10d-title">自适应算术编码：编解码双方的计数按符号同步</title><desc id="a10d-desc">初始A和B各一个伪计数；处理ABA时依次使用概率二分之一、三分之一、二分之一，区间变为从三分之一到十二分之五，解码器复现完全相同的计数更新。</desc><rect x="1" y="1" width="918" height="378" rx="17" fill="#fbfdfb" stroke="#dce8e4"/><text x="24" y="40" font-size="21" font-weight="700" fill="#203035" font-family="system-ui,'PingFang SC',sans-serif">先预测当前符号，再同步更新计数</text><path d="M24 54H895" stroke="#dce8e4"/><rect x="24" y="97" width="211" height="229" rx="12" fill="#fff" stroke="#147f80" stroke-width="1.8"/><text x="41" y="130" font-size="17" font-weight="700" fill="#147f80" font-family="system-ui,'PingFang SC',sans-serif">处理 A</text><text x="41" y="170" font-size="16" fill="#203035" font-family="system-ui,'PingFang SC',sans-serif">计数 (1,1)</text><text x="41" y="211" font-size="16" font-weight="700" fill="#147f80" font-family="system-ui,'PingFang SC',sans-serif">P(A)=1/2</text><path d="M41 233H218" stroke="#dce8e4"/><text x="41" y="266" font-size="16" fill="#53676d" font-family="system-ui,'PingFang SC',sans-serif">[0, 1/2)</text><rect x="250" y="97" width="211" height="229" rx="12" fill="#fff" stroke="#7461ba" stroke-width="1.8"/><text x="267" y="130" font-size="17" font-weight="700" fill="#7461ba" font-family="system-ui,'PingFang SC',sans-serif">处理 B</text><text x="267" y="170" font-size="16" fill="#203035" font-family="system-ui,'PingFang SC',sans-serif">计数 (2,1)</text><text x="267" y="211" font-size="16" font-weight="700" fill="#7461ba" font-family="system-ui,'PingFang SC',sans-serif">P(B)=1/3</text><path d="M267 233H444" stroke="#dce8e4"/><text x="267" y="266" font-size="16" fill="#53676d" font-family="system-ui,'PingFang SC',sans-serif">[1/3, 1/2)</text><rect x="476" y="97" width="211" height="229" rx="12" fill="#fff" stroke="#d06d4d" stroke-width="1.8"/><text x="493" y="130" font-size="17" font-weight="700" fill="#d06d4d" font-family="system-ui,'PingFang SC',sans-serif">处理 A</text><text x="493" y="170" font-size="16" fill="#203035" font-family="system-ui,'PingFang SC',sans-serif">计数 (2,2)</text><text x="493" y="211" font-size="16" font-weight="700" fill="#d06d4d" font-family="system-ui,'PingFang SC',sans-serif">P(A)=1/2</text><path d="M493 233H670" stroke="#dce8e4"/><text x="493" y="266" font-size="16" fill="#53676d" font-family="system-ui,'PingFang SC',sans-serif">[1/3, 5/12)</text><rect x="702" y="97" width="211" height="229" rx="12" fill="#fff" stroke="#916c22" stroke-width="1.8"/><text x="719" y="130" font-size="17" font-weight="700" fill="#916c22" font-family="system-ui,'PingFang SC',sans-serif">输出完成</text><text x="719" y="170" font-size="16" fill="#203035" font-family="system-ui,'PingFang SC',sans-serif">计数 (3,2)</text><text x="719" y="211" font-size="16" font-weight="700" fill="#916c22" font-family="system-ui,'PingFang SC',sans-serif">计数已同步</text><path d="M719 233H896" stroke="#dce8e4"/><text x="719" y="266" font-size="16" fill="#53676d" font-family="system-ui,'PingFang SC',sans-serif">消息 ABA</text><text x="24" y="359" font-size="14" fill="#53676d" font-family="system-ui,'PingFang SC',sans-serif">静态模型的 ABA 区间为 [0.36,0.504)；上述自适应方案另得 [1/3,5/12)。</text></svg>
