<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lz11c-title lz11c-desc" viewBox="0 0 920 380"><title id="lz11c-title">DEFLATE：匹配令牌再经过熵编码</title><desc id="lz11c-desc">DEFLATE将LZ77字面量或(长度,距离)匹配表示送入基于Huffman的位流编码。RFC1951规定区块头、码表形式、最大回距32KiB、匹配长度上限258字节；gzip是封装格式而非同义词。</desc><rect x="1" y="1" width="918" height="378" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="38" text-anchor="start" fill="#203035" font-size="21" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">DEFLATE：匹配令牌再经过熵编码</text><path d="M28 53H892" stroke="#dce8e4"/><rect x="30" y="124" width="221" height="127" rx="10" stroke="#147f80" stroke-width="1.5" fill="#e7f5f2"/><text x="140" y="160" text-anchor="middle" fill="#147f80" font-size="21" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">原始字节序列</text><text x="140" y="199" text-anchor="middle" fill="#53676d" font-size="17" font-weight="500" font-family="system-ui,'PingFang SC',sans-serif">ABCABCABC…</text><path d="M251 186 L322 186 m-8 -6 l8 6 -8 6" stroke="#147f80" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="331" y="124" width="257" height="127" rx="10" stroke="#7461ba" stroke-width="1.5" fill="#f2effd"/><text x="459" y="160" text-anchor="middle" fill="#7461ba" font-size="20" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">LZ77 匹配解析</text><text x="459" y="200" text-anchor="middle" fill="#53676d" font-size="16" font-weight="500" font-family="system-ui,'PingFang SC',sans-serif">字面量 / 长度–距离</text><path d="M588 186 L656 186 m-8 -6 l8 6 -8 6" stroke="#7461ba" stroke-width="2.5" fill="none" stroke-linecap="round"/><rect x="665" y="124" width="223" height="127" rx="10" stroke="#d06d4d" stroke-width="1.5" fill="#fff0e8"/><text x="776" y="160" text-anchor="middle" fill="#d06d4d" font-size="19" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">Huffman 位编码</text><text x="776" y="200" text-anchor="middle" fill="#53676d" font-size="14" font-weight="500" font-family="system-ui,'PingFang SC',sans-serif">最终 DEFLATE 区块</text><text x="33" y="310" text-anchor="start" fill="#53676d" font-size="15" font-weight="500" font-family="system-ui,'PingFang SC',sans-serif">DEFLATE：RFC 1951 的压缩数据格式；gzip：额外文件头、校验和与长度字段等。</text></svg>