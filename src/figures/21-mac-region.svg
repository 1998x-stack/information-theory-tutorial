<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mac21-title mac21-desc" viewBox="0 0 920 400"><title id="mac21-title">两用户高斯多址接入信道的五边形容量域</title><desc id="mac21-desc">横轴R1纵轴R2，容量域为五边形。两个角点约(0.79,0.29)与(0.42,0.66)由两种SIC解调顺序得到，斜边是和速率边界。</desc><rect x="1" y="1" width="918" height="398" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="34" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750" text-anchor="start">MAC 容量域：三条不等式围成的五边形</text><path d="M150 340V60H820" stroke="#9fb4b0" stroke-width="1.5"/><text x="828" y="336" font-family="ui-monospace,monospace" font-size="13" fill="#53676d" text-anchor="start">R1</text><text x="140" y="56" font-family="ui-monospace,monospace" font-size="13" fill="#53676d" text-anchor="end">R2</text><polygon points="150.0,340.0 774.7,340.0 774.7,230.8 484.2,93.2 150.0,93.2" fill="#e7f5f2" stroke="#147f80" stroke-width="2.2"/><path d="M774.7 230.8L484.2 93.2" stroke="#d06d4d" stroke-width="2.6"/><circle cx="774.7" cy="230.8" r="6" fill="#d06d4d"/><circle cx="484.2" cy="93.2" r="6" fill="#d06d4d"/><text x="784.7" y="222.8" font-family="ui-monospace,monospace" font-size="13" fill="#c15a3c" text-anchor="start">(0.79,0.29)</text><text x="478.2" y="106.2" font-family="ui-monospace,monospace" font-size="13" fill="#c15a3c" text-anchor="end">(0.42,0.66)</text><text x="150" y="384" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="start">P1=2, P2=1.5, sigma^2=1。角点对应一种 SIC 顺序，斜边为和速率上限，内部点靠时分达到。</text></svg>