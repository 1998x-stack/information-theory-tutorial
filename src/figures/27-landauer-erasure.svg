<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f27e-title f27e-desc" viewBox="0 0 960 400"><title id="f27e-title">Landauer：未知比特的擦除向热浴释放热量</title><desc id="f27e-desc">初始存储器为两个等概率状态 0 与 1，逻辑擦除映射到确定的 0。理想准静态热浴条件下有 Q_bath >= k_B T ln2。</desc><rect x="1.5" y="1.5" width="957" height="397" rx="20" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="30" y="44" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" font-weight="750" fill="#203035">Landauer：未知比特的擦除向热浴释放热量</text><path d="M30 59H930" stroke="#dce8e4" stroke-width="1.4"/><rect x="35" y="104" width="305" height="246" rx="11" fill="#eeebfa" stroke="#7461ba" stroke-width="2"/><rect x="455" y="152" width="190" height="133" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="2"/><rect x="710" y="152" width="210" height="133" rx="11" fill="#ffede5" stroke="#d06d4d" stroke-width="2"/><text x="187" y="137" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" fill="#7461ba">初态：随机 bit</text><rect x="72" y="180" width="95" height="76" rx="11" fill="#fff" stroke="#7461ba" stroke-width="2"/><rect x="210" y="180" width="95" height="76" rx="11" fill="#fff" stroke="#7461ba" stroke-width="2"/><text x="119" y="229" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="27" font-weight="750" fill="#7461ba">0</text><text x="257" y="229" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="27" font-weight="750" fill="#7461ba">1</text><text x="187" y="308" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" fill="#7461ba">H=1 bit</text><text x="550" y="186" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" fill="#147f80">复位为 0</text><text x="550" y="249" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" fill="#147f80">H=0</text><text x="815" y="186" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" fill="#d06d4d">环境 / 热浴</text><text x="815" y="241" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" fill="#d06d4d">Q ≥ kBT ln2</text><path d="M340 222H447" fill="none" stroke="#147f80" stroke-linecap="round" stroke-width="3" /><path d="M645 222H702" fill="none" stroke="#d06d4d" stroke-linecap="round" stroke-width="3" /><text x="480" y="373" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#53676d">约束来自特定的不可逆擦除过程，不是每个逻辑门的固定能耗</text></svg>