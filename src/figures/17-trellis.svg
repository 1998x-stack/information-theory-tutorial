<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="conv17b-title conv17b-desc" viewBox="0 0 920 380"><title id="conv17b-title">(7,5) 卷积码的 trellis：每个状态有两条输入分支</title><desc id="conv17b-desc">状态(s1,s0)=(过去两个输入位)。分支标记输入/输出；输入b后新状态(b,s1)。网格在时间方向重复，路径由初始状态和输入序列唯一确定。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">(7,5) 卷积码的 trellis：每个状态有两条输入分支</text><path d="M28 53H892" fill="none" stroke="#dce8e4" stroke-width="1" /><rect x="91" y="101" width="84" height="42" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="133" y="128" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#203035">00</text><rect x="91" y="176" width="84" height="42" rx="8" fill="white" stroke="#cbd8d5" stroke-width="1.5"/><text x="133" y="203" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#203035">10</text><rect x="91" y="251" width="84" height="42" rx="8" fill="white" stroke="#cbd8d5" stroke-width="1.5"/><text x="133" y="278" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#203035">01</text><rect x="91" y="326" width="84" height="42" rx="8" fill="white" stroke="#cbd8d5" stroke-width="1.5"/><text x="133" y="353" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#203035">11</text><rect x="426" y="101" width="84" height="42" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="468" y="128" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#203035">00</text><rect x="426" y="176" width="84" height="42" rx="8" fill="white" stroke="#cbd8d5" stroke-width="1.5"/><text x="468"