<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fisher22-title fisher22-desc" viewBox="0 0 920 380"><title id="fisher22-title">Fisher 信息连接似然曲率与局部 KL 散度</title><desc id="fisher22-desc">高 Fisher 信息意味着似然在参数附近更尖，邻近参数的分布差异增长更快；右侧曲线是 KL 对参数偏移的二阶近似。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" fill="#203035">Fisher 信息连接似然曲率与局部 KL 散度</text><path d="M28 53H892" stroke="#dce8e4"/><path d="M55 292H430M55 292V85" fill="none" stroke="#53676d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M55 110Q245 110 430 110" fill="none" stroke="#53676d" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M55 286Q165 285 245 92Q325 285 430 286" fill="none" stroke="#147f80" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M55 286Q180 284 245 198Q310 284 430 286" fill="none" stroke="#d06d4d" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" /><text x="245" y="77" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#203035">log likelihood</text><text x="350" y="129" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#147f80">高 Fisher：更尖</text><text x="350" y="219" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#d06d4d">低 Fisher：更平</text><path d="M490 292H865M490 292V85" fill="none" stroke="#53676d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M510 286Q675 286 845 98" fill="none" stroke="#7461ba" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><text x="675" y="77" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#7461ba">Dₖₗ(pθ ‖ pθ+δ)</text><path d="M675 286V170" fill="none" stroke="#53676d" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="675" y="315" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#53676d">δ →</text><text x="510" y="348" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#203035">局部：Dₖₗ ≈ ½ J(θ) δ²</text></svg>