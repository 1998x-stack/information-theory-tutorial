<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f27b-title f27b-desc" viewBox="0 0 960 400"><title id="f27b-title">Bell 纠缠：整体纯，局部最大混合</title><desc id="f27b-desc">Bell 态的联合状态 AB 是纯态，ρA 和 ρB 都是 I/2，量子互信息等于 2 bit。</desc><rect x="1.5" y="1.5" width="957" height="397" rx="20" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="30" y="44" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" font-weight="750" fill="#203035">Bell 纠缠：整体纯，局部最大混合</text><path d="M30 59H930" stroke="#dce8e4" stroke-width="1.4"/><rect x="40" y="130" width="270" height="160" rx="11" fill="#eeebfa" stroke="#7461ba" stroke-width="2"/><rect x="362" y="130" width="220" height="160" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="2"/><rect x="634" y="130" width="270" height="160" rx="11" fill="#ffede5" stroke="#d06d4d" stroke-width="2"/><text x="175" y="162" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" fill="#7461ba">联合系统 AB</text><text x="175" y="218" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" font-weight="750" fill="#7461ba">S(AB)=0</text><text x="175" y="248" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#53676d">|Φ⁺⟩ 纯态</text><text x="472" y="164" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" fill="#147f80">做偏迹</text><text x="472" y="211" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" fill="#147f80">Trᵦ(ρAB)</text><text x="769" y="161" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" fill="#d06d4d">单独系统 A、B</text><text x="769" y="213" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" fill="#d06d4d">S(A)=S(B)=1</text><text x="769" y="247" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#53676d">ρA=ρB=I/2</text><path d="M310 204H354M582 204H625" fill="none" stroke="#147f80" stroke-linecap="round" stroke-width="3" /><text x="475" y="357" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" fill="#203035">I(A:B) = S(A)+S(B)−S(AB) = 2 bit</text></svg>