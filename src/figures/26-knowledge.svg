<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="k26t k26d" viewBox="0 0 920 330"><title id="k26t">知识库越完善，语义熵越低</title><desc id="k26d">横轴为知识库 K 的覆盖度（0 到 1），纵轴为 bit。语义条件熵 H_s(M|K) 随覆盖度上升而下降，语义互信息 I_s(M;R|K) 随覆盖度上升而上升。</desc><rect x="1" y="1" width="918" height="328" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="36" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750">语义熵与知识库的依赖</text><path d="M150 70V290H840" stroke="#9fb4b0" stroke-width="1.5"/><polyline points="150,90 264,120 378,160 492,200 606,232 720,254 840,268" fill="none" stroke="#d06d4d" stroke-width="3"/><polyline points="150,280 264,250 378,215 492,182 606,152 720,128 840,108" fill="none" stroke="#147f80" stroke-width="3"/><text x="470" y="120" font-family="system-ui,'PingFang SC',sans-serif" fill="#d06d4d" font-size="14">H_s(M|K)：剩余不确定性下降</text><text x="470" y="250" font-family="system-ui,'PingFang SC',sans-serif" fill="#147f80" font-size="14">I_s(M;R|K)：被理解的含义上升</text><text x="150" y="316" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="middle">知识贫乏</text><text x="840" y="316" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="middle">知识完善</text><text x="120" y="190" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" transform="rotate(-90 120 190)" text-anchor="middle">bit</text></svg>
