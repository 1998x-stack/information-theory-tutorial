<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="b25t b25d" viewBox="0 0 920 340"><title id="b25t">经验熵的系统性低估：偏差随样本数下降</title><desc id="b25d">横轴为样本数 N（对数刻度），纵轴为经验熵相对真实熵的平均偏差（bits，向下为低估）。曲线按约 (m-1)/(2N ln2) 下降，类别数 m 越大偏差越严重；N 增大后趋近于零。</desc><rect x="1" y="1" width="918" height="338" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750">经验熵的负偏差随样本数减小</text><path d="M150 70V300H840" stroke="#9fb4b0" stroke-width="1.5"/><path d="M150 300H840" stroke="#9fb4b0" stroke-width="1.5"/><polyline points="150,203 254,252 391,281 495,290 599,295 736,298 840,299" fill="none" stroke="#147f80" stroke-width="3"/><polyline points="150,85 254,85 391,214 495,257 599,279 736,291 840,296" fill="none" stroke="#d06d4d" stroke-width="3"/><circle cx="150" cy="203" r="5" fill="#147f80"/><circle cx="254" cy="85" r="5" fill="#d06d4d"/><text x="260" y="80" font-family="system-ui,'PingFang SC',sans-serif" fill="#d06d4d" font-size="14">m=32：偏差大</text><text x="410" y="272" font-family="system-ui,'PingFang SC',sans-serif" fill="#147f80" font-size="14">m=8</text><text x="150" y="326" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="middle">10</text><text x="391" y="326" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="middle">50</text><text x="840" y="326" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="middle">1000</text><text x="495" y="62" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="middle">平均低估 ≈ (m−1)/(2N ln2) bit（渐近近似）</text><text x="120" y="200" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" transform="rotate(-90 120 200)" text-anchor="middle">偏差 (bits)</text></svg>
