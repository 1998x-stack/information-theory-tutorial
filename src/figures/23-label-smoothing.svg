<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ls23-title ls23-desc" viewBox="0 0 920 350"><title id="ls23-title">标签平滑抬高目标分布的熵</title><desc id="ls23-desc">四个类别的 one-hot 标签只有一个为1其余为0；平滑后正确类约0.925，其余各0.025，目标熵由0变为正数。</desc><rect x="1" y="1" width="918" height="348" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="36" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750" text-anchor="start">K=4，ε=0.1：one-hot vs 平滑标签</text><path d="M150 300H830" stroke="#9fb4b0" stroke-width="1.5"/><rect x="180" y="100" width="46" height="200" fill="#eef4f7" stroke="#53676d" stroke-width="1.3"/><rect x="234" y="115" width="46" height="185" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.3"/><text x="203" y="322" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">1</text><text x="257" y="322" font-family="ui-monospace,monospace" font-size="12" fill="#c15a3c" text-anchor="middle">0.925</text><rect x="330" y="300" width="46" height="0" fill="#eef4f7" stroke="#53676d" stroke-width="1.3"/><rect x="384" y="295" width="46" height="5" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.3"/><text x="353" y="322" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">0</text><text x="407" y="322" font-family="ui-monospace,monospace" font-size="12" fill="#c15a3c" text-anchor="middle">0.025</text><rect x="480" y="300" width="46" height="0" fill="#eef4f7" stroke="#53676d" stroke-width="1.3"/><rect x="534" y="295" width="46" height="5" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.3"/><text x="503" y="322" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">0</text><text x="557" y="322" font-family="ui-monospace,monospace" font-size="12" fill="#c15a3c" text-anchor="middle">0.025</text><rect x="630" y="300" width="46" height="0" fill="#eef4f7" stroke="#53676d" stroke-width="1.3"/><rect x="684" y="295" width="46" height="5" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.3"/><text x="653" y="322" font-family="ui-monospace,monospace" font-size="12" fill="#53676d" text-anchor="middle">0</text><text x="707" y="322" font-family="ui-monospace,monospace" font-size="12" fill="#c15a3c" text-anchor="middle">0.025</text><text x="220" y="70" font-family="system-ui,sans-serif" fill="#53676d" font-size="14" font-weight="700" text-anchor="start">灰色：one-hot（熵=0）</text><text x="220" y="92" font-family="system-ui,sans-serif" fill="#c15a3c" font-size="14" font-weight="700" text-anchor="start">橘色：平滑后（熵&gt;0）</text><text x="30" y="336" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="start">混合均匀分布 = 最大熵正则化，避免模型过度自信。</text></svg>