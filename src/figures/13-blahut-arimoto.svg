<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cap13b-title cap13b-desc" viewBox="0 0 920 380"><title id="cap13b-title">Blahut–Arimoto：输入分布根据输出行的信息贡献迭代更新</title><desc id="cap13b-desc">开始用正的输入先验p(x)，得到输出混合q(y)，求各行W(.|x)相对q(y)的KL，再按p(x)乘指数权重重归一化。用于有限离散无记忆信道。</desc><rect x="1" y="1" width="918" height="378" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="38" font-size="21" fill="#203035" text-anchor="start" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">Blahut–Arimoto：输入分布根据输出行的信息贡献迭代更新</text><path d="M28 53H892" stroke="#dce8e4" stroke-width="1" fill="none" /><rect x="22" y="124" width="203" height="154" rx="11" stroke="#147f80" stroke-width="1.5" fill="#e7f5f2"/><text x="123" y="152" font-size="14" fill="#147f80" text-anchor="middle" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">STEP 1</text><text x="123" y="190" font-size="18" fill="#147f80" text-anchor="middle" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">输入 p(x)</text><text x="123" y="233" font-size="14" fill="#53676d" text-anchor="middle" font-weight="500" font-family="system-ui,'PingFang SC',sans-serif">严格正的起点</text><rect x="249" y="124" width="203" height="154" rx="11" stroke="#7461ba" stroke-width="1.5" fill="#f2effd"/><text x="350" y="152" font-size="14" fill="#7461ba" text-anchor="middle" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">STEP 2</text><text x="350" y="190" font-size="18" fill="#7461ba" text-anchor="middle" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">输出 q(y)</text><text x="350" y="233" font-size="14" fill="#53676d" text-anchor="middle" font-weight="500" font-family="system-ui,'PingFang SC',sans-serif">Σₓ p(x)W(y|x)</text><rect x="476" y="124" width="203" height="154" rx="11" stroke="#d06d4d" stroke-width="1.5" fill="#e7f5f2"/><text x="577" y="152" font-size="14" fill="#d06d4d" text-anchor="middle" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">STEP 3</text><text x="577" y="190" font-size="18" fill="#d06d4d" text-anchor="middle" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">每行 Dₓ</text><text x="577" y="233" font-size="14" fill="#53676d" text-anchor="middle" font-weight="500" font-family="system-ui,'PingFang SC',sans-serif">D(W(.|x)∥q)</text><rect x="703" y="124" width="203" height="154" rx="11" stroke="#147f80" stroke-width="1.5" fill="#f2effd"/><text x="804" y="152" font-size="14" fill="#147f80" text-anchor="middle" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">STEP 4</text><text x="804" y="190" font-size="18" fill="#147f80" text-anchor="middle" font-weight="750" font-family="system-ui,'PingFang SC',sans-serif">更新 p⁺(x)</text><text x="804" y="233" font-size="14" fill="#53676d" text-anchor="middle" font-weight="500" font-family="system-ui,'PingFang SC',sans-serif">p(x) × 2^Dₓ</text><text x="30" y="327" font-size="15" fill="#53676d" text-anchor="start" font-weight="500" font-family="system-ui,'PingFang SC',sans-serif">循环 2→3→4→2；每一步的 q(y) 来自本轮输入分布。</text><text x="30" y="357" font-size="14" fill="#53676d" text-anchor="start" font-weight="500" font-family="system-ui,'PingFang SC',sans-serif">0 概率输出项按 0 log 0 的极限约定处理；停止准则应基于收敛精度。</text></svg>