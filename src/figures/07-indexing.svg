<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aep07c-title aep07c-desc" viewBox="0 0 920 380"><title id="aep07c-title">近乎无损与完全无损的编码目标不同</title><desc id="aep07c-desc">典型集固定长度编号可以允许例外事件出错；可变长度完全无损方案则为例外保留逃逸分支。</desc><rect x="1" y="1" width="918" height="378" rx="10" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.4"/><text x="28" y="40" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" fill="#203035" font-weight="750" text-anchor="start">近乎无损与完全无损的编码目标不同</text><path d="M28 53 H892" fill="none" stroke="#dce8e4" stroke-width="1"/><rect x="25" y="88" width="423" height="243" rx="10" fill="#e7f5f2" stroke="#147f80" stroke-width="1.4"/><text x="47" y="123" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" fill="#147f80" font-weight="750" text-anchor="start">固定长度 · 近乎无损</text><rect x="48" y="150" width="176" height="60" rx="10" fill="white" stroke="#147f80" stroke-width="1.4"/><text x="136" y="188" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#203035" font-weight="700" text-anchor="middle">典型集编号</text><rect x="249" y="150" width="173" height="60" rx="10" fill="white" stroke="#147f80" stroke-width="1.4"/><text x="335" y="188" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#203035" font-weight="700" text-anchor="middle">短码字</text><path d="M225 180H248" fill="none" stroke="#147f80" stroke-width="3"/><text x="48" y="253" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#53676d" font-weight="500" text-anchor="start">非典型序列：可以视为错误</text><text x="48" y="297" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#147f80" font-weight="700" text-anchor="start">要求：错误概率 → 0</text><rect x="473" y="88" width="423" height="243" rx="10" fill="#fff4ed" stroke="#d06d4d" stroke-width="1.4"/><text x="494" y="123" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" fill="#d06d4d" font-weight="750" text-anchor="start">可变长度 · 完全无损</text><rect x="496" y="150" width="179" height="60" rx="10" fill="white" stroke="#d06d4d" stroke-width="1.4"/><text x="585" y="188" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#203035" font-weight="700" text-anchor="middle">典型集编号</text><rect x="702" y="150" width="165" height="60" rx="10" fill="white" stroke="#d06d4d" stroke-width="1.4"/><text x="784" y="188" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#203035" font-weight="700" text-anchor="middle">短码字</text><path d="M675 180H698" fill="none" stroke="#d06d4d" stroke-width="3"/><text x="495" y="252" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#53676d" font-weight="500" text-anchor="start">例外：标志位 + 原始描述</text><text x="495" y="297" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" fill="#d06d4d" font-weight="700" text-anchor="start">要求：每条序列精确恢复</text></svg>
