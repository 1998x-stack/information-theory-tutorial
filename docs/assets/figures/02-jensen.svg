<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="jensen-title jensen-desc"><title id="jensen-title">凹函数的弦位于函数图像下方</title><desc id="jensen-desc">对于凹函数log，先取期望再取log不小于先取log再取期望。</desc><rect x="1" y="1" width="898" height="348" rx="17" fill="#fbfdfb" stroke="#e1e9e7" stroke-width="1.5"/><text x="28" y="37" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#203035" text-anchor="start">凹函数的弦位于函数图像下方</text><path d="M28 52 H872" fill="none" stroke="#dbe7e3" stroke-width="1" stroke-linecap="round" /><path d="M96 286 H824 M96 286 V78" fill="none" stroke="#53676d" stroke-width="1.5" stroke-linecap="round" /><path d="M113 265 C205 158 360 99 790 73" fill="none" stroke="#147f80" stroke-width="4" stroke-linecap="round" /><path d="M175 196 L650 91" fill="none" stroke="#d06d4d" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 6"/><circle cx="175" cy="196" r="7" fill="#d06d4d"/><circle cx="650" cy="91" r="7" fill="#d06d4d"/><text x="112" y="85" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="450" fill="#203035" text-anchor="start">log x</text><text x="352" y="190" font-family="system-ui,'PingFang SC',sans-serif" font-size="24" font-weight="700" fill="#147f80" text-anchor="start">E[log X] ≤ log E[X]</text><text x="119" y="326" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="450" fill="#53676d" text-anchor="start">图中的曲线与两点连线仅表示 Jensen 不等式的几何直觉。</text></svg>
