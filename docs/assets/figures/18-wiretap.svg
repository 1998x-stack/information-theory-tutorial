<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wt18-title wt18-desc" viewBox="0 0 920 320"><title id="wt18-title">退化窃听信道：主信道优于窃听信道时保密容量为正</title><desc id="wt18-desc">发送方 Alice 的信号经容量 C_M 的主信道到达 Bob，同时经容量更低的 C_E 旁路信道到达 Eve。保密容量为正，可用保密编码使 Eve 的信息趋于零。</desc><rect x="1" y="1" width="918" height="318" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="40" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="21" font-weight="750" text-anchor="start">Wyner 窃听信道模型</text><path d="M28 55H892" stroke="#dce8e4" stroke-width="1" fill="none"/><g font-family="system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><rect x="70" y="120" width="150" height="70" rx="10" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><text x="145" y="152" fill="#147f80">Alice</text><text x="145" y="176" fill="#147f80" font-size="13">发送 X</text><rect x="620" y="80" width="170" height="70" rx="10" fill="#eef4f7" stroke="#53676d" stroke-width="1.6"/><text x="705" y="112" fill="#53676d">Bob（合法）</text><text x="705" y="136" fill="#53676d" font-size="13">容量 C_M</text><rect x="620" y="210" width="170" height="70" rx="10" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.6"/><text x="705" y="242" fill="#c15a3c">Eve（窃听）</text><text x="705" y="266" fill="#c15a3c" font-size="13">容量 C_E &lt; C_M</text></g><path d="M220 145C380 145 480 118 614 115" stroke="#147f80" stroke-width="2.6" fill="none"/><path d="M606 107l12 7-12 7z" fill="#147f80"/><text x="410" y="122" font-family="system-ui,'PingFang SC',sans-serif" fill="#147f80" font-size="14" font-weight="700" text-anchor="middle">主信道（好）</text><path d="M220 168C380 168 480 240 614 244" stroke="#d06d4d" stroke-width="2.6" fill="none" stroke-dasharray="6 4"/><path d="M606 236l12 8-12 6z" fill="#d06d4d"/><text x="410" y="242" font-family="system-ui,'PingFang SC',sans-serif" fill="#c15a3c" font-size="14" font-weight="700" text-anchor="middle">旁路信道（差）</text><text x="30" y="300" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14" font-weight="500" text-anchor="start">保密容量 C_s = max[I(V;Y) − I(V;Z)]；在退化信道下等于 C_M − C_E &gt; 0。</text></svg>
