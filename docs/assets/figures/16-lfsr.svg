<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lfsr16-title lfsr16-desc" viewBox="0 0 920 320"><title id="lfsr16-title">LFSR 用移位与异或实现生成多项式除法</title><desc id="lfsr16-desc">数据位从左侧进入异或门，寄存器依次右移，最高位输出作为反馈；抽头位置对应生成多项式 g(x) 的非零系数，寄存器最终内容即余数。</desc><rect x="1" y="1" width="918" height="318" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="40" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="21" font-weight="750" text-anchor="start">LFSR：r 位寄存器 + 抽头异或 = 多项式除法</text><path d="M28 55H892" stroke="#dce8e4" stroke-width="1" fill="none"/><text x="40" y="118" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="15" font-weight="600" text-anchor="start">输入位</text><path d="M40 138H120" stroke="#7461ba" stroke-width="2.5" fill="none"/><path d="M114 132l10 6-10 6z" fill="#7461ba"/><circle cx="150" cy="138" r="22" fill="#fff0e8" stroke="#d06d4d" stroke-width="2"/><path d="M136 124l28 28M164 124l-28 28" stroke="#d06d4d" stroke-width="2.4" fill="none"/><text x="150" y="188" font-family="system-ui,sans-serif" fill="#c15a3c" font-size="14" font-weight="700" text-anchor="middle">异或</text><g font-family="system-ui,sans-serif" font-size="18" font-weight="700" text-anchor="middle"><rect x="220" y="112" width="120" height="52" rx="9" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="280" y="146" fill="#147f80">寄存器 0</text><rect x="380" y="112" width="120" height="52" rx="9" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="440" y="146" fill="#147f80">寄存器 1</text><rect x="540" y="112" width="120" height="52" rx="9" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="600" y="146" fill="#147f80">寄存器 2</text><rect x="700" y="112" width="120" height="52" rx="9" fill="#eef4f7" stroke="#53676d" stroke-width="1.5"/><text x="760" y="146" fill="#53676d">寄存器 3</text></g><path d="M172 138H214" stroke="#7461ba" stroke-width="2.5" fill="none"/><path d="M208 132l10 6-10 6z" fill="#7461ba"/><path d="M340 138H374" stroke="#7461ba" stroke-width="2.5" fill="none"/><path d="M368 132l10 6-10 6z" fill="#7461ba"/><path d="M500 138H534" stroke="#7461ba" stroke-width="2.5" fill="none"/><path d="M528 132l10 6-10 6z" fill="#7461ba"/><path d="M660 138H694" stroke="#7461ba" stroke-width="2.5" fill="none"/><path d="M688 132l10 6-10 6z" fill="#7461ba"/><path d="M820 138H880V262H150V164" stroke="#d06d4d" stroke-width="2" fill="none"/><path d="M150 164l-6-12 12 0z" fill="#d06d4d"/><text x="470" y="286" font-family="system-ui,'PingFang SC',sans-serif" fill="#c15a3c" font-size="15" font-weight="600" text-anchor="middle">反馈：寄存器 3（最高位）沿回路送回最左侧异或门</text><path d="M440 164V210" stroke="#147f80" stroke-width="2" fill="none" stroke-dasharray="5 4"/><text x="440" y="230" font-family="system-ui,'PingFang SC',sans-serif" fill="#147f80" font-size="14" font-weight="600" text-anchor="middle">抽头（g 的非零系数）</text><text x="30" y="304" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14" font-weight="500" text-anchor="start">示意图：箭头为数据流向；每个时钟处理 1 比特，硬件实现即触发器加异或门。</text></svg>
