<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="butterfly21-title butterfly21-desc" viewBox="0 0 920 380"><title id="butterfly21-title">蝶形网络：瓶颈链路上发送 XOR</title><desc id="butterfly21-desc">源 A 发送 a，源 B 发送 b。瓶颈链路传 a XOR b；目的端 D1 已知 a，D2 已知 b，因此都能恢复缺失比特。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" fill="#203035">蝶形网络：瓶颈链路上发送 XOR</text><path d="M28 53H892" stroke="#dce8e4"/><rect x="35" y="120" width="88" height="52" rx="12" fill="#eeeaff" stroke="#7461ba" stroke-width="1.6"/><rect x="35" y="250" width="88" height="52" rx="12" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.6"/><rect x="330" y="184" width="120" height="60" rx="12" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><rect x="775" y="120" width="100" height="52" rx="12" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><rect x="775" y="250" width="100" height="52" rx="12" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><text x="79" y="151" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#7461ba">源 A：a</text><text x="79" y="281" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#d06d4d">源 B：b</text><text x="390" y="220" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#147f80">中继 XOR</text><text x="825" y="151" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#147f80">目的 D₁</text><text x="825" y="281" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#147f80">目的 D₂</text><path d="M123 145H235V194H322" fill="none" stroke="#7461ba" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M123 276H235V234H322" fill="none" stroke="#d06d4d" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M450 214H615V145H767" fill="none" stroke="#147f80" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M615 214V276H767" fill="none" stroke="#147f80" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><rect x="545" y="83" width="185" height="42" rx="12" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.6"/><text x="637" y="109" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#d06d4d">瓶颈：a ⊕ b</text><path d="M615 125V185" fill="none" stroke="#d06d4d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="825" y="185" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="650" text-anchor="middle" fill="#53676d">已知 a → 得 b</text><text x="825" y="315" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="650" text-anchor="middle" fill="#53676d">已知 b → 得 a</text><text x="465" y="350" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#53676d">侧信息让同一条瓶颈链路服务两个目的端</text></svg>