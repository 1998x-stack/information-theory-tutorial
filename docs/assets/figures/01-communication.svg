<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="comm-title comm-desc"><title id="comm-title">随机消息在通信系统中的路径</title><desc id="comm-desc">信源 X 经过编码、含噪信道和解码，接收端获得估计的原消息。</desc><rect x="1" y="1" width="898" height="348" rx="17" fill="#fbfdfb" stroke="#e1e9e7" stroke-width="1.5"/><text x="28" y="37" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#203035" text-anchor="start">随机消息在通信系统中的路径</text><path d="M28 52 H872" fill="none" stroke="#dbe7e3" stroke-width="1" stroke-linecap="round" /><rect x="25" y="109" width="154" height="103" rx="12" fill="#e7f6f1" stroke="#147f80" stroke-width="1.5"/><text x="102" y="147" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="middle">信源 X</text><text x="102" y="178" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="450" fill="#53676d" text-anchor="middle">生成随机消息</text><path d="M181 160 L203 160 M194 154 L203 160 L194 166" fill="none" stroke="#147f80" stroke-width="2.5" stroke-linecap="round" /><rect x="205" y="109" width="154" height="103" rx="12" fill="white" stroke="#147f80" stroke-width="1.5"/><text x="282" y="147" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="middle">编码器</text><text x="282" y="178" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="450" fill="#53676d" text-anchor="middle">映射为码字</text><path d="M361 160 L383 160 M374 154 L383 160 L374 166" fill="none" stroke="#147f80" stroke-width="2.5" stroke-linecap="round" /><rect x="385" y="109" width="154" height="103" rx="12" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="462" y="147" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="middle">含噪信道</text><text x="462" y="178" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="450" fill="#53676d" text-anchor="middle">可能出错</text><path d="M541 160 L563 160 M554 154 L563 160 L554 166" fill="none" stroke="#147f80" stroke-width="2.5" stroke-linecap="round" /><rect x="565" y="109" width="154" height="103" rx="12" fill="white" stroke="#147f80" stroke-width="1.5"/><text x="642" y="147" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="middle">译码器</text><text x="642" y="178" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="450" fill="#53676d" text-anchor="middle">估计消息</text><path d="M721 160 L743 160 M734 154 L743 160 L734 166" fill="none" stroke="#147f80" stroke-width="2.5" stroke-linecap="round" /><rect x="745" y="109" width="154" height="103" rx="12" fill="#eeeafe" stroke="#7461ba" stroke-width="1.5"/><text x="822" y="147" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#203035" text-anchor="middle">目的地</text><text x="822" y="178" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="450" fill="#53676d" text-anchor="middle">得到输出</text><text x="28" y="264" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="450" fill="#53676d" text-anchor="start">通信问题：以多少资源表达信源的信息，又能如何对抗信道噪声？</text><text x="28" y="311" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="450" fill="#53676d" text-anchor="start">此处是概念链路，不包含实际调制与同步模块。</text></svg>
