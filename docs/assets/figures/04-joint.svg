<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="joint-title joint-desc"><title id="joint-title">带噪二元信道的联合概率表</title><desc id="joint-desc">输入均匀、翻转率0.1；正确组合各为0.45，错误组合各为0.05。</desc><rect x="1" y="1" width="898" height="348" rx="17" fill="#fbfdfb" stroke="#e1e9e7" stroke-width="1.5"/><text x="28" y="37" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#203035" text-anchor="start">带噪二元信道的联合概率表</text><path d="M28 52 H872" fill="none" stroke="#dbe7e3" stroke-width="1" stroke-linecap="round" /><text x="305" y="89" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">输出 Y=0</text><text x="595" y="89" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">输出 Y=1</text><text x="65" y="160" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">输入 X=0</text><text x="65" y="270" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#203035" text-anchor="start">输入 X=1</text><rect x="292" y="112" width="229" height="87" rx="12" fill="#d8f0e8" stroke="#147f80" stroke-width="1.5"/><text x="407" y="167" font-family="system-ui,'PingFang SC',sans-serif" font-size="29" font-weight="700" fill="#147f80" text-anchor="middle">0.45</text><rect x="562" y="112" width="229" height="87" rx="12" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="677" y="167" font-family="system-ui,'PingFang SC',sans-serif" font-size="29" font-weight="700" fill="#d06d4d" text-anchor="middle">0.05</text><rect x="292" y="220" width="229" height="87" rx="12" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="407" y="275" font-family="system-ui,'PingFang SC',sans-serif" font-size="29" font-weight="700" fill="#d06d4d" text-anchor="middle">0.05</text><rect x="562" y="220" width="229" height="87" rx="12" fill="#d8f0e8" stroke="#147f80" stroke-width="1.5"/><text x="677" y="275" font-family="system-ui,'PingFang SC',sans-serif" font-size="29" font-weight="700" fill="#147f80" text-anchor="middle">0.45</text><text x="28" y="330" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="450" fill="#53676d" text-anchor="start">每行总概率为0.50；对角线是无错接收，非对角线是翻转。</text></svg>
