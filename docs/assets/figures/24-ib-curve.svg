<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ib24t ib24d" viewBox="0 0 920 380"><title id="ib24t">信息瓶颈：压缩与预测的权衡曲线</title><desc id="ib24d">横轴为压缩率 I(X;T)，纵轴为保留的相关性 I(T;Y)。曲线自原点向右上凸起并逐渐变缓。β 大时工作点靠近原点，压缩强、保留少；β 小时工作点靠右上，保留多、压缩弱。</desc><rect x="1" y="1" width="918" height="378" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750">信息曲线：I(X;T) 与 I(T;Y) 的权衡</text><path d="M150 70V320H840" stroke="#9fb4b0" stroke-width="1.5"/><polyline points="150,320 213,275 275,238 338,207 401,182 464,162 526,145 589,132 652,121 715,111 777,104 840,98" fill="none" stroke="#147f80" stroke-width="3"/><circle cx="213" cy="275" r="6" fill="#d06d4d"/><text x="222" y="298" font-family="system-ui,'PingFang SC',sans-serif" fill="#d06d4d" font-size="14">β 大：强压缩</text><circle cx="777" cy="104" r="6" fill="#7461ba"/><text x="640" y="92" font-family="system-ui,'PingFang SC',sans-serif" fill="#7461ba" font-size="14">β 小：高保真</text><text x="150" y="352" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14" text-anchor="middle">0</text><text x="840" y="352" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14" text-anchor="middle">I(X;T) 率</text><text x="120" y="200" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14" transform="rotate(-90 120 200)" text-anchor="middle">I(T;Y) 相关性</text><text x="470" y="70" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="middle">曲线以上区域不可达；以下为次优表征</text></svg>
