<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="maxent22-title maxent22-desc" viewBox="0 0 920 380"><title id="maxent22-title">最大熵取决于明确写出的约束</title><desc id="maxent22-desc">四个状态无额外约束时均匀分布最大熵；加入期望约束后，最优分布变为相应指数族形式。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" fill="#203035">最大熵取决于明确写出的约束</text><path d="M28 53H892" stroke="#dce8e4"/><rect x="40" y="90" width="380" height="240" rx="12" fill="#fff" stroke="#147f80" stroke-width="1.6"/><rect x="500" y="90" width="380" height="240" rx="12" fill="#fff" stroke="#7461ba" stroke-width="1.6"/><text x="230" y="119" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#147f80">无额外约束：均匀</text><text x="690" y="119" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#7461ba">给定矩约束：指数族</text><rect x="85" y="205" width="42" height="85" rx="5" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><text x="106" y="193" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="650" text-anchor="middle" fill="#147f80">¼</text><rect x="160" y="205" width="42" height="85" rx="5" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><text x="181" y="193" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="650" text-anchor="middle" fill="#147f80">¼</text><rect x="235" y="205" width="42" height="85" rx="5" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><text x="256" y="193" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="650" text-anchor="middle" fill="#147f80">¼</text><rect x="310" y="205" width="42" height="85" rx="5" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><text x="331" y="193" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="650" te