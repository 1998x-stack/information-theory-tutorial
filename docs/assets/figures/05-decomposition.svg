<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="kldecomp-title kldecomp-desc"><title id="kldecomp-title">交叉熵 = 本征熵 + 分布失配</title><desc id="kldecomp-desc">对于p=(0.75,0.25)与q=(0.5,0.5)，H(p)=0.8113，KL=0.1887，交叉熵为1bit。</desc><rect x="1" y="1" width="898" height="348" rx="17" fill="#fbfdfb" stroke="#e1e9e7" stroke-width="1.5"/><text x="28" y="37" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#203035" text-anchor="start">交叉熵 = 本征熵 + 分布失配</text><path d="M28 52 H872" fill="none" stroke="#dbe7e3" stroke-width="1" stroke-linecap="round" /><rect x="82" y="121" width="574.3848240000001" height="100" rx="6" fill="#d9f3e9" stroke="#147f80" stroke-width="1.5"/><rect x="656.3848240000001" y="121" width="133.615176" height="100" rx="6" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="334" y="164" font-family="system-ui,'PingFang SC',sans-serif" font-size="24" font-weight="700" fill="#147f80" text-anchor="middle">H(p) = 0.8113</text><text x="334" y="195" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="450" fill="#53676d" text-anchor="middle">不可避免的平均长度</text><text x="724" y="162" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#d06d4d" text-anchor="middle">KL</text><text x="724" y="192" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="450" fill="#d06d4d" text-anchor="middle">0.1887</text><text x="82" y="258" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="450" fill="#203035" text-anchor="start">0 bit</text><text x="788" y="258" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="450" fill="#203035" text-anchor="end">1 bit</text><text x="82" y="309" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" font-weight="700" fill="#203035" text-anchor="start">H(p,q) = 1 bit／符号</text></svg>
