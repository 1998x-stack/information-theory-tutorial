<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c28t c28d" viewBox="0 0 920 320"><title id="c28t">不同数据上的每符号比特与其熵极限</title><desc id="c28d">柱状图对比三类数据的理论熵与典型无损编码后的每符号比特：英文文本熵约 4 至 5 比特，DNA 约 2 比特，随机字节约 8 比特且不可压缩。差值反映编码离熵极限的距离。</desc><rect x="1" y="1" width="918" height="318" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="36" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750">压缩必须针对信源统计特性</text><path d="M120 70V280H840" stroke="#9fb4b0" stroke-width="1.5"/><g font-family="system-ui,sans-serif" font-size="13"><rect x="180" y="130" width="70" height="150" rx="6" fill="#147f80"/><rect x="255" y="110" width="70" height="170" rx="6" fill="#d06d4d" opacity="0.8"/><text x="252" y="300" text-anchor="middle">英文文本</text><rect x="420" y="205" width="70" height="75" rx="6" fill="#147f80"/><rect x="495" y="205" width="70" height="75" rx="6" fill="#d06d4d" opacity="0.8"/><text x="492" y="300" text-anchor="middle">DNA 序列</text><rect x="660" y="70" width="70" height="210" rx="6" fill="#147f80"/><rect x="735" y="66" width="70" height="214" rx="6" fill="#d06d4d" opacity="0.8"/><text x="732" y="300" text-anchor="middle">随机字节</text><text x="215" y="122" text-anchor="middle">H≈4.5</text><text x="290" y="102" text-anchor="middle">编码≈5.0</text><text x="455" y="197" text-anchor="middle">H≈2.0</text><text x="530" y="197" text-anchor="middle">≈2.0</text><text x="695" y="62" text-anchor="middle">H≈8</text><text x="770" y="58" text-anchor="middle">≈8+</text></g><text x="480" y="322" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="12" text-anchor="middle">浅色柱为熵极限，深色柱为典型编码结果；数值为教学示意，仅表示趋势</text></svg>
