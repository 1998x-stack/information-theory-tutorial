<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crlb22-title crlb22-desc" viewBox="0 0 920 380"><title id="crlb22-title">正态均值估计：样本量越大，下界越低</title><desc id="crlb22-desc">对已知方差 σ²=4 的正态分布，n 个独立样本的 Fisher 信息为 n/4，样本均值方差和 CRLB 都为 4/n。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" fill="#203035">正态均值估计：样本量越大，下界越低</text><path d="M28 53H892" stroke="#dce8e4"/><path d="100 300H840M100 300V85" fill="none" stroke="#53676d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M100 280L840 100" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M100 100L840 280" fill="none" stroke="#d06d4d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="480" y="80" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#147f80">Fisher 信息 Jₙ = n/4</text><text x="480" y="325" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#d06d4d">CRLB = σ²/n = 4/n</text><text x="100" y="327" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#53676d">小样本</text><text x="840" y="327" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="end" fill="#53676d">大样本 n →</text><text x="35" y="102" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#147f80">信息</text><text x="35" y="120" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#d06d4d">精度</text></svg>