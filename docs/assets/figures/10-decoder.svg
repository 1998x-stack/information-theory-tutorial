<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arith10c-title arith10c-desc" viewBox="0 0 920 380"><title id="arith10c-title">同一个码值 0.375 如何按顺序被还原为 A、B、A？</title><desc id="arith10c-desc">解码器依次在当前区间中计算归一化位置：初始0.375判A，第一次缩放后0.625判B，第二次缩放后0.0625判A。</desc><rect x="1" y="1" width="918" height="378" rx="17" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.4"/><text x="28" y="39" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" fill="#203035" font-weight="750" text-anchor="start">同一个码值 0.375 如何按顺序被还原为 A、B、A？</text><path d="M28 54H893" fill="none" stroke="#dce8e4" stroke-width="1"/><rect x="29" y="101" width="264" height="218" rx="10" fill="white" stroke="#147f80" stroke-width="1.4"/><text x="46" y="134" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#147f80" font-weight="750" text-anchor="start">① 初始</text><text x="46" y="173" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" fill="#203035" font-weight="750" text-anchor="start">u=0.375</text><rect x="46" y="196" width="229" height="46" rx="10" fill="#e7f5f2" stroke="#147f80" stroke-width="1.4"/><text x="161" y="225" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#147f80" font-weight="750" text-anchor="middle">选择 A</text><text x="46" y="289" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#53676d" font-weight="500" text-anchor="start">[0, 0.6)</text><rect x="332" y="101" width="264" height="218" rx="10" fill="white" stroke="#7461ba" stroke-width="1.4"/><text x="349" y="134" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#7461ba" font-weight="750" text-anchor="start">② 已知 A</text><text x="349" y="173" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" fill="#203035" font-weight="750" text-anchor="start">u=0.625</text><rect x="349" y="196" width="229" height="46" rx="10" fill="#f0ebff" stroke="#7461ba" stroke-width="1.4"/><text x="464" y="225" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#7461ba" font-weight="750" text-anchor="middle">选择 B</text><text x="349" y="289" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#53676d" font-weight="500" text-anchor="start">[0.36, 0.6)</text><rect x="635" y="101" width="264" height="218" rx="10" fill="white" stroke="#d06d4d" stroke-width="1.4"/><text x="652" y="134" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#d06d4d" font-weight="750" text-anchor="start">③ 已知 AB</text><text x="652" y="173" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" fill="#203035" font-weight="750" text-anchor="start">u=0.0625</text><rect x="652" y="196" width="229" height="46" rx="10" fill="#fff1e9" stroke="#d06d4d" stroke-width="1.4"/><text x="767" y="225" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#d06d4d" font-weight="750" text-anchor="middle">选择 A</text><text x="652" y="289" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#53676d" font-weight="500" text-anchor="start">[0.36, 0.504)</text><text x="30" y="355" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#53676d" font-weight="500" text-anchor="start">每一步使用旧区间和同一张概率表；需要预先知道序列长度或约定 EOF。</text></svg>
