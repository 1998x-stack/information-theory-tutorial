<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="b28t b28d" viewBox="0 0 920 320"><title id="b28t">误码率随信噪比下降：编码与未编码对比</title><desc id="b28d">横轴为信噪比（dB），纵轴为误码率（对数刻度）。未编码曲线随信噪比缓慢下降，Hamming 编码曲线整体在更低位置，说明相同信噪比下误码率更小；曲线为示意，不代表任何具体实现的指标。</desc><rect x="1" y="1" width="918" height="318" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="36" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750">编码带来的误码率增益</text><path d="M170 70V280H840" stroke="#9fb4b0" stroke-width="1.5"/><polyline points="170,110 300,150 430,190 560,225 700,250 840,266" fill="none" stroke="#9fb4b0" stroke-width="3"/><polyline points="170,200 300,230 430,250 560,262 700,270 840,275" fill="none" stroke="#147f80" stroke-width="3"/><text x="210" y="100" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14">未编码</text><text x="210" y="192" font-family="system-ui,'PingFang SC',sans-serif" fill="#147f80" font-size="14">Hamming(7,4)</text><text x="505" y="316" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="middle">信噪比 (dB) →</text><text x="130" y="200" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" transform="rotate(-90 130 200)" text-anchor="middle">误码率（对数）</text><text x="620" y="290" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="12">曲线为教学示意，无具体实现指标</text></svg>
