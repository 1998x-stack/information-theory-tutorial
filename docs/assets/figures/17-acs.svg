<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="acs17-title acs17-desc" viewBox="0 0 920 320"><title id="acs17-title">ACS：两条入边在汇合点比较度量，只保留较小者</title><desc id="acs17-desc">状态 A 的路径度量为 2，加上分支距离 1 得 3；状态 B 的度量为 1，加上分支距离 1 得 2。两条候选在状态 C 比较，保留 2 对应的路径并记录其前驱。</desc><rect x="1" y="1" width="918" height="318" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="40" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="21" font-weight="750" text-anchor="start">加 — 比 — 选（Add–Compare–Select）</text><path d="M28 55H892" stroke="#dce8e4" stroke-width="1" fill="none"/><g font-family="system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><rect x="110" y="80" width="170" height="56" rx="9" fill="#eef4f7" stroke="#53676d" stroke-width="1.5"/><text x="195" y="116" fill="#53676d">状态 A，度量 2</text><rect x="110" y="200" width="170" height="56" rx="9" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="195" y="236" fill="#147f80">状态 B，度量 1</text><rect x="560" y="140" width="230" height="56" rx="9" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.8"/><text x="675" y="176" fill="#c15a3c">状态 C，取最小</text></g><path d="M280 108 C380 108 460 160 554 168" stroke="#7461ba" stroke-width="2.4" fill="none"/><path d="M546 160l12 6-11 9z" fill="#7461ba"/><path d="M280 228 C380 228 460 180 554 172" stroke="#147f80" stroke-width="2.4" fill="none"/><path d="M546 178l11-9 1 12z" fill="#147f80"/><text x="410" y="106" font-family="ui-monospace,monospace" font-size="15" fill="#7461ba" text-anchor="middle">+1 → 3</text><text x="410" y="252" font-family="ui-monospace,monospace" font-size="15" fill="#147f80" text-anchor="middle">+1 → 2</text><text x="675" y="82" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="15" font-weight="700" text-anchor="middle">3 vs 2 ⇒ 保留 2</text><text x="675" y="104" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="middle">丢弃 A 这支，记录前驱为 B</text><text x="30" y="300" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14" font-weight="500" text-anchor="start">被丢弃路径不可能成为后续最优路径的前缀——这正是动态规划无后效性的体现。</text></svg>
