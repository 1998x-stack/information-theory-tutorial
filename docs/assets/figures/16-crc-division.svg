<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crc16a-title crc16a-desc" viewBox="0 0 920 380"><title id="crc16a-title">GF(2) 长除法：1101000 ÷ 1011，余数 001</title><desc id="crc16a-desc">消息1101后补3个0得到1101000。生成多项式1011对应x³+x+1。依次异或对齐的生成多项式，最终余数为001，系统码字1101001可被1011整除。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">GF(2) 长除法：1101000 ÷ 1011，余数 001</text><path d="M28 53H892" fill="none" stroke="#dce8e4" stroke-width="1" /><text x="38" y="103" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#203035">被除数</text><text x="330" y="103" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="start" fill="#203035">1101000</text><text x="38" y="132" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#147f80">第 1 次异或</text><text x="330" y="132" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="start" fill="#147f80">1011000</text><text x="38" y="161" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">余下</text><text x="330" y="161" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="start" fill="#53676d">0110000</text><text x="38" y="190" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#147f80">第 2 次异或</text><text x="330" y="190" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="start" fill="#147f80">0101100</text><text x="38" y="219" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">余下</text><tex