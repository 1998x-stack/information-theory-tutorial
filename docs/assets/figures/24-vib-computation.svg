<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vib24-title vib24-desc" viewBox="0 0 920 380"><title id="vib24-title">变分信息瓶颈的可训练计算图</title><desc id="vib24-desc">编码器输出高斯参数 μ、logσ²，采样 z=μ+σ⊙ε，预测头输出 qψ(y|z)；训练同时最小化任务 NLL 和 KL 正则。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" fill="#203035">变分信息瓶颈的可训练计算图</text><path d="M28 53H892" stroke="#dce8e4"/><rect x="25" y="140" width="120" height="68" rx="12" fill="#eeeaff" stroke="#7461ba" stroke-width="1.6"/><rect x="200" y="125" width="160" height="100" rx="12" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><rect x="415" y="140" width="115" height="68" rx="12" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.6"/><rect x="590" y="140" width="125" height="68" rx="12" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><rect x="775" y="140" width="120" height="68" rx="12" fill="#eeeaff" stroke="#7461ba" stroke-width="1.6"/><text x="85" y="180" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#7461ba">x</text><text x="280" y="165" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#147f80">Encoder</text><text x="280" y="192" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#147f80">μ, logσ²</text><text x="472" y="180" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#d06d4d">z</text><text x="652" y="180" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#147f80">Predictor</text><text x="835" y="180" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#7461ba">ŷ</text><path d="M145 174H192M360 174H407M530 174H582M715 174H767" fill="none" stroke="#53676d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><rect x="205" y="270" width="200" height="48" rx="12" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.6"/><text x="305" y="300" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#d06d4d">KL(qφ(z|x) ‖ r(z))</text><path d="M280 225V262" fill="none" stroke="#d06d4d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="655" y="260" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#147f80">任务 NLL = −log qψ(y|z)</text><text x="480" y="350" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="750" text-anchor="middle" fill="#203035">总损失 = 任务负对数似然 + β · KL</text></svg>