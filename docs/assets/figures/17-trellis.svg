<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tr17-title tr17-desc" viewBox="0 0 920 400"><title id="tr17-title">四状态卷积码网格图的重复结构</title><desc id="tr17-desc">四个状态竖排，时间横向展开。高两个状态只转移到高两个状态，低两个状态只转移到低两个状态。每条边标注输入与输出比特，橘色为输入0、蓝色为输入1。</desc><rect x="1" y="1" width="918" height="398" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="32" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="21" font-weight="750" text-anchor="start">网格图：状态随时间展开</text><path d="M28 46H892" stroke="#dce8e4" stroke-width="1" fill="none"/><text x="160" y="40" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#53676d" text-anchor="middle">t+0</text><text x="390" y="40" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#53676d" text-anchor="middle">t+1</text><text x="660" y="40" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#53676d" text-anchor="middle">t+2</text><text x="60" y="76" font-family="ui-monospace,monospace" font-size="18" font-weight="700" fill="#147f80" text-anchor="end">00</text><text x="60" y="156" font-family="ui-monospace,monospace" font-size="18" font-weight="700" fill="#147f80" text-anchor="end">01</text><text x="60" y="236" font-family="ui-monospace,monospace" font-size="18" font-weight="700" fill="#147f80" text-anchor="end">10</text><text x="60" y="316" font-family="ui-monospace,monospace" font-size="18" font-weight="700" fill="#147f80" text-anchor="end">11</text>['<path d="M160 70 C260 70 230 70 330 70" stroke="#e08a5f" stroke-width="1.6" fill="none"/><text x="245" y="66" font-family="ui-monospace,monospace" font-size="12" fill="#e08a5f" text-anchor="middle">0/00</text>', '<path d="M160 70 C260 70 230 230 330 230" stroke="#5f7fd0" stroke-width="1.6" fill="none"/><text x="245" y="146" font-family="ui-monospace,monospace" font-size="12" fill="#5f7fd0" text-anchor="middle">1/11</text>', '<path d="M160 150 C260 150 230 70 330 70" stroke="#e08a5f" stroke-width="1.6" fill="none"/><text x="245" y="106" font-family="ui-monospace,monospace" font-size="12" fill="#e08a5f" text-anchor="middle">0/10</text>', '<path d="M160 150 C260 150 230 230 330 230" stroke="#5f7fd0" stroke-width="1.6" fill="none"/><text x="245" y="186" font-family="ui-monospace,monospace" font-size="12" fill="#5f7fd0" text-anchor="middle">1/01</text>', '<path d="M160 230 C260 230 230 150 330 150" stroke="#e08a5f" stroke-width="1.6" fill="none"/><text x="245" y="186" font-family="ui-monospace,monospace" font-size="12" fill="#e08a5f" text-anchor="middle">0/11</text>', '<path d="M160 230 C260 230 230 310 330 310" stroke="#5f7fd0" stroke-width="1.6" fill="none"/><text x="245" y="266" font-family="ui-monospace,monospace" font-size="12" fill="#5f7fd0" text-anchor="middle">1/00</text>', '<path d="M160 310 C260 310 230 150 330 150" stroke="#e08a5f" stroke-width="1.6" fill="none"/><text x="245" y="226" font-family="ui-monospace,monospace" font-size="12" fill="#e08a5f" text-anchor="middle">0/01</text>', '<path d="M160 310 C260 310 230 310 330 310" stroke="#5f7fd0" stroke-width="1.6" fill="none"/><text x="245" y="306" font-family="ui-monospace,monospace" font-size="12" fill="#5f7fd0" text-anchor="middle">1/10</text>', '<path d="M390 70 C490 70 560 70 660 70" stroke="#e08a5f" stroke-width="1.2" fill="none" opacity="0.55"/>', '<path d="M390 70 C490 70 560 230 660 230" stroke="#5f7fd0" stroke-width="1.2" fill="none" opacity="0.55"/>', '<path d="M390 150 C490 150 560 70 660 70" stroke="#e08a5f" stroke-width="1.2" fill="none" opacity="0.55"/>', '<path d="M390 150 C490 150 560 230 660 230" stroke="#5f7fd0" stroke-width="1.2" fill="none" opacity="0.55"/>', '<path d="M390 230 C490 230 560 150 660 150" stroke="#e08a5f" stroke-width="1.2" fill="none" opacity="0.55"/>', '<path d="M390 230 C490 230 560 310 660 310" stroke="#5f7fd0" stroke-width="1.2" fill="none" opacity="0.55"/>', '<path d="M390 310 C490 310 560 150 660 150" stroke="#e08a5f" stroke-width="1.2" fill="none" opacity="0.55"/>', '<path d="M390 310 C490 310 560 310 660 310" stroke="#5f7fd0" stroke-width="1.2" fill="none" opacity="0.55"/>']<text x="70" y="382" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14" font-weight="500" text-anchor="start">边上的「输入 / 输出」由 g₀=111、g₁=101 决定；两步以后图形逐列重复，因此可用同一套 ACS 反复处理。</text></svg>