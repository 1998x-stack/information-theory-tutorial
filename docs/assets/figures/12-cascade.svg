<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ch12c-title ch12c-desc" viewBox="0 0 920 380"><title id="ch12c-title">两个独立 BSC 级联：翻转概率不直接相加</title><desc id="ch12c-desc">第一段BSC翻转概率0.1，第二段BSC翻转概率0.2且误差独立，最终仅当恰好一次翻转时出现错误；ε_total=0.1×0.8+0.9×0.2=0.26。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.4"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">两个独立 BSC 级联：翻转概率不直接相加</text><path d="M28 54H891" stroke="#dce8e4"/><rect x="32" y="120" width="187" height="109" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.4"/><text x="124" y="162" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="middle" fill="#147f80">BSC p=0.1</text><text x="124" y="197" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#53676d">第一段噪声</text><path d="M223 174L313 174m-9 -6l9 6 -9 6" fill="none" stroke="#147f80" stroke-width="2.7"/><rect x="322" y="120" width="219" height="109" rx="11" fill="#eeeaff" stroke="#7461ba" stroke-width="1.4"/><text x="431" y="162" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="middle" fill="#7461ba">BSC q=0.2</text><text x="431" y="197" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#53676d">第二段噪声</text><path d="M544 174L636 174m-9 -6l9 6 -9 6" fill="none" stroke="#7461ba" stroke-width="2.7"/><rect x="646" y="120" width="240" height="109" rx="11" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.4"/><text x="766" y="162" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#d06d4d">总翻转 = 0.26</text><text x="766" y="197" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#53676d">两次翻转会抵消</text><text x="32" y="286" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="start" fill="#203035">P(恰好一次翻转) = p(1−q) + (1−p)q = p+q−2pq</text><text x="32" y="333" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">假设：两段错误随机变量相互独立，并且输入均为二进制符号。</text></svg>