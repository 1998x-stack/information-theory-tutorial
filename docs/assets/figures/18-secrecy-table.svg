<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sec18b-title sec18b-desc" viewBox="0 0 920 380"><title id="sec18b-title">均匀密钥使 P(C=c | M=m)=1/2：密文与明文独立</title><desc id="sec18b-desc">当M和K均为单比特，K均匀且独立时，对任意固定m，C=m XOR K仍然均匀。两个条件分布行相同，故观察密文不会改变明文后验概率。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">均匀密钥使 P(C=c | M=m)=1/2：密文与明文独立</text><path d="M28 53H892" fill="none" stroke="#dce8e4" stroke-width="1" /><text x="35" y="100" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="start" fill="#203035">P(C=c | M=m)</text><text x="338" y="100" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#203035">C = 0</text><text x="638" y="100" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" font-weight="750" text-anchor="middle" fill="#203035">C = 1</text><text x="38" y="172" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="start" fill="#203035">M=0</text><rect x="222" y="124" width="228" height="65" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="336" y="166" font-family="system-ui,'PingFang SC',sans-serif" font-size="24" font-weight="750" text-anchor="middle" fill="#147f80">1/2</text><rect x="522" y="124" width="228" height="65" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="636" y="166" font-family="system-ui,'PingFang SC',sans-serif" font-size="24" font-weight="750" text-anchor="middle" fill="#147f80">1/2</text><text x="38" y="261" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="start" fill="#203035">M=1</text><rect x="222" y="213" width="228" height="65" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="336" y="255" font-family="system-ui,'PingFang SC',sans-serif" font-size="24" font-weight="750" text-anchor="middle" fill="#147f80">1/2</text><rect x="522" y="213" width="228" height="65" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="636" y="255" font-family="system-ui,'PingFang SC',sans-serif" font-size="24" font-weight="750" text-anchor="middle" fill="#147f80">1/2</text><text x="36" y="339" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="start" fill="#147f80">两行完全相同 ⇒ P(C|M)=P(C) ⇒ I(M;C)=0。</text></svg>