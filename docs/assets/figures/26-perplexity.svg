<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pp26t pp26d" viewBox="0 0 920 330"><title id="pp26t">困惑度与每 token 比特数的关系</title><desc id="pp26d">横轴为困惑度（对数刻度 2 到 100），纵轴为每 token 的编码比特 log2(perplexity)。点 (2,1)、(10,3.32)、(100,6.64) 落在一条直线上，说明困惑度是平均交叉熵的指数形式。</desc><rect x="1" y="1" width="918" height="328" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="36" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750">困惑度就是平均交叉熵的指数</text><path d="M150 70V290H840" stroke="#9fb4b0" stroke-width="1.5"/><polyline points="150,250 495,170 840,90" fill="none" stroke="#147f80" stroke-width="3"/><circle cx="150" cy="250" r="6" fill="#d06d4d"/><circle cx="495" cy="170" r="6" fill="#d06d4d"/><circle cx="840" cy="90" r="6" fill="#d06d4d"/><g font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#53676d"><text x="150" y="316" text-anchor="middle">2</text><text x="495" y="316" text-anchor="middle">10</text><text x="840" y="316" text-anchor="middle">100</text><text x="162" y="245">1.00 bit</text><text x="507" y="165">3.32 bit</text><text x="790" y="85">6.64 bit</text></g><text x="120" y="190" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" transform="rotate(-90 120 190)" text-anchor="middle">每 token 比特</text><text x="495" y="60" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="middle">横轴为困惑度（对数刻度）</text></svg>
