<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m25t m25d" viewBox="0 0 920 260"><title id="m25t">MINE 与 InfoNCE 是下界而非测量值</title><desc id="m25d">一条从 0 到 1.2 的横轴表示互信息量，真实值位于 1.0。InfoNCE 与 MINE 给出不超过真实值的下界，箭头从估计点向右指向真实值，表示它们只能逼近而不会超过。KSG 型估计落在真实值附近但仍有方差。</desc><rect x="1" y="1" width="918" height="258" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750">神经估计器给出的是下界</text><path d="M80 150H860" stroke="#9fb4b0" stroke-width="1.5"/><path d="M775 120V180" stroke="#203035" stroke-width="3"/><text x="775" y="108" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="14" text-anchor="middle" font-weight="700">真实 I(X;Y)=1.00</text><g font-family="system-ui,'PingFang SC',sans-serif" font-size="14"><circle cx="230" cy="150" r="7" fill="#7461ba"/><path d="M240 150H770" stroke="#7461ba" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#b25)"/><text x="230" y="138" fill="#7461ba" text-anchor="middle">InfoNCE 下界</text><circle cx="500" cy="185" r="7" fill="#d06d4d"/><path d="M510 185H770" stroke="#d06d4d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#b25)"/><text x="500" y="212" fill="#d06d4d" text-anchor="middle">MINE 下界（训练波动）</text><text x="80" y="175" fill="#53676d" font-size="13">0</text><text x="860" y="175" fill="#53676d" font-size="13" text-anchor="end">1.2 bit</text></g><defs><marker id="b25" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#9fb4b0"/></marker></defs></svg>
