<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vib24t vib24d" viewBox="0 0 920 300"><title id="vib24t">变分信息瓶颈（VIB）的结构</title><desc id="vib24d">输入 X 经编码器 q(t|x) 得到隐表示 T，再经解码器 r(y|t) 预测 Y。虚线回路表示对 q(t|x) 与先验 p(t) 之间的 KL 惩罚，用于控制 I(X;T)。</desc><rect x="1" y="1" width="918" height="298" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750">变分信息瓶颈：编码—瓶颈—解码</text><g font-family="system-ui,'PingFang SC',sans-serif" font-size="15"><rect x="90" y="120" width="150" height="70" rx="12" fill="#eef7f4" stroke="#147f80"/><text x="165" y="150" text-anchor="middle" fill="#203035" font-weight="700">输入 X</text><text x="165" y="172" text-anchor="middle" fill="#53676d" font-size="13">原始观测</text><rect x="335" y="105" width="180" height="100" rx="12" fill="#fff" stroke="#7461ba"/><text x="425" y="140" text-anchor="middle" fill="#203035" font-weight="700">编码器 q(t|x)</text><text x="425" y="164" text-anchor="middle" fill="#53676d" font-size="13">随机隐表示 T</text><text x="425" y="186" text-anchor="middle" fill="#53676d" font-size="13">（瓶颈）</text><rect x="610" y="120" width="150" height="70" rx="12" fill="#eef7f4" stroke="#147f80"/><text x="685" y="150" text-anchor="middle" fill="#203035" font-weight="700">解码器 r(y|t)</text><text x="685" y="172" text-anchor="middle" fill="#53676d" font-size="13">预测 Y</text></g><path d="M240 155H330" stroke="#9fb4b0" stroke-width="2" marker-end="url(#a24)"/><path d="M515 155H605" stroke="#9fb4b0" stroke-width="2" marker-end="url(#a24)"/><path d="M425 210C425 255 165 255 165 195" fill="none" stroke="#d06d4d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a24)"/><text x="300" y="248" font-family="system-ui,'PingFang SC',sans-serif" fill="#d06d4d" font-size="14">β·D(q(t|x)‖p(t)) 约束信息量</text><defs><marker id="a24" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#9fb4b0"/></marker></defs></svg>
