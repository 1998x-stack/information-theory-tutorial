<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mdl22-title mdl22-desc" viewBox="0 0 920 380"><title id="mdl22-title">MDL 的两部分码长形成折衷</title><desc id="mdl22-desc">增加模型复杂度通常降低残差码长，却提高模型描述成本；总码长的最低点给出折衷选择。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" fill="#203035">MDL 的两部分码长形成折衷</text><path d="M28 53H892" stroke="#dce8e4"/><path d="85 300H850M85 300V78" fill="none" stroke="#53676d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M100 105Q260 160 400 225T820 286" fill="none" stroke="#d06d4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M100 285Q290 260 440 210T820 112" fill="none" stroke="#7461ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M100 295Q250 240 390 195Q530 170 650 190Q760 215 820 270" fill="none" stroke="#147f80" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M500 182V300" fill="none" stroke="#53676d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="500" y="155" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="750" text-anchor="middle" fill="#147f80">最短总码长</text><text x="250" y="120" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#7461ba">模型码长 L(M)</text><text x="710" y="135" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#d06d4d">残差码长 L(D|M)</text><text x="85" y="330" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#53676d">简单模型</text><text x="850" y="330" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="end" fill="#53676d">复杂模型 →</text><text x="35" y="95" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#53676d">bits</text></svg>