<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="e25t e25d" viewBox="0 0 920 340"><title id="e25t">四种互信息估计量的对照（教学示意）</title><desc id="e25d">柱状图比较真实互信息与 KSG、KDE、分箱、MINE 的估计值。KSG 最接近真实值，分箱明显低估，KDE 偏高且方差大，MINE 给出不超过真实值的下界。</desc><rect x="1" y="1" width="918" height="338" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750">不同互信息估计量的偏差方向</text><path d="M150 70V290H840" stroke="#9fb4b0" stroke-width="1.5"/><path d="M150 70H840" stroke="#53676d" stroke-width="1.5" stroke-dasharray="6 4"/><text x="700" y="62" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13">真实 MI = 1.00 bit</text><g font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#203035"><rect x="200" y="70" width="90" height="220" rx="6" fill="#147f80"/><text x="245" y="310" text-anchor="middle">真实值</text><text x="245" y="64" text-anchor="middle" font-weight="700">1.00</text><rect x="350" y="78" width="90" height="212" rx="6" fill="#147f80" opacity="0.75"/><text x="395" y="310" text-anchor="middle">KSG</text><text x="395" y="72" text-anchor="middle" font-weight="700">0.97</text><rect x="500" y="109" width="90" height="181" rx="6" fill="#d06d4d" opacity="0.8"/><text x="545" y="310" text-anchor="middle">KDE</text><text x="545" y="103" text-anchor="middle" font-weight="700">0.83</text><rect x="650" y="154" width="90" height="136" rx="6" fill="#7461ba" opacity="0.8"/><text x="695" y="310" text-anchor="middle">分箱</text><text x="695" y="148" text-anchor="middle" font-weight="700">0.62</text></g><text x="495" y="332" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="12" text-anchor="middle">数值为教学示意，仅表示偏差方向与量级；MINE 为下界且随训练波动，未画入</text></svg>
