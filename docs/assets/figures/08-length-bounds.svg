<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s08c-title s08c-desc" viewBox="0 0 920 380"><title id="s08c-title">同一信源下：熵界、Huffman 与 Shannon 码长</title><desc id="s08c-desc">P=(0.4,0.3,0.2,0.1)，熵为1.8464bit，最优Huffman前缀码1.9bit，逐符号Shannon构造2.4bit；均低于H+1。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.4"/><text x="26" y="39" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" fill="#203035" font-weight="750" text-anchor="start">同一信源下：熵界、Huffman 与 Shannon 码长</text><path d="M26 55H894" fill="none" stroke="#dce8e4" stroke-width="1" stroke-linecap="round"/><path d="M105 306H848" fill="none" stroke="#53676d" stroke-width="2" stroke-linecap="round"/><text x="44" y="130" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" fill="#203035" font-weight="750" text-anchor="start">H(X)</text><rect x="190" y="106" width="376.12653317372536" height="40" rx="5" fill="#147f80" stroke="none" stroke-width="1.4"/><text x="582.1265331737254" y="131" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#147f80" font-weight="750" text-anchor="start">1.8464 bits</text><text x="44" y="220" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" fill="#203035" font-weight="750" text-anchor="start">Huffman</text><rect x="190" y="196" width="387.037037037037" height="40" rx="5" fill="#7461ba" stroke="none" stroke-width="1.4"/><text x="593.037037037037" y="221" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#7461ba" font-weight="750" text-anchor="start">1.9000 bits</text><text x="44" y="310" font-family="system-ui,'PingFang SC',sans-serif" font-size="17" fill="#203035" font-weight="750" text-anchor="start">Shannon</text><rect x="190" y="286" width="488.88888888888886" height="40" rx="5" fill="#d06d4d" stroke="none" stroke-width="1.4"/><text x="694.8888888888889" y="311" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" fill="#d06d4d" font-weight="750" text-anchor="start">2.4000 bits</text><text x="104" y="347" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" fill="#53676d" font-weight="500" text-anchor="start">下界 H=1.8464；Shannon 构造保证 L &lt; H+1 = 2.8464</text></svg>
