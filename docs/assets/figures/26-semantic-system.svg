<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f26d-title f26d-desc" viewBox="0 0 960 400"><title id="f26d-title">任务导向通信的端到端路径</title><desc id="f26d-desc">原始数据 X 经语义编码和信道编码发出，经受物理噪声后，接收端先恢复表征再输出任务决策；两端共享知识上下文 K。</desc><rect x="1.5" y="1.5" width="957" height="397" rx="20" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="30" y="44" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" font-weight="750" fill="#203035">任务导向通信的端到端路径</text><path d="M30 59H930" stroke="#dce8e4" stroke-width="1.4"/><rect x="28" y="140" width="160" height="77" rx="11" fill="#eeebfa" stroke="#7461ba" stroke-width="2"/><text x="108" y="184" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" fill="#7461ba">输入 X</text><rect x="210" y="140" width="160" height="77" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="2"/><text x="290" y="184" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" fill="#147f80">语义编码</text><rect x="390" y="140" width="160" height="77" rx="11" fill="#eeebfa" stroke="#7461ba" stroke-width="2"/><text x="470" y="184" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" fill="#7461ba">物理编码</text><rect x="570" y="140" width="160" height="77" rx="11" fill="#ffede5" stroke="#d06d4d" stroke-width="2"/><text x="650" y="184" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" fill="#d06d4d">带噪信道</text><rect x="750" y="140" width="160" height="77" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="2"/><text x="830" y="184" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" fill="#147f80">任务译码</text><path d="M188 179H202M370 179H382M550 179H562M730 179H742" fill="none" stroke="#53676d" stroke-linecap="round" stroke-width="2.8" /><text x="480" y="112" text-anchor="middle" font-family