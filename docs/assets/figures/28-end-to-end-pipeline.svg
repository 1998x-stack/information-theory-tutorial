<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f28e-title f28e-desc" viewBox="0 0 960 400"><title id="f28e-title">压缩 + 纠错 + 噪声 + 译码的闭环</title><desc id="f28e-desc">源消息经 Huffman 压缩、填充、Hamming(7,4) 保护、BSC 翻转、syndrome 纠错、去填充、Huffman 逆变换后恢复。</desc><rect x="1.5" y="1.5" width="957" height="397" rx="20" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="30" y="44" font-family="system-ui,'PingFang SC',sans-serif" font-size="23" font-weight="750" fill="#203035">压缩 + 纠错 + 噪声 + 译码的闭环</text><path d="M30 59H930" stroke="#dce8e4" stroke-width="1.4"/><rect x="24" y="142" width="119" height="89" rx="11" fill="#eeebfa" stroke="#7461ba" stroke-width="2"/><text x="83" y="176" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" fill="#7461ba">原文</text><text x="83" y="207" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="650" fill="#7461ba">AAAABBCD</text><rect x="156" y="142" width="119" height="89" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="2"/><text x="215" y="176" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" fill="#147f80">Huffman</text><text x="215" y="207" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="650" fill="#147f80">14 bits</text><rect x="288" y="142" width="119" height="89" rx="11" fill="#eeebfa" stroke="#7461ba" stroke-width="2"/><text x="347" y="176" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" fill="#7461ba">补齐</text><text x="347" y="207" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="650" fill="#7461ba">16 bits</text><rect x="420" y="142" width="119" height="89" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="2"/><text x="479" y="176" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" fill="#147f80">Hamming</text><text x="479" y="207" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="650" fill="#147f80">28 bits</text><rect x="552" y="142" width="119" height="89" rx="11" fill="#ffede5" stroke="#d06d4d" stroke-width="2"/><text x="611" y="176" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" fill="#d06d4d">BSC</text><text x="611" y="207" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="650" fill="#d06d4d">28 noisy</text><rect x="684" y="142" width="119" height="89" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="2"/><text x="743" y="176" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" fill="#147f80">纠错</text><text x="743" y="207" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="650" fill="#147f80">16→14</text><rect x="816" y="142" width="119" height="89" rx="11" fill="#eeebfa" stroke="#7461ba" stroke-width="2"/><text x="875" y="176" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" fill="#7461ba">还原</text><text x="875" y="207" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="650" fill="#7461ba">AAAABBCD</text><path d="M143 187H156" fill="none" stroke="#53676d" stroke-linecap="round" stroke-width="2.4" /><path d="M275 187H288" fill="none" stroke="#53676d" stroke-linecap="round" stroke-width="2.4" /><path d="M407 187H420" fill="none" stroke="#53676d" stroke-linecap="round" stroke-width="2.4" /><path d="M539 187H552" fill="none" stroke="#53676d" stroke-linecap="round" stroke-width="2.4" /><path d="M671 187H684" fill="none" stroke="#53676d" stroke-linecap="round" stroke-width="2.4" /><path d="M803 187H816" fill="none" stroke="#53676d" stroke-linecap="round" stroke-width="2.4" /><text x="480" y="109" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" fill="#203035">源编码 → 添加冗余 → 穿过带噪信道 → 移除冗余并重建</text><text x="480" y="288" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="600" fill="#53676d">0/1 位翻转  ·  综合征  ·  残余比特误差  ·  完整消息恢复</text><text x="480" y="342" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="600" fill="#203035">蓝色/紫色是编码与恢复；橙色是不可控信道噪声</text></svg>