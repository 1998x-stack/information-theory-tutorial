<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="conv17c-title conv17c-desc" viewBox="0 0 920 380"><title id="conv17c-title">Add–Compare–Select：同一目标状态只保留最低累计度量</title><desc id="conv17c-desc">两条幸存前缀分别以度量3和4到达分支起点，再加分支度量2和1，得到总度量5和5。平局按固定规则选一条；非平局时丢弃较大度量路径，保证最优前缀不丢失。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">Add–Compare–Select：同一目标状态只保留最低累计度量</text><path d="M28 53H892" fill="none" stroke="#dce8e4" stroke-width="1" /><rect x="32" y="104" width="188" height="91" rx="11" fill="#eeeaff" stroke="#7461ba" stroke-width="1.5"/><text x="126" y="140" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#7461ba">候选路径 A</text><text x="126" y="172" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="500" text-anchor="middle" fill="#203035">3 + 2 = 5</text><path d="M221 150L332 150m-8 -6l8 6 -8 6" fill="none" stroke="#7461ba" stroke-width="2.4" stroke-linecap="round"/><rect x="32" y="227" width="188" height="91" rx="11" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="126" y="263" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#d06d4d">候选路径 B</text><text x="126" y="295" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="500" text-anchor="middle" fill="#203035">4 + 1 = 5</text><path d="M221 272L332 272m-8 -6l8 6 -8 6" fill="none" stroke="#d06d4d" stroke-width="2.4" stroke-linecap="round"/><rect x="344" y="141" width="232" height="130" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="460" y="181" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#147f80">目标状态</text><text x="460" y="222" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#203035">比较 5 与 5</text><path d="M578 205L673 205m-8 -6l8 6 -8 6" fill="none" stroke="#147f80" stroke-width="2.4" stroke-linecap="round"/><rect x="684" y="141" width="204" height="130" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="786" y="181" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#147f80">保留 survivor</text><text x="786" y="222" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#53676d">平局按规则选</text><text x="32" y="357" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="start" fill="#53676d">复杂度随状态数和时间步线性增长，而不是枚举所有输入序列。</text></svg>