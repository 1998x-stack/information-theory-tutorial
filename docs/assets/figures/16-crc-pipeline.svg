<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crc16b-title crc16b-desc" viewBox="0 0 920 380"><title id="crc16b-title">CRC 编码器与接收端综合征检查</title><desc id="crc16b-desc">发送端把消息多项式乘x的r次方，再模生成多项式求余数并附加；接收端对整个码字做模除。非零余数表明检测到错误；零余数只表示错误未被该校验发现。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#203035">CRC 编码器与接收端综合征检查</text><path d="M28 53H892" fill="none" stroke="#dce8e4" stroke-width="1" /><rect x="28" y="117" width="180" height="105" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="118" y="151" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#147f80">消息 M(x)</text><text x="118" y="185" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#53676d">追加 r 个 0</text><path d="M210 170L278 170m-8 -6l8 6 -8 6" fill="none" stroke="#147f80" stroke-width="2.4" stroke-linecap="round"/><rect x="287" y="117" width="204" height="105" rx="11" fill="#eeeaff" stroke="#7461ba" stroke-width="1.5"/><text x="389" y="151" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#7461ba">模 G(x) 除法</text><text x="389" y="185" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#53676d">求余数 R(x)</text><path d="M493 170L559 170m-8 -6l8 6 -8 6" fill="none" stroke="#7461ba" stroke-width="2.4" stroke-linecap="round"/><rect x="568" y="117" width="164" height="105" rx="11" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="650" y="151" font-family="system-ui,'PingFang SC',sans-serif" font-size="19" font-weight="750" text-anchor="middle" fill="#d06d4d">附加余数</text><text x="650" y="185" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#53676d">发送 C(x)</text><path d="M735 170L793 170m-8 -6l8 6 -8 6" fill="none" stroke="#d06d4d" stroke-width="2.4" stroke-linecap="round"/><rect x="800" y="117" width="88" height="105" rx="11" fill="#e7f5f2" stroke="#147f80" stroke-width="1.5"/><text x="844" y="151" font-family="system-ui,'PingFang SC',sans-serif" font-size="18" font-weight="750" text-anchor="middle" fill="#147f80">接收</text><text x="844" y="185" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#53676d">余数</text><text x="31" y="291" font-family="system-ui,'PingFang SC',sans-serif" font-size="22" font-weight="750" text-anchor="start" fill="#203035">s(x)=r(x) mod G(x)</text><text x="31" y="326" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#53676d">s(x)≠0：检出错误；s(x)=0：可能无错，也可能发生不可检错误。</text></svg>