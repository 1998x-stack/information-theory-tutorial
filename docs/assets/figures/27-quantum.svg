<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="q27t q27d" viewBox="0 0 920 320"><title id="q27t">冯·诺依曼熵：密度矩阵的对角化</title><desc id="q27d">左图为一般密度矩阵 ρ，右侧经酉变换对角化为特征值 λ1、λ2 的对角矩阵。冯·诺依曼熵 S(ρ)=−Tr(ρ log ρ)=−Σ λi log λi，等于特征值分布的香农熵；当 ρ 为对角矩阵时退化为经典香农熵。</desc><rect x="1" y="1" width="918" height="318" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="36" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750">量子熵 = 密度矩阵特征值的香农熵</text><g font-family="system-ui,'PingFang SC',sans-serif" font-size="14" fill="#203035"><rect x="120" y="110" width="150" height="110" rx="12" fill="#f0ecfb" stroke="#7461ba"/><text x="195" y="150" text-anchor="middle" font-size="22" font-style="italic">ρ</text><text x="195" y="178" text-anchor="middle" font-size="12" fill="#53676d">Hermitian，迹为 1</text><text x="195" y="198" text-anchor="middle" font-size="12" fill="#53676d">半正定</text><rect x="500" y="110" width="150" height="110" rx="12" fill="#eef7f4" stroke="#147f80"/><text x="575" y="145" text-anchor="middle" font-size="13">diag(λ₁, λ₂)</text><text x="575" y="178" text-anchor="middle" font-size="12" fill="#53676d">酉变换不改变特征值</text><text x="575" y="200" text-anchor="middle" font-size="12" fill="#53676d">S 只依赖 λᵢ</text></g><path d="M275 165H495" stroke="#9fb4b0" stroke-width="2" marker-end="url(#a27)"/><text x="385" y="152" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="middle">酉对角化 UρU†</text><text x="460" y="270" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="16" text-anchor="middle">S(ρ) = −Tr(ρ log ρ) = −Σᵢ λᵢ log λᵢ</text><text x="460" y="298" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="middle">ρ 对角时，λᵢ 就是经典概率，S(ρ) 退化为 H(X)</text><defs><marker id="a27" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#9fb4b0"/></marker></defs></svg>
