<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ib24-title ib24-desc" viewBox="0 0 920 380"><title id="ib24-title">信息瓶颈：任务相关的随机压缩</title><desc id="ib24-desc">X 生成随机表示 T，任务标签 Y 通过 X 与 T 相关；目标是压缩 I(X;T) 并保留 I(T;Y)。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" fill="#203035">信息瓶颈：任务相关的随机压缩</text><path d="M28 53H892" stroke="#dce8e4"/><rect x="55" y="145" width="160" height="80" rx="12" fill="#eeeaff" stroke="#7461ba" stroke-width="1.6"/><rect x="375" y="145" width="160" height="80" rx="12" fill="#e7f5f2" stroke="#147f80" stroke-width="1.6"/><rect x="705" y="145" width="160" height="80" rx="12" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.6"/><text x="135" y="190" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#7461ba">输入 X</text><text x="455" y="190" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#147f80">表示 T</text><text x="785" y="190" font-family="system-ui,'PingFang SC',sans-serif" font-size="20" font-weight="750" text-anchor="middle" fill="#d06d4d">任务 Y</text><path d="M215 185H367" fill="none" stroke="#7461ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M535 185H697" fill="none" stroke="#147f80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="295" y="160" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#7461ba">随机编码 p(t|x)</text><text x="615" y="160" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#147f80">预测 p(y|t)</text><text x="295" y="255" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#7461ba">惩罚 I(X;T)：压缩输入细节</text><text x="615" y="295" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#d06d4d">奖励 I(T;Y)：保留任务信息</text><path d="M135 226V275H455V234" fill="none" stroke="#53676d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="455" y="337" font-family="system-ui,'PingFang SC',sans-serif" font-size="15" font-weight="650" text-anchor="middle" fill="#203035">T − X − Y：数据处理不等式 I(T;Y) ≤ I(X;Y)</text></svg>