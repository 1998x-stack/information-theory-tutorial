<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ps18-title ps18-desc" viewBox="0 0 920 440"><title id="ps18-title">2 比特一次一密：每个密文的后验分布仍均匀</title><desc id="ps18-desc">4 行是明文 m，4 列是密文 c，格中是对应的密钥 k=m XOR c，每格概率都是四分之一。因此给定任一密文，各明文的后验概率相同。</desc><rect x="1" y="1" width="918" height="438" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="40" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="21" font-weight="750" text-anchor="start">一次一密的密钥表：每格概率 = 1/4</text><path d="M28 55H892" stroke="#dce8e4" stroke-width="1" fill="none"/><text x="150" y="90" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14" text-anchor="middle">格内填 k = m ⊕ c</text><text x="300" y="120" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">c=00</text><text x="420" y="120" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">c=01</text><text x="540" y="120" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">c=10</text><text x="660" y="120" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#147f80" text-anchor="middle">c=11</text><text x="255" y="166" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#53676d" text-anchor="end">m=00</text><rect x="260" y="140" width="80" height="40" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="300" y="165" font-family="ui-monospace,monospace" font-size="14" fill="#203035" text-anchor="middle">00</text><rect x="380" y="140" width="80" height="40" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="420" y="165" font-family="ui-monospace,monospace" font-size="14" fill="#203035" text-anchor="middle">01</text><rect x="500" y="140" width="80" height="40" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="540" y="165" font-family="ui-monospace,monospace" font-size="14" fill="#203035" text-anchor="middle">10</text><rect x="620" y="140" width="80" height="40" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="660" y="165" font-family="ui-monospace,monospace" font-size="14" fill="#203035" text-anchor="middle">11</text><text x="255" y="218" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#53676d" text-anchor="end">m=01</text><rect x="260" y="192" width="80" height="40" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="300" y="217" font-family="ui-monospace,monospace" font-size="14" fill="#203035" text-anchor="middle">01</text><rect x="380" y="192" width="80" height="40" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="420" y="217" font-family="ui-monospace,monospace" font-size="14" fill="#203035" text-anchor="middle">00</text><rect x="500" y="192" width="80" height="40" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="540" y="217" font-family="ui-monospace,monospace" font-size="14" fill="#203035" text-anchor="middle">11</text><rect x="620" y="192" width="80" height="40" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="660" y="217" font-family="ui-monospace,monospace" font-size="14" fill="#203035" text-anchor="middle">10</text><text x="255" y="270" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#53676d" text-anchor="end">m=10</text><rect x="260" y="244" width="80" height="40" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="300" y="269" font-family="ui-monospace,monospace" font-size="14" fill="#203035" text-anchor="middle">10</text><rect x="380" y="244" width="80" height="40" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="420" y="269" font-family="ui-monospace,monospace" font-size="14" fill="#203035" text-anchor="middle">11</text><rect x="500" y="244" width="80" height="40" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="540" y="269" font-family="ui-monospace,monospace" font-size="14" fill="#203035" text-anchor="middle">00</text><rect x="620" y="244" width="80" height="40" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="660" y="269" font-family="ui-monospace,monospace" font-size="14" fill="#203035" text-anchor="middle">01</text><text x="255" y="322" font-family="ui-monospace,monospace" font-size="15" font-weight="700" fill="#53676d" text-anchor="end">m=11</text><rect x="260" y="296" width="80" height="40" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="300" y="321" font-family="ui-monospace,monospace" font-size="14" fill="#203035" text-anchor="middle">11</text><rect x="380" y="296" width="80" height="40" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="420" y="321" font-family="ui-monospace,monospace" font-size="14" fill="#203035" text-anchor="middle">10</text><rect x="500" y="296" width="80" height="40" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="540" y="321" font-family="ui-monospace,monospace" font-size="14" fill="#203035" text-anchor="middle">01</text><rect x="620" y="296" width="80" height="40" rx="6" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="660" y="321" font-family="ui-monospace,monospace" font-size="14" fill="#203035" text-anchor="middle">00</text><text x="30" y="420" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14" font-weight="500" text-anchor="start">固定任意一列 c，四种 m 各对应一个不同密钥，概率均相等：观察 c 无法把任何一个 m 区分开。</text></svg>