<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pid27t pid27d" viewBox="0 0 920 300"><title id="pid27t">部分信息分解：冗余、独特与协同</title><desc id="pid27d">两个预测源 X₁、X₂ 对目标 Y 的总信息被分解为四块：两者共有的冗余信息、各自独有的信息、以及只有联合起来才能提供的协同信息。XOR 例子（Y=X₁⊕X₂）中总量为 1 bit 且全部是协同。</desc><rect x="1" y="1" width="918" height="298" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="36" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750">PID：总信息如何拆成四块</text><g font-family="system-ui,'PingFang SC',sans-serif" font-size="13"><rect x="150" y="70" width="200" height="150" rx="14" fill="#eef7f4" stroke="#147f80" opacity="0.85"/><rect x="330" y="70" width="200" height="150" rx="14" fill="#fff6ef" stroke="#d06d4d" opacity="0.7"/><text x="230" y="120" text-anchor="middle" fill="#147f80" font-weight="700">X₁ 独特</text><text x="450" y="120" text-anchor="middle" fill="#d06d4d" font-weight="700">X₂ 独特</text><text x="340" y="180" text-anchor="middle" fill="#7461ba" font-weight="700">冗余</text><text x="340" y="205" text-anchor="middle" fill="#53676d">两者共有</text><text x="340" y="95" text-anchor="middle" fill="#203035" font-weight="700">协同</text><text x="340" y="255" text-anchor="middle" fill="#53676d">只有联合可知（如 XOR）</text></g><text x="690" y="110" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="14">I(X₁,X₂;Y) =</text><text x="690" y="140" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13">Red + Unq₁ + Unq₂ + Syn</text><text x="690" y="180" font-family="system-ui,'PingFang SC',sans-serif" fill="#d06d4d" font-size="13">分解不唯一：</text><text x="690" y="202" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13">需要额外的合理性公理</text></svg>
