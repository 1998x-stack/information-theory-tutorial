<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p26t p26d" viewBox="0 0 920 330"><title id="p26t">语法级通信与语义级通信的对比</title><desc id="p26d">上排为经典语法级流程：信源经符号编码、信道、符号译码到信宿，目标是精确恢复符号串。下排为语义级流程：信源经语义编码得到语义表示，经信道后由语义译码生成含义，两端各有一个共享知识库参与编码与解码。</desc><rect x="1" y="1" width="918" height="328" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="36" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750">从传递符号到传递含义</text><g font-family="system-ui,'PingFang SC',sans-serif" font-size="13" fill="#203035"><text x="40" y="86" fill="#53676d" font-weight="700">语法级</text><rect x="120" y="66" width="120" height="44" rx="10" fill="#eef7f4" stroke="#147f80"/><text x="180" y="93" text-anchor="middle">符号编码</text><rect x="290" y="66" width="90" height="44" rx="10" fill="#fff" stroke="#9fb4b0"/><text x="335" y="93" text-anchor="middle">信道</text><rect x="430" y="66" width="120" height="44" rx="10" fill="#eef7f4" stroke="#147f80"/><text x="490" y="93" text-anchor="middle">符号译码</text><rect x="600" y="66" width="120" height="44" rx="10" fill="#f3f9f6" stroke="#9fb4b0"/><text x="660" y="93" text-anchor="middle">精确恢复符号</text><text x="40" y="222" fill="#53676d" font-weight="700">语义级</text><rect x="120" y="200" width="120" height="44" rx="10" fill="#f0ecfb" stroke="#7461ba"/><text x="180" y="227" text-anchor="middle">语义编码</text><rect x="290" y="200" width="90" height="44" rx="10" fill="#fff" stroke="#9fb4b0"/><text x="335" y="227" text-anchor="middle">信道</text><rect x="430" y="200" width="120" height="44" rx="10" fill="#f0ecfb" stroke="#7461ba"/><text x="490" y="227" text-anchor="middle">语义译码</text><rect x="600" y="200" width="120" height="44" rx="10" fill="#fff6ef" stroke="#d06d4d"/><text x="660" y="227" text-anchor="middle">正确理解含义</text><rect x="150" y="278" width="60" height="30" rx="8" fill="#f3f9f6" stroke="#9fb4b0"/><text x="180" y="298" text-anchor="middle" font-size="12">知识库 K</text><rect x="460" y="278" width="60" height="30" rx="8" fill="#f3f9f6" stroke="#9fb4b0"/><text x="490" y="298" text-anchor="middle" font-size="12">知识库 K</text></g><path d="M240 88H288M380 88H428M550 88H598M240 222H288M380 222H428M550 222H598" stroke="#9fb4b0" stroke-width="2"/><path d="M180 244V274M490 244V274" stroke="#d06d4d" stroke-width="1.6" stroke-dasharray="5 4"/></svg>
