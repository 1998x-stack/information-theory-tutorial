<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plane24-title plane24-desc" viewBox="0 0 920 380"><title id="plane24-title">信息平面：压缩与预测相关性的示意权衡</title><desc id="plane24-desc">横轴 I(X;T) 表示表示携带的输入信息，纵轴 I(T;Y) 表示任务相关信息。轨迹仅用于说明权衡，不是普遍训练规律。</desc><rect x="1" y="1" width="918" height="378" rx="18" fill="#fbfdfb" stroke="#dce8e4" stroke-width="1.5"/><text x="28" y="38" font-family="system-ui,'PingFang SC',sans-serif" font-size="21" font-weight="750" fill="#203035">信息平面：压缩与预测相关性的示意权衡</text><path d="M28 53H892" stroke="#dce8e4"/><path d="100 300H850M100 300V78" fill="none" stroke="#53676d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M100 300C200 260 245 180 355 145S570 120 820 100" fill="none" stroke="#147f80" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M100 300C210 275 280 245 390 205S630 165 820 145" fill="none" stroke="#d06d4d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="520" y="80" font-family="system-ui,'PingFang SC',sans-serif" font-size="16" font-weight="750" text-anchor="middle" fill="#147f80">I(T;Y) ↑</text><text x="850" y="326" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="500" text-anchor="end" fill="#53676d">I(X;T) →</text><text x="105" y="95" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#53676d">任务信息</text><rect x="500" y="230" width="335" height="52" rx="9" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.6"/><text x="667" y="261" font-family="system-ui,'PingFang SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#d06d4d">示意前沿；不代表所有网络轨迹</text><text x="110" y="345" font-family="system-ui,'PingFang SC',sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="#53676d">压缩更多 ←</text></svg>