<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cod14a-title cod14a-desc" viewBox="0 0 920 380"><title id="cod14a-title">BSC(0.1)：容量是渐近可靠通信的速率边界</title><desc id="cod14a-desc">容量C=1-h2(0.1)约0.531bit每次信道使用。R小于C存在块误码率趋于0的编码序列；R大于C不能使块误码率趋于0。图形不代表具体码的有限长度表现。</desc><rect x="1" y="1" width="918" height="378" rx="18" stroke="#dce8e4" stroke-width="1.4" fill="#fbfdfb"/><text x="28" y="39" font-size="21" fill="#203035" font-weight="750" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif">BSC(0.1)：容量是渐近可靠通信的速率边界</text><path d="M28 53H890" stroke="#dce8e4" stroke-width="1" fill="none" /><rect x="35" y="115" width="470" height="172" rx="11" stroke="#147f80" stroke-width="1.4" fill="#e0f3ed"/><rect x="505" y="115" width="382" height="172" rx="11" stroke="#d06d4d" stroke-width="1.4" fill="#fff0e8"/><path d="M35 291H887" stroke="#53676d" stroke-width="1.6" fill="none" /><path d="M505 99V300" stroke="#7461ba" stroke-width="2.5" fill="none" stroke-dasharray="7 6"/><text x="267" y="177" font-size="28" fill="#147f80" font-weight="750" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif">R ＜ C</text><text x="267" y="217" font-size="17" fill="#53676d" font-weight="500" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif">渐近可达区域</text><text x="697" y="177" font-size="28" fill="#d06d4d" font-weight="750" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif">R ＞ C</text><text x="697" y="217" font-size="17" fill="#53676d" font-weight="500" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif">不可趋零误差</text><text x="505" y="324" font-size="17" fill="#7461ba" font-weight="750" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif">C≈0.531</text><text x="35" y="351" font-size="14" fill="#53676d" font-weight="500" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif">横轴：R（bit/次信道使用）。等号 R=C 的边界需另行讨论。</text></svg>