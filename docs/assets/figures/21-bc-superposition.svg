<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bc21-title bc21-desc" viewBox="0 0 920 340"><title id="bc21-title">叠加编码：公共层覆盖所有人，私密层只有好用户能分辨</title><desc id="bc21-desc">两个同心点云：外层大云表示公共消息码字，覆盖好用户与差用户；内层小云表示私密消息码字，只有好用户能分辨。差用户把小云视作噪声。</desc><rect x="1" y="1" width="918" height="338" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="34" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750" text-anchor="start">叠加编码：两层码本同心叠放</text><g fill="#147f80" opacity="0.85"><circle cx="170" cy="110" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="230" cy="110" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="290" cy="110" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="350" cy="110" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="410" cy="110" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="470" cy="110" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="170" cy="156" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="230" cy="156" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="290" cy="156" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="350" cy="156" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="410" cy="156" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="470" cy="156" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="170" cy="202" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="230" cy="202" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="290" cy="202" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="350" cy="202" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="410" cy="202" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/><circle cx="470" cy="202" r="20" fill="none" stroke="#147f80" stroke-width="1.2" opacity="0.5"/></g><g fill="#d06d4d"><circle cx="300" cy="160" r="4"/><circle cx="340" cy="160" r="4"/><circle cx="380" cy="160" r="4"/><circle cx="300" cy="194" r="4"/><circle cx="340" cy="194" r="4"/><circle cx="380" cy="194" r="4"/><circle cx="300" cy="228" r="4"/><circle cx="340" cy="228" r="4"/><circle cx="380" cy="228" r="4"/></g><text x="230" y="248" font-family="system-ui,sans-serif" fill="#147f80" font-size="14" font-weight="700" text-anchor="middle">公共层（差用户可解）</text><text x="340" y="270" font-family="system-ui,sans-serif" fill="#c15a3c" font-size="14" font-weight="700" text-anchor="middle">私密层（好用户可解）</text><rect x="560" y="90" width="300" height="150" rx="10" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.5"/><text x="710" y="130" font-family="system-ui,sans-serif" fill="#c15a3c" font-size="15" font-weight="700" text-anchor="middle">解码顺序（好用户）</text><text x="710" y="160" font-family="system-ui,sans-serif" fill="#203035" font-size="14" text-anchor="middle">1. 解公共层</text><text x="710" y="184" font-family="system-ui,sans-serif" fill="#203035" font-size="14" text-anchor="middle">2. 减去公共层</text><text x="710" y="208" font-family="system-ui,sans-serif" fill="#203035" font-size="14" text-anchor="middle">3. 在剩余上解私密层</text><text x="30" y="318" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="13" text-anchor="start">差用户只看到公共层；私密层对它只是额外噪声。这就是叠加编码的直观。</text></svg>