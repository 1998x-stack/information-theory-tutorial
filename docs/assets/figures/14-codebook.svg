<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cod14b-title cod14b-desc" viewBox="0 0 920 380"><title id="cod14b-title">把 2 bit 消息映射到 8 bit 码字：冗余拉开距离</title><desc id="cod14b-desc">4个消息00、01、10、11映射为长度8的二进制码字00000000、11110000、00001111、11111111，码率R=2/8=0.25。输出可能被BSC随机翻转，译码使用最近汉明距离。</desc><rect x="1" y="1" width="918" height="378" rx="18" stroke="#dce8e4" stroke-width="1.4" fill="#fbfdfb"/><text x="28" y="39" font-size="21" fill="#203035" font-weight="750" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif">把 2 bit 消息映射到 8 bit 码字：冗余拉开距离</text><path d="M28 53H890" stroke="#dce8e4" stroke-width="1" fill="none" /><rect x="40" y="100" width="404" height="88" rx="11" stroke="#147f80" stroke-width="1.4" fill="#e8f6f1"/><text x="59" y="129" font-size="17" fill="#203035" font-weight="750" text-anchor="start" font-family="system-ui,'PingFang SC',sans-serif">消息 00</text><rect x="58" y="142" width="35" height="32" rx="3" stroke="none" stroke-width="1.4" fill="#147f80"/><text x="75" y="164" font-size="15" fill="white" font-weight="750" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif">0</text><rect x="103" y="142" width="35" height="32" rx="3" stroke="none" stroke-width="1.4" fill="#147f80"/><text x="120" y="164" font-size="15" fill="white" font-weight="750" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif">0</text><rect x="148" y="142" width="35" height="32" rx="3" stroke="none" stroke-width="1.4" fill="#147f80"/><text x="165" y="164" font-size="15" fill="white" font-weight="750" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif">0</text><rect x="193" y="142" width="35" height="32" rx="3" stroke="none" stroke-width="1.4" fill="#147f80"/><text x="210" y="164" font-size="15" fill="white" font-weight="750" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif">0</text><rect x="238" y="142" width="35" height="32" rx="3" stroke="none" stroke-width="1.4" fill="#147f80"/><text