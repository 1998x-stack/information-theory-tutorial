<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p28t p28d" viewBox="0 0 920 250"><title id="p28t">端到端通信系统：信源编码、信道编码与信道</title><desc id="p28d">原始数据依次经过信源编码（压缩）、信道编码（加冗余纠错）、信道（叠加噪声）、信道译码（纠错）与信源译码（解压），得到恢复数据。噪声源叠加在信道上。每一级都对应前面某一章的具体算法。</desc><rect x="1" y="1" width="918" height="248" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="34" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="20" font-weight="750">把 28 章串成一条链路</text><g font-family="system-ui,'PingFang SC',sans-serif" font-size="12.5" fill="#203035"><rect x="40" y="90" width="110" height="60" rx="10" fill="#f3f9f6" stroke="#9fb4b0"/><text x="95" y="116" text-anchor="middle">原始数据</text><text x="95" y="136" text-anchor="middle" fill="#53676d">源比特</text><rect x="185" y="90" width="120" height="60" rx="10" fill="#eef7f4" stroke="#147f80"/><text x="245" y="112" text-anchor="middle">信源编码</text><text x="245" y="132" text-anchor="middle" fill="#53676d">Huffman/算术</text><rect x="340" y="90" width="120" height="60" rx="10" fill="#eef7f4" stroke="#147f80"/><text x="400" y="112" text-anchor="middle">信道编码</text><text x="400" y="132" text-anchor="middle" fill="#53676d">Hamming/卷积</text><rect x="495" y="90" width="100" height="60" rx="10" fill="#fff" stroke="#9fb4b0"/><text x="545" y="116" text-anchor="middle">信道</text><text x="545" y="136" text-anchor="middle" fill="#53676d">BSC/AWGN</text><rect x="630" y="90" width="120" height="60" rx="10" fill="#f0ecfb" stroke="#7461ba"/><text x="690" y="112" text-anchor="middle">信道译码</text><text x="690" y="132" text-anchor="middle" fill="#53676d">纠错</text><rect x="785" y="90" width="100" height="60" rx="10" fill="#f3f9f6" stroke="#9fb4b0"/><text x="835" y="116" text-anchor="middle">恢复</text><text x="835" y="136" text-anchor="middle" fill="#53676d">数据</text></g><path d="M150 120H183M305 120H338M460 120H493M595 120H628M750 120H783" stroke="#9fb4b0" stroke-width="2"/><rect x="495" y="180" width="100" height="40" rx="10" fill="#fff6ef" stroke="#d06d4d"/><text x="545" y="205" text-anchor="middle" font-family="system-ui,'PingFang SC',sans-serif" font-size="12.5" fill="#203035">噪声源</text><path d="M545 180V152" stroke="#d06d4d" stroke-width="2" marker-end="url(#n28)"/><defs><marker id="n28" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#d06d4d"/></marker></defs></svg>
