<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ru18-title ru18-desc" viewBox="0 0 920 430"><title id="ru18-title">同一密钥加密两条明文：两段密文异或与密钥无关</title><desc id="ru18-desc">m1=01、m2=10，四种密钥下分别得到不同的 c1、c2，但 c1 XOR c2 恒等于 11，即 m1 XOR m2。</desc><rect x="1" y="1" width="918" height="428" rx="18" stroke="#dce8e4" stroke-width="1.5" fill="#fbfdfb"/><text x="28" y="40" font-family="system-ui,'PingFang SC',sans-serif" fill="#203035" font-size="21" font-weight="750" text-anchor="start">密钥复用：异或后密钥消失</text><path d="M28 55H892" stroke="#dce8e4" stroke-width="1" fill="none"/><text x="430" y="100" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="15" font-weight="600" text-anchor="middle">m₁ = 01，m₂ = 10 ⇒ m₁⊕m₂ = 11</text><rect x="120" y="126" width="120" height="48" rx="8" fill="#eef4f7" stroke="#53676d" stroke-width="1.2"/><text x="180" y="156" font-family="ui-monospace,monospace" font-size="16" fill="#203035" text-anchor="middle">k=00</text><rect x="300" y="126" width="110" height="48" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="355" y="156" font-family="ui-monospace,monospace" font-size="16" fill="#147f80" text-anchor="middle">c₁=01</text><rect x="450" y="126" width="110" height="48" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="505" y="156" font-family="ui-monospace,monospace" font-size="16" fill="#147f80" text-anchor="middle">c₂=10</text><rect x="600" y="126" width="140" height="48" rx="8" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.6"/><text x="670" y="156" font-family="ui-monospace,monospace" font-size="16" fill="#c15a3c" text-anchor="middle">c₁⊕c₂=11</text><rect x="120" y="184" width="120" height="48" rx="8" fill="#eef4f7" stroke="#53676d" stroke-width="1.2"/><text x="180" y="214" font-family="ui-monospace,monospace" font-size="16" fill="#203035" text-anchor="middle">k=01</text><rect x="300" y="184" width="110" height="48" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="355" y="214" font-family="ui-monospace,monospace" font-size="16" fill="#147f80" text-anchor="middle">c₁=00</text><rect x="450" y="184" width="110" height="48" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="505" y="214" font-family="ui-monospace,monospace" font-size="16" fill="#147f80" text-anchor="middle">c₂=11</text><rect x="600" y="184" width="140" height="48" rx="8" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.6"/><text x="670" y="214" font-family="ui-monospace,monospace" font-size="16" fill="#c15a3c" text-anchor="middle">c₁⊕c₂=11</text><rect x="120" y="242" width="120" height="48" rx="8" fill="#eef4f7" stroke="#53676d" stroke-width="1.2"/><text x="180" y="272" font-family="ui-monospace,monospace" font-size="16" fill="#203035" text-anchor="middle">k=10</text><rect x="300" y="242" width="110" height="48" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="355" y="272" font-family="ui-monospace,monospace" font-size="16" fill="#147f80" text-anchor="middle">c₁=11</text><rect x="450" y="242" width="110" height="48" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="505" y="272" font-family="ui-monospace,monospace" font-size="16" fill="#147f80" text-anchor="middle">c₂=00</text><rect x="600" y="242" width="140" height="48" rx="8" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.6"/><text x="670" y="272" font-family="ui-monospace,monospace" font-size="16" fill="#c15a3c" text-anchor="middle">c₁⊕c₂=11</text><rect x="120" y="300" width="120" height="48" rx="8" fill="#eef4f7" stroke="#53676d" stroke-width="1.2"/><text x="180" y="330" font-family="ui-monospace,monospace" font-size="16" fill="#203035" text-anchor="middle">k=11</text><rect x="300" y="300" width="110" height="48" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="355" y="330" font-family="ui-monospace,monospace" font-size="16" fill="#147f80" text-anchor="middle">c₁=10</text><rect x="450" y="300" width="110" height="48" rx="8" fill="#e7f5f2" stroke="#147f80" stroke-width="1.2"/><text x="505" y="330" font-family="ui-monospace,monospace" font-size="16" fill="#147f80" text-anchor="middle">c₂=01</text><rect x="600" y="300" width="140" height="48" rx="8" fill="#fff0e8" stroke="#d06d4d" stroke-width="1.6"/><text x="670" y="330" font-family="ui-monospace,monospace" font-size="16" fill="#c15a3c" text-anchor="middle">c₁⊕c₂=11</text><text x="30" y="410" font-family="system-ui,'PingFang SC',sans-serif" fill="#53676d" font-size="14" font-weight="500" text-anchor="start">橘色列恒为 11：它只含明文信息，不含密钥信息。这正是二次使用同一密钥的致命泄漏。</text></svg>