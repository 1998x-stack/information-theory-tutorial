name: Validate tutorial
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify generated Pages output
        run: python3 scripts/build.py --check
      - name: Validate chapters and assets
        run: python3 scripts/validate.py
      - name: Test information theory examples
        run: python3 -m unittest discover -s tests -v
